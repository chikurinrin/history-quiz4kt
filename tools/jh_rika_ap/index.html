    <div class="chips">${us.map(u=>{const k=c+"|"+u,cnt=D.filter(q=>q.c===c&&q.u===u).reduce((a,q)=>a+q.i.length,0);return `<button class="chip uchip" data-unit="${esc(k)}" aria-pressed="${S.units.includes(k)}">${esc(u)}<small>${cnt}</small></button>`;}).join("")}</div></div>`;}).join("")}
  ${sel?`<div class="actions"><button class="btn ghost" id="rclear">選択をすべて解除（全範囲にもどす）</button></div>`:""}</div></details>`;
}
function bindRange(){
  const r=app.querySelector("details.range");if(!r)return;
  r.ontoggle=()=>{S.rangeOpen=r.open;save();};
  const keep=()=>{const y=window.scrollY;save();home();window.scrollTo(0,y);};
  app.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{const k=b.dataset.unit;S.units=S.units.includes(k)?S.units.filter(x=>x!==k):S.units.concat(k);keep();});
  app.querySelectorAll("[data-rall]").forEach(b=>b.onclick=()=>{const c=b.dataset.rall;const us=[...new Set(cur().filter(q=>q.c===c).map(q=>q.u))].map(u=>c+"|"+u);const all=us.every(k=>S.units.includes(k));S.units=all?S.units.filter(k=>!us.includes(k)):[...new Set(S.units.concat(us))];keep();});
  const c=app.querySelector("#rclear");if(c)c.onclick=()=>{S.units=[];keep();};
}
function cardsOf(qs){const a=[];qs.forEach(q=>q.i.forEach((_,k)=>{const c={q,k};if(!S.weak||gradeOf(c)!=="o")a.push(c);}));return a;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let mode="quiz";

function tally(qs){let o=0,t=0,x=0,n=0;qs.forEach(q=>grades(q).forEach(v=>{n++;if(v==="o")o++;else if(v==="t")t++;else if(v==="x")x++;}));return {o,t,x,n};}
function pct(a,n){return n?Math.round(a/n*100):0;}
function bar(s){const w=v=>(s.n?v/s.n*100:0).toFixed(2)+"%";return `<div class="bar" role="img" aria-label="○${s.o}問、△${s.t}問、×${s.x}問、未${s.n-s.o-s.t-s.x}問"><i class="bo" style="width:${w(s.o)}"></i><i class="bt" style="width:${w(s.t)}"></i><i class="bx" style="width:${w(s.x)}"></i></div>`;}
function progress(D){
  if(!S.open)S.open={};
  return `<section class="prog"><div class="label">分野別の達成度</div>
  <div class="plegend"><span><i class="bo"></i>○</span><span><i class="bt"></i>△</span><span><i class="bx"></i>×</span><span><i></i>未</span><span class="sub">数字は○の割合。分野をタップすると単元別に表示。単元をタップするとその単元を出題</span></div>
  ${["地理","歴史","公民"].map(cat=>{const qs=D.filter(q=>q.c===cat);const s=tally(qs);const units=[...new Set(qs.map(q=>q.u))];
    return `<details class="pc" data-c="${cat}" ${S.open[cat]?"open":""}><summary><span class="tag t-${cat}">${cat}</span><span class="pnum">${pct(s.o,s.n)}<small>%</small></span>${bar(s)}<span class="pcnt">${s.o}/${s.n}</span></summary>
    <div class="units">${units.map(u=>{const us=tally(qs.filter(q=>q.u===u));return `<button class="urow" data-uc="${cat}" data-u="${esc(u)}"><span class="uname">${esc(u)}</span>${bar(us)}<span class="pcnt">${pct(us.o,us.n)}%</span></button>`;}).join("")}</div></details>`;}).join("")}
  </section>`;
}

/* ---- 学習記録（連続日数・今日の解答数） ---- */
if(!S.log)S.log={};
if(S.auto==null)S.auto=true;
function logOne(){const d=today();S.log[d]=(S.log[d]||0)+1;}
function streak(){let n=0,d=today();if(!S.log[d])d=addDays(d,-1);while(S.log[d]){n++;d=addDays(d,-1);}return n;}

/* ---- 1セット分の記録（結果画面用） ---- */
let SES=null,scr="home";
function start(arr,label){if(!arr.length)return;SES={label:label||"",cards:arr,res:{}};queue=arr;pos=0;question();}
function leave(){if(SES&&Object.keys(SES.res).length)result();else home();}

/* ---- 検索 ---- */
let SEARCH="";
function norm(s){return (s||"").normalize("NFKC").toLowerCase().replace(/[\s・、。「」『』（）()\-ー－〜~]/g,"").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));}
function matchTopic(q,w){if(!w)return true;const n=norm(w);return [q.t,q.u].concat(...q.i).some(x=>norm(x).includes(n));}
function listHTML(tp){
  return tp.length?tp.map((q,n)=>`${(n===0||tp[n-1].u!==q.u||tp[n-1].c!==q.c)?`<div class="grp">${q.c}　${esc(q.u)}</div>`:""}<button class="row" data-id="${q.id}"><span class="tag t-${q.c}">${q.c}</span><span class="ttl">${esc(q.t)}<span class="unit">${q.i.length}問</span></span><span class="marks">${grades(q).map(v=>`<i class="dot ${v}"></i>`).join("")}</span></button>`).join(""):`<div class="empty">${SEARCH?"見つかりませんでした。別の言葉で検索してください。":"条件に合う問題はありません。全部○になっています。"}</div>`;
}

function modeTabs(){return `<div class="modes" role="tablist" aria-label="出題形式">${[["exp","説明問題","用語→説明"],["rev","一問一答","説明→用語"],["sort","年代並べ替え","古い順に"]].map(([m,a,b])=>`<button role="tab" class="mtab" data-mode="${m}" aria-selected="${(S.mode||"exp")===m}">${a}<span>${b}</span></button>`).join("")}</div>`;}
function bindModes(){app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save();home();});}
function dayBadge(){const st=streak(),td=S.log[today()]||0;return `<div class="days"><span><b>${st}</b>日連続</span><span>今日 <b>${td}</b>問</span></div>`;}

function home(){
  stopListen();ttsStop();scr="home";SES=null;
  if(S.mode==="sort")return sortHome();
  const D=cur();const all=D.reduce((a,q)=>a+q.i.length,0);
  let o=0,t=0,x=0;D.forEach(q=>grades(q).forEach(v=>{if(v==="o")o++;else if(v==="t")t++;else if(v==="x")x++;}));
  const tp=topics().filter(q=>!S.weak||grades(q).some(v=>v!=="o"));
  const cards=cardsOf(tp);
  const rv=reviewCards();const up=upcoming();
  const fresh=allCards(topics()).filter(c=>!gradeOf(c)).length;
  const rvBody=rv.length
    ?`<div class="rv-n"><b>${rv.length}</b>問</div><div class="sub">×→△→○の順に出題します</div><div class="actions"><button class="btn pen" id="rvq">復習を解く</button>${TTS?`<button class="btn ghost" id="rvl">聞き流す</button>`:""}</div>`
    :`<div class="sub">今日の復習はありません。${up?`次は${+up.d.split("-")[1]}/${+up.d.split("-")[2]}に${up.cnt}問です。`:"問題に○△×をつけると、ここに復習が出てきます。"}</div>`;
  app.innerHTML=`
  <div class="head"><div><h1>社会 記述チェック</h1><div class="sub">${S.mode==="rev"?"一問一答（説明→用語）":"説明問題"} ${all}問（${D.length}テーマ）</div></div>${dayBadge()}</div>
  ${modeTabs()}
  <div class="stats"><span><b>${o}</b> ○</span><span><b>${t}</b> △</span><span><b>${x}</b> ×</span><span><b>${all-o-t-x}</b> 未</span></div>
  <div class="chips" role="group" aria-label="分野">${CATS.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${S.cat===c}">${c}</button>`).join("")}</div>
  ${rangeHTML()}
  <section class="review"><div class="label">今日の復習${S.units.length?"（選んだ単元）":S.cat==="すべて"?"":"（"+S.cat+"）"}</div>${rvBody}<div class="sub">×は翌日、△は3日後、○は1週間後（続けて○なら2週間後、1か月後）にもう一度出題します。まだ解いていない問題：${fresh}問</div>${fresh?`<div class="actions"><button class="btn ghost" id="newq">まだ解いていない問題から10問</button></div>`:""}</section>
  ${progress(D)}
  <div class="chips"><button class="chip" id="weak" aria-pressed="${S.weak}">○以外の問題だけ</button></div>
  <div class="actions"><button class="btn" id="seq" ${cards.length?"":"disabled"}>順番に解く（${cards.length}問）</button><button class="btn ghost" id="rnd" ${cards.length?"":"disabled"}>ランダムに解く</button><button class="btn ghost" id="r10" ${cards.length?"":"disabled"}>ランダム10問</button>${TTS?`<button class="btn ghost" id="lst" ${cards.length?"":"disabled"}>聞き流す</button>`:""}</div>
  <div class="search"><label class="label" for="find">テーマ・用語を検索</label><input id="find" type="search" placeholder="例：地租改正、リアス海岸、累進課税" value="${esc(SEARCH)}" autocomplete="off"></div>
  <div class="legend">テーマを選ぶと、そのテーマの問題を順に出題します。点は各問題の自己採点（緑○・黄△・赤×・白は未採点）</div>
  <div class="list" id="list">${listHTML(tp.filter(q=>matchTopic(q,SEARCH)))}</div>
  ${voiceHTML()}
  ${backupHTML()}
  <div class="legend keys">パソコンでは、スペースキーで「答えを見る／次へ」、1・2・3キーで ○・△・× をつけられます。</div>`;
  app.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;S.units=S.units.filter(k=>S.cat==="すべて"||k.startsWith(S.cat+"|"));save();home();});
  bindRange();
  app.querySelectorAll("details.pc").forEach(d=>d.ontoggle=()=>{S.open=S.open||{};S.open[d.dataset.c]=d.open;save();});
  app.querySelectorAll(".urow").forEach(b=>b.onclick=()=>{const qs=D.filter(q=>q.c===b.dataset.uc&&q.u===b.dataset.u);start(cardsOf(qs),b.dataset.uc+"・"+b.dataset.u);});
  bindModes();
  app.querySelector("#weak").onclick=()=>{S.weak=!S.weak;save();home();};
  const on=(id,f)=>{const b=app.querySelector(id);if(b)b.onclick=f;};
  on("#seq",()=>start(cards.slice(),"順番に解く"));

  on("#r10",()=>start(shuffle(cards.slice()).slice(0,10),"ランダム10問"));
  on("#lst",()=>listen(cards.slice()));
  on("#rvq",()=>start(rv,"今日の復習"));
  on("#rvl",()=>listen(rv));
  on("#newq",()=>start(shuffle(allCards(topics()).filter(c=>!gradeOf(c))).slice(0,10),"新しい問題10問"));
  const bindRows=()=>app.querySelectorAll(".row").forEach(b=>b.onclick=()=>{const q=D.find(q=>q.id===b.dataset.id);start(cardsOf([q]),q.t);});
  bindRows();
  const f=app.querySelector("#find");
  f.oninput=()=>{SEARCH=f.value;app.querySelector("#list").innerHTML=listHTML(tp.filter(q=>matchTopic(q,SEARCH)));bindRows();};
  bindBackup();bindVoice();

function topbar(){return `<div class="nav"><button class="btn ghost" id="back">← ${SES&&Object.keys(SES.res).length?"終了":"一覧"}</button><span class="sub" style="align-self:center">${pos+1} / ${queue.length}</span></div><div class="pbar"><i style="width:${(pos/queue.length*100).toFixed(1)}%"></i></div>`;}
function head(c){return `<div class="qno"><span class="tag t-${c.q.c}">${c.q.c}</span><span>${c.q.u===c.q.t?"":esc(c.q.u)+"・"}${esc(c.q.t)}（${c.k+1}/${c.q.i.length}）</span></div>`;}

/* 一問一答の入力を判定（カタカナ・ひらがな、かっこ内の別名も可） */
function judge(c,guess){
  if(!guess||!guess.trim())return null;
  const term=c.q.i[c.k][0],g=norm(guess);
  const cands=[term,term.replace(/[（(].*?[）)]/g,"")];(term.match(/[（(](.*?)[）)]/g)||[]).forEach(m=>cands.push(m.slice(1,-1)));
  return cands.some(x=>norm(x)===g);
}

function question(){
  ttsStop();scr="q";
  const c=queue[pos];const pr=qPrompt(c);
  app.innerHTML=`${topbar()}
  <div class="sheet">
    ${head(c)}
    <div class="qtext" id="qtext">${esc(pr)}</div>${c.q.rev?`<div class="ask">これを何というか答えよ。</div>`:""}
    ${speakBar("sayQ","問題を読む")}
    ${c.q.rev
      ?`<div><label class="label" for="memo">答えを入力（入力すると自動で判定します。書かなくても可）</label><input id="memo" class="guess" type="text" autocomplete="off" placeholder="用語を入力" value="${esc(S.memo[mkey(c)]||"")}"></div>`
      :`<div><label class="label" for="memo">自分の答え（書かなくても可）</label><textarea id="memo" placeholder="思い出せることを書き出してみよう">${esc(S.memo[mkey(c)]||"")}</textarea></div>`}
  </div>
  <div class="nav"><button class="btn ghost" id="prev" ${pos?"":"disabled"}>← 前の問題</button><button class="btn pen" id="show">答えを見る</button></div>`;
  app.querySelector("#back").onclick=leave;
  const m=app.querySelector("#memo");m.oninput=()=>{S.memo[mkey(c)]=m.value;save();};
  if(c.q.rev)m.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();answer();}};
  app.querySelector("#prev").onclick=()=>{pos--;question();};
  app.querySelector("#show").onclick=answer;
  const sq=app.querySelector("#sayQ");
  if(sq){sq.onclick=toggle(sq,()=>ttsPlay([{text:sayQ(c),el:app.querySelector("#qtext")}],sq));bindRate();}
  window.scrollTo(0,0);
}

function grade(c,v){
  const before=gradeOf(c);setGrade(c,v);
  if(gradeOf(c)){if(!before)logOne();if(SES)SES.res[rkey(c)]=v;}else if(SES)delete SES.res[rkey(c)];
  save();
}
function goNext(){if(pos<queue.length-1){pos++;question();}else leave();}

function answer(){
  ttsStop();scr="a";
  const c=queue[pos];const memo=S.memo[mkey(c)];
  const ok=c.q.rev?judge(c,memo):null;
  if(ok===true&&gradeOf(c)!=="o")grade(c,"o");
  app.innerHTML=`${topbar()}
  <div class="sheet">
    ${head(c)}
    <div class="qtext" style="font-size:1rem;color:var(--muted)">${esc(qPrompt(c))}</div>
    ${memo?`<div><div class="label">あなたの答え</div><div class="memo">${esc(memo)}</div>${ok===true?`<div class="verdict ok">正解！ ○をつけました</div>`:ok===false?`<div class="verdict ng">答えとちがうようです。書き方のちがいだけなら○をつけてください</div>`:""}</div>`:""}
    <div class="ans">${ansHTML(c).replace("__ID__","it")}</div>
    ${c.q.rev?"":`<div class="legend"><b class="kw">マーカー</b>は重要語、<b class="yr">赤字</b>は年代。これが書けていれば○の目安です。</div>`}
    ${speakBar("sayA","答えを読む")}
    <div class="label">自己採点：○（書けた）△（一部）×（書けなかった）</div>
    <div class="grade" role="group" aria-label="自己採点">${["o","t","x"].map((v,i)=>`<button class="g ${v}" data-v="${v}" aria-pressed="${gradeOf(c)===v}">${MARK[v]}<small>${i+1}</small></button>`).join("")}</div>
    <div class="sub" id="nextrv">${nextLabel(c)}</div>
    <label class="auto"><input type="checkbox" id="auto" ${S.auto?"checked":""}> 採点したら自動で次の問題へ</label>
  </div>
  <div class="nav"><button class="btn ghost" id="again">問題にもどる</button><button class="btn" id="next">${pos<queue.length-1?"次の問題 →":"結果を見る"}</button></div>`;
  app.querySelector("#back").onclick=leave;
  let timer=null,pend=false;
  app.querySelectorAll(".g").forEach(b=>b.onclick=()=>{
    clearTimeout(timer);grade(c,b.dataset.v);
    app.querySelectorAll(".g").forEach(x=>x.setAttribute("aria-pressed",gradeOf(c)===x.dataset.v));
    app.querySelector("#nextrv").textContent=nextLabel(c);
    pend=false;
    if(S.auto&&gradeOf(c)){const sa=app.querySelector("#sayA");if(sa&&sa.getAttribute("aria-pressed")==="true"){pend=true;}else{const here=pos;timer=setTimeout(()=>{if(scr==="a"&&pos===here)goNext();},450);}}
  });
  app.querySelector("#auto").onchange=e=>{S.auto=e.target.checked;save();};
  const sa=app.querySelector("#sayA");
  const here=pos;
  if(sa){sa.onclick=()=>{if(sa.getAttribute("aria-pressed")==="true"){ttsStop();if(pend&&scr==="a"&&pos===here)goNext();}else ttsPlay([{text:aText(c),el:app.querySelector("#it")}],sa,()=>{if(pend&&scr==="a"&&pos===here)setTimeout(()=>{if(scr==="a"&&pos===here)goNext();},400);});};bindRate();}
  app.querySelector("#again").onclick=question;
  app.querySelector("#next").onclick=goNext;
  window.scrollTo(0,0);
}

/* ---- 結果画面 ---- */
function result(){
  ttsStop();scr="r";
  const s=SES;const ks=Object.keys(s.res);const cnt={o:0,t:0,x:0};ks.forEach(k=>cnt[s.res[k]]++);
  const miss=s.cards.filter(c=>s.res[rkey(c)]==="x"||s.res[rkey(c)]==="t");
  const rate=pct(cnt.o,ks.length);
  app.innerHTML=`<div class="sheet result">
    <div class="label">${esc(s.label||"結果")}</div>
    <div class="score"><b>${rate}</b><small>%</small><span class="sub">○の割合（採点した${ks.length}問中）</span></div>
    <div class="stats"><span><b>${cnt.o}</b> ○</span><span><b>${cnt.t}</b> △</span><span><b>${cnt.x}</b> ×</span><span><b>${s.cards.length-ks.length}</b> 未採点</span></div>
    <div class="sub">${rate>=90?"すばらしい出来です。この調子で復習を続けましょう。":rate>=60?"よくできています。×と△をもう一度確認しましょう。":"まずは×と△をくり返して、答えの重要語を覚えましょう。"}</div>
    ${miss.length?`<div class="label">もう一度確認したい問題</div><ul class="miss">${miss.map(c=>`<li><span class="mk ${s.res[rkey(c)]}">${MARK[s.res[rkey(c)]]}</span><span>${esc(c.q.rev?c.q.i[c.k][0]:qPrompt(c))}</span></li>`).join("")}</ul>`:""}
    <div class="actions">${miss.length?`<button class="btn pen" id="retry">×と△をもう一度（${miss.length}問）</button>`:""}<button class="btn ghost" id="home">一覧にもどる</button></div>
  </div>`;
  const r=app.querySelector("#retry");if(r)r.onclick=()=>start(miss,"×と△のやり直し");
  app.querySelector("#home").onclick=home;
  window.scrollTo(0,0);
}

/* ---- 記録の引き継ぎ（コピー＆貼り付け） ---- */

function fillVoices(){

  sel.dataset.filled=vs.length?"1":"";

function bindVoice(){
  const sel=document.getElementById("vsel");if(!sel)return;fillVoices();
  sel.onchange=()=>{S.voice=sel.value;save();pickVoice();fillVoices();};

,[1889,"大日本帝国憲法が発布された"],[1890,"第1回帝国議会が開かれた"],[1894,"日清戦争が始まり、領事裁判権が撤廃された"],[1895,"下関条約が結ばれ、三国干渉が起きた"],[1901,"八幡製鉄所が操業を始めた"],[1902,"日英同盟が結ばれた"],[1904,"日露戦争が始まった"],[1905,"ポーツマス条約が結ばれた"],[1910,"韓国併合が行われた"],[1911,"関税自主権が完全に回復した"],[1914,"第一次世界大戦が始まった"],[1915,"中国に二十一か条の要求を出した"],[1917,"ロシア革命が起きた"],[1918,"米騒動が起き、原敬が本格的な政党内閣をつくった"],[1919,"ベルサイユ条約が結ばれ、朝鮮で三・一独立運動が起きた"],[1920,"国際連盟が発足した"],[1921,"ワシントン会議が始まった"],[1923,"関東大震災が起きた"],[1925,"普通選挙法と治安維持法が制定された"],[1929,"世界恐慌が始まった"],[1931,"満州事変が起きた"],[1932,"五・一五事件が起きた"],[1933,"日本が国際連盟を脱退した"],[1936,"二・二六事件が起きた"],[1937,"日中戦争が始まった"],[1938,"国家総動員法が制定された"],[1939,"第二次世界大戦が始まった"],[1940,"日独伊三国同盟が結ばれ、大政翼賛会ができた"],[1941,"太平洋戦争が始まった"],[1945,"ポツダム宣言を受け入れて日本が降伏した"],[1946,"日本国憲法が公布された"],[1947,"日本国憲法が施行され、教育基本法が制定された"],[1950,"朝鮮戦争が始まった"],[1951,"サンフランシスコ平和条約が結ばれた"],[1956,"日ソ共同宣言が出され、日本が国際連合に加盟した"],[1960,"日米安全保障条約が改定された"],[1964,"東京オリンピックが開かれ、東海道新幹線が開通した"],[1965,"日韓基本条約が結ばれた"],[1972,"沖縄が日本に復帰し、日中共同声明が出された"],[1973,"石油危機が起き、高度経済成長が終わった"],[1978,"日中平和友好条約が結ばれた"],[1989,"ベルリンの壁が取りこわされ、冷戦の終結が宣言された"],[1990,"東西ドイツが統一された"],[1991,"ソ連が解体し、バブル経済が崩壊した"],[1993,"55年体制が終わり、EUが発足した"],[1995,"阪神・淡路大震災が起きた"],[2011,"東日本大震災が起きた"]];
const ERAS=[["すべて",-1e9,1e9],["古代",-1e9,1085],["中世",1086,1572],["近世",1573,1852],["近代",1853,1945],["現代",1946,1e9]];

function yearLabel(y){return y<0?`紀元前${-y}年`:`${y}年`;}
function eraOf(y){return ERAS.slice(1).find(e=>y>=e[1]&&y<=e[2])[0];}
function makeSort(){
  const [,lo,hi]=ERAS.find(e=>e[0]===S.era);const pool=EV.filter(e=>e[0]>=lo&&e[0]<=hi);
  for(let tries=0;tries<50;tries++){
    const i=Math.floor(Math.random()*pool.length);const win=pool.slice(Math.max(0,i-6),i+7);
    const pick=shuffle(win.slice()).slice(0,4);
    if(new Set(pick.map(e=>e[0])).size===4)return pick;
  }
  return shuffle(pool.slice()).slice(0,4);
}

function sortQ(){

  </div>
  <div class="nav">${done?`<span></span><button class="btn" id="snext">${SQ.i<SQ.n-1?"次の問題 →":"結果を見る"}</button>`:`<button class="btn ghost" id="sreset" ${SQ.pick.length?"":"disabled"}>やり直す</button><span></span>`}</div>`;

/* ---- キーボード操作 ---- */
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();if(tag==="textarea"||tag==="input")return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(scr==="q"&&(e.key===" "||e.key==="Enter")){e.preventDefault();answer();}
  else if(scr==="a"){const m={"1":"o","2":"t","3":"x"}[e.key];if(m){e.preventDefault();const b=app.querySelector(`.g.${m}`);b&&b.click();}else if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){e.preventDefault();goNext();}}
  else if(scr==="l"){const m={"1":"o","2":"t","3":"x"}[e.key];if(m){e.preventDefault();const b=app.querySelector(`.lgrade .g.${m}`);b&&b.click();}}
  else if(scr==="sort"){const i={"1":0,"2":1,"3":2,"4":3}[e.key];if(i!=null){const b=app.querySelector(`.ev[data-i="${i}"]`);b&&!b.disabled&&b.click();}else if(e.key===" "||e.key==="Enter"){const n=app.querySelector("#snext");if(n){e.preventDefault();n.click();}}}
  if(e.key==="Escape"&&scr!=="home"){if(scr==="q"||scr==="a")leave();else home();}
});

/* ---- 聞き流しモード：問題 → 間 → 答え → 次 ---- */
let LS=null,wake=null;
if(S.gap==null)S.gap=5;
if(S.gapE==null)S.gapE=8;
function gapKey(c){return c.q.rev?"gap":"gapE";}
function gapOpts(c){return c.q.rev?[3,5,8]:[5,8,15];}
function stopListen(){if(!LS)return;clearTimeout(LS.timer);LS=null;ttsStop();try{wake&&wake.release();}catch(e){}wake=null;}
function listen(cards){
  if(!cards.length||!TTS)return;
  stopListen();LS={cards,i:0,playing:true,timer:null};
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{});}catch(e){}
  lstep();
}
function lrender(revealed){
  const c=LS.cards[LS.i],it=c.q.i[c.k];
  app.innerHTML=`<div class="nav"><button class="btn ghost" id="back">← 一覧</button><span class="sub" style="align-self:center">聞き流し ${LS.i+1} / ${LS.cards.length}</span></div>
  <div class="sheet">
    ${head(c)}
    <div class="qtext" id="lq">${esc(qPrompt(c))}</div>
    <div class="ans ${revealed?"":"veil"}">${ansHTML(c).replace("__ID__","la")}</div>
    <div class="lgrade"><span class="label">自己採点（読み上げは止まりません）</span><div class="grade" role="group" aria-label="自己採点">${["o","t","x"].map((v,i)=>`<button class="g ${v}" data-v="${v}" aria-pressed="${gradeOf(c)===v}">${MARK[v]}<small>${i+1}</small></button>`).join("")}</div></div>
    <div class="lctl"><button class="btn ghost" id="lprev" ${LS.i?"":"disabled"}>← 前へ</button><button class="btn pen" id="lplay">${LS.playing?"一時停止":"再開"}</button><button class="btn ghost" id="lnext" ${LS.i<LS.cards.length-1?"":"disabled"}>次へ →</button></div>
    <div class="speak"><span class="label">考える時間</span><div class="rate" role="group" aria-label="考える時間">${gapOpts(c).map(s=>`<button data-gap="${s}" aria-pressed="${S[gapKey(c)]==s}">${s}秒</button>`).join("")}</div>
    <div class="rate" role="group" aria-label="読み上げの速さ">${[[0.8,"ゆっくり"],[1,"ふつう"],[1.3,"速い"]].map(([r,l])=>`<button data-rate="${r}" aria-pressed="${S.rate==r}">${l}</button>`).join("")}</div></div>
  </div>`;
  app.querySelector("#back").onclick=home;scr="l";
  app.querySelectorAll(".lgrade .g").forEach(b=>b.onclick=()=>{grade(c,b.dataset.v);app.querySelectorAll(".lgrade .g").forEach(x=>x.setAttribute("aria-pressed",gradeOf(c)===x.dataset.v));});
  app.querySelector("#lplay").onclick=()=>{if(LS.playing){LS.playing=false;clearTimeout(LS.timer);ttsStop();lrender(revealed);}else{LS.playing=true;lstep();}};
  app.querySelector("#lprev").onclick=()=>{clearTimeout(LS.timer);LS.i--;LS.playing=true;lstep();};
  app.querySelector("#lnext").onclick=()=>{clearTimeout(LS.timer);LS.i++;LS.playing=true;lstep();};
  app.querySelectorAll("[data-gap]").forEach(b=>b.onclick=()=>{S[gapKey(c)]=+b.dataset.gap;save();app.querySelectorAll("[data-gap]").forEach(x=>x.setAttribute("aria-pressed",S[gapKey(c)]==x.dataset.gap));});
  bindRate();
}
function lstep(){
  if(!LS)return;const me=LS;clearTimeout(me.timer);
  const c=me.cards[me.i],it=c.q.i[c.k];
  lrender(false);window.scrollTo(0,0);
  ttsPlay([{text:sayQ(c),el:app.querySelector("#lq")}],null,()=>{
    if(LS!==me||!me.playing)return;
    me.timer=setTimeout(()=>{
      if(LS!==me||!me.playing)return;
      lrender(true);
      ttsPlay([{text:aText(c),el:app.querySelector("#la")}],null,()=>{
        if(LS!==me||!me.playing)return;
        me.timer=setTimeout(()=>{
          if(LS!==me||!me.playing)return;
          if(me.i<me.cards.length-1){me.i++;lstep();}
          else{stopListen();app.innerHTML=`<div class="sheet"><h2>聞き流し おわり</h2><div class="sub">${me.cards.length}問を読み上げました。</div><div class="actions"><button class="btn" id="back">一覧にもどる</button></div></div>`;app.querySelector("#back").onclick=home;}
        },1500);
      });
    },S[gapKey(c)]*1000);
  });
}
