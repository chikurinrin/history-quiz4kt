<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>理科 記述チェック</title>
<style>
/* layout: one column, "解答用紙" — question sheet → answer sheet with red-pen self-marking (理科版) */

  --f-display:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a20; --sheet:#1c242c; --ink:#e4e9ee; --muted:#9aa7b3; --rule:#33404b;
  --pen:#ff7a63; --pen-soft:#3a201c; --mid:#e8b04a; --mid-soft:#352a14; --ok:#6cc792; --ok-soft:#18301f;
  --chi:#6fb5d6; --phy:#3d6fb8; --chem:#b8563c; --bio:#3a8a5c; --earth:#9a7430; --mark:#6b5a1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a20; --sheet:#1c242c; --ink:#e4e9ee; --muted:#9aa7b3; --rule:#33404b;
  --pen:#ff7a63; --pen-soft:#3a201c; --mid:#e8b04a; --mid-soft:#352a14; --ok:#6cc792; --ok-soft:#18301f;
  --chi:#6fb5d6; --phy:#3d6fb8; --chem:#b8563c; --bio:#3a8a5c; --earth:#9a7430; --mark:#6b5a1e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover{background:var(--sheet)}

.tag{color:#fff}

.numrow{display:flex;align-items:center;gap:8px}.numrow .guess{flex:1;min-width:0}.unitlbl{font-weight:700;min-width:2em}
.hintx{letter-spacing:0;margin-left:4px}.keys2{display:flex;gap:8px;margin-top:8px}.keys2 .mini{margin-left:0;width:48px;height:38px;font-size:1.05rem;border-radius:8px}.qsub{margin-top:8px;font-weight:700}.evt svg,.qtext svg{max-width:100%;height:auto}

.plegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.75rem;color:var(--muted);align-items:center}

.bar{display:flex;height:12px;border-radius:999px;background:var(--rule);overflow:hidden;min-width:0}
.bar i{display:block;height:100%}
.bo{background:var(--ok)!important}.bt{background:var(--mid)!important}.bx{background:var(--pen)!important}
.pc{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}

.urow{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) auto;gap:10px;align-items:center;padding-top:6px}
.uname{font-size:.82rem;overflow-wrap:anywhere}
.urow{border:0;background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:4px}
.urow:hover{background:var(--paper)}
.days{display:flex;gap:12px;font-size:.82rem;color:var(--muted)}.days b{font-size:1.2rem;color:var(--ink);font-variant-numeric:tabular-nums}
.pbar{height:4px;background:var(--rule);border-radius:999px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--pen)}
.g small{font-size:.65rem;font-weight:400;opacity:.6;margin-left:4px;vertical-align:top}

.search{display:flex;flex-direction:column;gap:4px}
.search input{font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);width:100%}

.bk{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px}

.result{gap:14px}
.score{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.score b{font-family:var(--f-display);font-size:3.2rem;line-height:1;color:var(--pen);font-variant-numeric:tabular-nums}.score small{font-size:1rem;font-weight:700}
.miss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--rule)}

.mk{font-weight:700}.mk.x{color:var(--pen)}.mk.t{color:var(--mid)}
.chron{list-style:none;margin:0;padding:4px 14px 14px;display:flex;flex-direction:column;gap:6px}

.kana{font-family:var(--f-display);font-weight:700;font-size:1.1rem;width:1.8em;height:1.8em;display:grid;place-items:center;border:1px solid var(--ink);border-radius:50%}
.evt{display:flex;flex-direction:column;gap:2px}.evy{font-size:.85rem}
.ord{font-weight:700;color:var(--pen);font-size:1.2rem;font-variant-numeric:tabular-nums}
.seq{font-family:var(--f-display);font-size:1.15rem;font-weight:700;letter-spacing:.06em;min-height:1.6em}

.mtab{font-size:.9rem}

.ask{font-size:.9rem;color:var(--pen);font-weight:700}
.lgrade{display:flex;flex-direction:column;gap:6px}
.lctl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grp{font-size:.78rem;letter-spacing:.1em;color:var(--muted);padding:18px 4px 6px;border-bottom:1px solid var(--rule);font-weight:700}
/* 出題範囲 */
.range{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.range>summary{padding:12px 14px;cursor:pointer;font-weight:700;font-size:.9rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

.sbtn[aria-pressed="true"]{background:var(--chi);color:var(--sheet)}

<script>
const T=[];
/* ===== 物理 ===== */
T.push(
{c:"物理",t:"光の反射",i:[
["反射の法則","光が鏡で反射するときの規則（反射の法則）を、入射角と反射角という言葉を使って説明せよ。","入射角と反射角は常に等しい。入射角・反射角は、鏡の面に垂直な線と光の道すじがつくる角度。"],
["鏡にうつる像","鏡にうつって見える物体の像の位置を説明せよ。","鏡の面に対して物体と対称な位置（鏡の奥）にあるように見える。目に届く光の道すじを、鏡の奥へまっすぐのばした先に像がある。"],
["乱反射","乱反射とは何か。物体が見えることとの関係とあわせて説明せよ。","表面の細かいでこぼこで、光がいろいろな方向に反射すること。一つ一つの光は反射の法則に従っている。乱反射した光が目に入るので、どの方向からでも物体が見える。"]],
r:[["反射の法則","光が鏡で反射するとき、入射角と反射角が等しくなるという規則。"],["乱反射","物体の表面の細かいでこぼこによって、光がいろいろな方向に反射すること。"],["入射角","鏡の面に垂直な線と、入ってくる光がつくる角。"]]},

{c:"物理",t:"光の屈折",i:[
["空気→水・ガラス","光が空気中から水中（ガラス中）へななめに進むとき、光はどのように曲がるか。入射角と屈折角の大小とあわせて説明せよ。","境界面で屈折し、入射角＞屈折角となる（境界面に垂直な線に近づくように曲がる）。"],
["水・ガラス→空気","光が水中（ガラス中）から空気中へななめに進むとき、光はどのように曲がるか。","入射角＜屈折角となる（境界面から離れるように曲がる）。"],
["全反射","全反射とは何か。起こる条件と利用例を説明せよ。","光が水やガラスから空気中へ進むとき、入射角がある大きさ以上になると、屈折する光がなくなり、すべて反射する現象。光ファイバーに利用されている。"],
["身近な屈折の例","水を入れたコップの底のコインが浮き上がって見える理由を説明せよ。","コインから出た光が水面で屈折し、入射角＜屈折角となって目に届くため。目は光がまっすぐ進んできたと感じるので、実際より浅い位置にあるように見える。"]],
r:[["屈折","光がちがう物質の境界面で折れ曲がって進むこと。"],["全反射","光が水やガラスから空気中へ進むとき、入射角が大きいと境界面ですべて反射する現象。"],["光ファイバー","全反射を利用して、光を遠くまで伝える細いガラスの線。"]]},

{c:"物理",t:"凸レンズと像",i:[
["焦点と焦点距離","凸レンズの焦点と焦点距離とは何か説明せよ。","光軸に平行な光が凸レンズで屈折して集まる点が焦点。レンズの両側に1つずつある。レンズの中心から焦点までの距離が焦点距離。"],
["作図の3本の光","凸レンズによる像を作図するときに使う、3つの光の進み方を答えよ。","①光軸に平行な光は、屈折して反対側の焦点を通る。②レンズの中心を通る光は、そのまま直進する。③手前の焦点を通った光は、屈折して光軸に平行に進む。"],
["実像","実像とは何か。物体の位置による像の大きさの変化とあわせて説明せよ。","物体が焦点の外側にあるとき、スクリーンにうつる上下左右が逆向きの像。物体が焦点距離の2倍の位置にあるとき、反対側の2倍の位置に同じ大きさの実像ができる。物体が焦点に近づくほど、像はレンズから遠くなり大きくなる。"],
["虚像","虚像とは何か。できる条件とあわせて説明せよ。","物体が焦点の内側にあるとき、スクリーンにはうつらず、レンズを通して見える物体と同じ向きの大きな像。虫めがねで見る像。"],
["焦点上に置いたとき","物体を焦点の位置に置くと、像はどうなるか。","屈折した光が平行に進み、交わらないため、像はできない。"]],
r:[["焦点","凸レンズの光軸に平行な光が、屈折して集まる点。"],["焦点距離","凸レンズの中心から焦点までの距離。"],["実像","物体が焦点の外側にあるときにスクリーンにうつる、上下左右が逆向きの像。"],["虚像","物体が焦点の内側にあるとき、凸レンズを通して見える、物体と同じ向きで大きな像。"],["光軸","凸レンズの中心を通り、レンズの面に垂直な直線。"]]},

{c:"物理",t:"音の性質",i:[
["音の伝わり方","音はどのように伝わるか。真空中ではどうなるかとあわせて説明せよ。","音源の振動が空気などの物質を次々に振動させ、波として伝わる。固体・液体・気体の中を伝わるが、物質のない真空中では伝わらない。"],
["音の大きさ","音の大きさは何によって決まるか。オシロスコープの波形とあわせて説明せよ。","振幅（振動のはば）で決まり、振幅が大きいほど大きな音になる。波形では波の高さ（山の高さ）が高くなる。"],
["音の高さ","音の高さは何によって決まるか。弦の条件とあわせて説明せよ。","振動数（1秒間に振動する回数、単位ヘルツ〔Hz〕）で決まり、振動数が多いほど高い音。弦は、短いほど、細いほど、強く張るほど高い音になる。波形では波の数が多くなる。"],
["音の速さ","空気中の音の速さと、雷の音から距離を求める方法を説明せよ。","空気中では約340m/s。光はほぼ一瞬で届くので、いなずまが見えてから音が聞こえるまでの時間（秒）に340をかけると、雷までのおよその距離（m）が求められる。"]],
r:[["振幅","音源の振動のはば。大きいほど大きな音になる。"],["振動数","音源が1秒間に振動する回数。多いほど高い音になる。"],["ヘルツ（Hz）","振動数の単位。"],["音源（発音体）","音を出している物体。"]]},

{c:"物理",t:"力の種類と表し方",i:[
["力のはたらき","力のはたらきを3つ答えよ。","①物体の形を変える。②物体の動き（速さや向き）を変える。③物体を支える。"],
["いろいろな力","重力・垂直抗力・摩擦力・弾性力・磁力・電気の力について、それぞれ説明せよ。","重力：地球が物体を中心に向かって引く力。垂直抗力：面が物体を垂直に押し返す力。摩擦力：物体の動きをさまたげるように面からはたらく力。弾性力：変形した物体がもとにもどろうとする力。磁力・電気の力は離れていてもはたらく。"],
["力の表し方","力の三要素と、矢印による力の表し方を説明せよ。","力の三要素は、作用点・力の向き・力の大きさ。作用点を矢印の始点（・）、力の向きを矢印の向き、力の大きさを矢印の長さで表す。重力は物体の中心から1本の矢印でかく。"],
["重さと質量","重さと質量のちがいを説明せよ。","重さは物体にはたらく重力の大きさで、単位はN（ニュートン）。場所によって変わり、月面では地球の約6分の1。質量は物体そのものの量で、単位はgやkg。場所によって変わらない。100gの物体にはたらく重力が約1N。"],
["2力のつり合い","1つの物体にはたらく2力がつり合う条件を答えよ。","①2力の大きさが等しい。②2力の向きが反対。③2力が一直線上にある。"]],
r:[["重力","地球が物体を地球の中心に向かって引く力。"],["垂直抗力","面が物体を垂直に押し返す力。"],["摩擦力","物体の運動をさまたげるように、物体と接している面からはたらく力。"],["弾性力","変形した物体が、もとにもどろうとして生じる力。"],["ニュートン（N）","力の大きさの単位。100gの物体にはたらく重力の大きさが約1。"],["質量","場所によって変わらない、物体そのものの量。単位はgやkg。"]]},

{c:"物理",t:"ばねと力（フックの法則）",i:[
["フックの法則","フックの法則とは何か説明せよ。","ばねののびは、ばねを引く力の大きさに比例するという法則。グラフは原点を通る直線になる。"],
["グラフの読み方","ばねにつるすおもりの質量とばねの長さのグラフから、ばねの「のび」を求めるときの注意点を説明せよ。","グラフが「ばねの長さ」なら、もとの長さ（力が0のときの長さ）を引いたものが「のび」。のびは力に比例するが、ばねの長さは力に比例しない（原点を通らない）。"]],
r:[["フックの法則","ばねののびは、ばねを引く力の大きさに比例するという法則。"]]},

{c:"物理",t:"圧力と大気圧",i:[
["圧力","圧力とは何か。求め方と単位を答えよ。","面を垂直に押す力がはたらく面積1㎡あたりの力の大きさ。圧力〔Pa〕＝面を垂直に押す力〔N〕÷力がはたらく面積〔㎡〕。単位はパスカル（Pa）またはN/㎡。"],
["面積と圧力の関係","同じ物体を置く向きを変えたとき、圧力はどう変わるか。","押す力（重さ）は同じなので、接する面積が小さいほど圧力は大きくなる。面積が半分なら圧力は2倍。"],
["大気圧","大気圧とは何か。大きさと、標高との関係を説明せよ。","空気にはたらく重力によって生じる圧力。あらゆる向きからはたらく。海面上ではおよそ1013hPa（約10万Pa）で、これを1気圧という。標高が高いほど上にある空気が少ないので小さくなる。"],
["大気圧の例","山の上で密閉した菓子袋がふくらむ理由を説明せよ。","山の上は大気圧が小さいため、袋の中の空気が外から押される力より、内側から押す力の方が大きくなるから。"]],
r:[["圧力","面を垂直に押す力がはたらく、面積1㎡あたりの力の大きさ。"],["パスカル（Pa）","圧力の単位。1N/㎡と同じ。"],["大気圧（気圧）","空気にはたらく重力によって生じる圧力。"],["1気圧","海面上での平均的な大気圧の大きさ。約1013hPa。"]]},

{c:"物理",t:"水圧と浮力",i:[
["水圧","水圧とは何か。はたらく向きと深さとの関係を説明せよ。","水にはたらく重力によって生じる圧力。あらゆる向きから物体の面に垂直にはたらき、深いところほど大きい。同じ深さなら向きによらず大きさは等しい。"],
["浮力","浮力とは何か。生じる理由とあわせて説明せよ。","水中の物体にはたらく上向きの力。物体の下面にはたらく水圧の方が上面にはたらく水圧より大きいために生じる。"],
["浮力の大きさ","浮力の大きさは何に関係し、何に関係しないか。求め方とあわせて説明せよ。","水中にある部分の体積が大きいほど大きい。全体が水中に入れば、深さには関係しない。物体の質量にも関係しない。浮力＝空気中でのばねばかりの値－水中でのばねばかりの値。"],
["浮く・沈む","物体が水に浮くか沈むかは、どのように決まるか。","物体にはたらく重力が浮力より大きければ沈み、全体が沈む前に重力と浮力がつり合えば浮く。"]],
r:[["水圧","水にはたらく重力によって生じる圧力。深いところほど大きい。"],["浮力","水中の物体にはたらく上向きの力。"]]},

{c:"物理",t:"直列回路と並列回路",i:[
["回路図","回路図とは何か。電流の向きの決まりとあわせて説明せよ。","電気用図記号を使って回路を表した図。電流は電源の＋極から出て－極にもどる向きに流れると決められている。"],
["直列回路の電流と電圧","直列回路の各部分を流れる電流と、各部分に加わる電圧の関係を説明せよ。","電流はどこでも等しい（I＝I₁＝I₂）。各部分の電圧の和が電源の電圧に等しい（V＝V₁＋V₂）。"],
["並列回路の電流と電圧","並列回路の各部分を流れる電流と、各部分に加わる電圧の関係を説明せよ。","枝分かれした電流の和が、分かれる前（合流した後）の電流に等しい（I＝I₁＋I₂）。各部分に加わる電圧は電源の電圧に等しい（V＝V₁＝V₂）。"],
["電流計と電圧計","電流計と電圧計のつなぎ方と、－端子の選び方を説明せよ。","電流計は測りたい部分に直列に、電圧計は並列につなぐ。値が予想できないときは、最も大きい値の－端子（電流計なら5A、電圧計なら300V）からつなぎ、針の振れが小さければ順に小さい端子につなぎかえる。電流計を電源に直接つないではいけない。"]],
r:[["直列回路","電流の流れる道すじが1本の回路。"],["並列回路","電流の流れる道すじが途中で枝分かれしている回路。"],["電流計","回路を流れる電流の大きさを測る器具。測りたい部分に直列につなぐ。"],["電圧計","回路の各部分に加わる電圧を測る器具。測りたい部分に並列につなぐ。"]]},

{c:"物理",t:"オームの法則と抵抗",i:[
["オームの法則","オームの法則とは何か。式とあわせて説明せよ。","電熱線を流れる電流の大きさは、電熱線に加わる電圧の大きさに比例する。電圧〔V〕＝抵抗〔Ω〕×電流〔A〕。"],
["電気抵抗","電気抵抗とは何か。単位と、導体・不導体とあわせて説明せよ。","電流の流れにくさ。単位はオーム（Ω）。金属のように抵抗が小さく電流を通しやすい物質を導体、ガラスやゴムのように抵抗が非常に大きく電流をほとんど通さない物質を不導体（絶縁体）という。"],
["直列の全体の抵抗","2つの抵抗を直列につないだときの全体の抵抗の求め方を説明せよ。","各抵抗の和になる（R＝R₁＋R₂）。全体の抵抗は、それぞれの抵抗より大きくなる。"],
["並列の全体の抵抗","2つの抵抗を並列につないだときの全体の抵抗の求め方を説明せよ。","1/R＝1/R₁＋1/R₂ で求める。全体の抵抗は、それぞれの抵抗より小さくなる。電源の電圧÷全体の電流でも求められる。"]],
r:[["オームの法則","電熱線を流れる電流の大きさは、加わる電圧の大きさに比例するという法則。"],["電気抵抗（抵抗）","電流の流れにくさ。単位はオーム（Ω）。"],["導体","金属のように、電気抵抗が小さく電流を通しやすい物質。"],["不導体（絶縁体）","ガラスやゴムのように、電気抵抗が非常に大きく電流をほとんど通さない物質。"]]},

{c:"物理",t:"電力と熱量",i:[
["電力","電力とは何か。求め方と単位を答えよ。","電気器具が1秒間あたりに使う電気エネルギーの量。電力〔W〕＝電圧〔V〕×電流〔A〕。単位はワット（W）。電力が大きいほど、熱・光・音などのはたらきが大きい。"],
["熱量","電熱線から発生する熱量の求め方と単位を答えよ。","熱量〔J〕＝電力〔W〕×時間〔s（秒）〕。単位はジュール（J）。水の上昇温度は電力と時間に比例する。"],
["電力量","電力量とは何か。求め方と単位を答えよ。","電気器具が消費した電気エネルギーの量。電力量〔J〕＝電力〔W〕×時間〔s〕。1Wの電力を1時間使ったときの電力量を1Wh（ワット時）といい、1Wh＝3600J。"],
["水の上昇温度の実験","電熱線で水をあたためる実験で、水の上昇温度が実際の発熱量から求めた値より小さくなる理由を説明せよ。","発生した熱の一部が、容器や周りの空気に逃げてしまうから。"]],
r:[["電力","電気器具が1秒間あたりに使う電気エネルギーの量。電圧×電流で求める。"],["ワット（W）","電力の単位。"],["熱量","電流によって発生する熱の量。単位はジュール（J）。"],["電力量","電気器具が消費した電気エネルギーの量。電力×時間で求める。"]]},

{c:"物理",t:"静電気と電流の正体",i:[
["静電気","静電気とは何か。2つの物体をこすり合わせたときに起こることを説明せよ。","摩擦によって物体にたまった電気。こすり合わせると一方の物体からもう一方へ－の電気をもつ電子が移動し、電子を受け取った方が－、失った方が＋の電気を帯びる。同じ種類の電気はしりぞけ合い、ちがう種類の電気は引き合う。"],
["放電と真空放電","放電・真空放電とは何か説明せよ。","たまっていた電気が流れ出したり、空間を移動したりする現象が放電（雷など）。気圧を低くした空間に電流が流れる現象が真空放電。"],
["陰極線（電子線）","陰極線（電子線）とは何か。性質とあわせて説明せよ。","真空放電管の－極から出ている電子の流れ。－の電気をもつので、電極板の＋極側に曲がる。磁石を近づけても曲がる。"],
["電流の正体","電流の正体と、電子の移動の向きを説明せよ。","電流の正体は電子の流れ。電子は－極から＋極へ移動するので、電子の移動の向きと電流の向き（＋極から－極）は逆。"],
["放射線","放射線の種類と性質、利用例を答えよ。","X線、α線、β線、γ線、中性子線など。目に見えず、物質を通りぬける能力（透過性）や物質を変質させる性質がある。レントゲン検査、がんの治療、農作物の品種改良、ジャガイモの発芽防止などに利用。大量に浴びると健康に影響がある。単位はシーベルト（Sv）など。"]],
r:[["静電気","摩擦によって物体にたまった電気。"],["放電","たまっていた電気が流れ出したり、空間を移動したりする現象。"],["真空放電","気圧を低くした空間に電流が流れる現象。"],["電子","－の電気をもつ非常に小さな粒子。電流の正体。"],["陰極線（電子線）","真空放電管の－極から出る電子の流れ。"],["放射線","X線・α線・β線・γ線など、目に見えず物質を通りぬける性質をもつもの。"]]},

{c:"物理",t:"電流がつくる磁界",i:[
["磁界と磁力線","磁界と磁力線とは何か説明せよ。","磁石の力（磁力）がはたらく空間が磁界。磁界の向きは方位磁針のN極がさす向き。磁界のようすを表した線が磁力線で、N極から出てS極に入る。磁力線の間隔がせまいほど磁界が強い。"],
["導線のまわりの磁界","まっすぐな導線に電流を流したときにできる磁界のようすを説明せよ。","導線を中心とした同心円状の磁界ができる。電流の向きに右ねじの進む向きを合わせると、右ねじを回す向きが磁界の向きになる。導線に近いほど、電流が大きいほど磁界は強い。"],
["コイルの磁界","コイルに電流を流したときの磁界のようすと、磁界を強くする方法を説明せよ。","コイルの内側には、右手の4本の指を電流の向きに合わせたとき、親指の向きの磁界ができる（棒磁石と同じような磁界）。電流を大きくする、コイルの巻数を多くする、鉄しんを入れると磁界が強くなる。"]],
r:[["磁界（磁場）","磁石の力（磁力）がはたらいている空間。"],["磁力線","磁界のようすを表した線。N極から出てS極に入る。"],["磁界の向き","方位磁針のN極がさす向き。"]]},

{c:"物理",t:"モーターのしくみ",i:[
["電流が磁界から受ける力","磁界の中の導線に電流を流すとどうなるか。力の向きと大きさを変える方法を説明せよ。","導線は磁界から力を受けて動く。電流の向きか磁界の向きのどちらかを逆にすると力の向きは逆になる（両方を逆にすると同じ向き）。電流を大きくする、磁界を強くすると力は大きくなる。"],
["モーター","モーターが連続して回転するしくみを説明せよ。","磁界の中のコイルに電流を流すと、コイルが磁界から力を受けて回転する。整流子とブラシによって半回転ごとにコイルに流れる電流の向きが切りかわるため、同じ向きに回転し続ける。"]],
r:[["モーター","磁界の中のコイルに電流を流したときに受ける力を利用して、回転させる装置。"],["整流子","モーターで、半回転ごとにコイルに流れる電流の向きを切りかえるしくみ。"]]},

{c:"物理",t:"電磁誘導と発電機",i:[
["電磁誘導","電磁誘導とは何か説明せよ。","コイルの中の磁界が変化すると、その変化に応じた電圧が生じてコイルに電流が流れる現象。このとき流れる電流を誘導電流という。"],
["誘導電流の向き","誘導電流の向きはどのように変わるか説明せよ。","磁石を近づけるときと遠ざけるときで逆になる。磁石の極を逆にしても逆になる。磁石を動かさずに止めていると流れない。"],
["誘導電流を大きくする方法","誘導電流を大きくする方法を3つ答えよ。","①磁石（コイル）を速く動かす。②磁力の強い磁石を使う。③コイルの巻数を多くする。"],
["発電機","発電機のしくみを説明せよ。","電磁誘導を利用して、コイルや磁石を回転させ、磁界を変化させ続けることで電流を取り出す装置。発電所の発電機や自転車の発電機など。"]],
r:[["電磁誘導","コイルの中の磁界が変化することで、電圧が生じてコイルに電流が流れる現象。"],["誘導電流","電磁誘導によって流れる電流。"],["発電機","電磁誘導を利用して、連続的に電流を取り出す装置。"]]},

{c:"物理",t:"直流と交流",i:[
["直流と交流","直流と交流のちがいを説明せよ。","直流は乾電池の電流のように、流れる向きが一定で変わらない電流。交流は家庭のコンセントの電流のように、向きと大きさが周期的に変わる電流。"],
["周波数","周波数とは何か。日本の家庭の交流の周波数とあわせて答えよ。","交流で1秒間にくり返す電流の変化の回数。単位はヘルツ（Hz）。東日本は50Hz、西日本は60Hz。"],
["発光ダイオードでの確認","直流と交流を、発光ダイオードを使って見分ける方法を説明せよ。","発光ダイオードは決まった向きにしか電流を流さない。発光ダイオードを左右にふると、直流では光が一本の線に見え、交流では点滅して点線に見える。"]],
r:[["直流","乾電池の電流のように、流れる向きが一定の電流。"],["交流","家庭のコンセントの電流のように、向きと大きさが周期的に変わる電流。"],["周波数","交流で1秒間にくり返す電流の変化の回数。"]]},

{c:"物理",t:"力の合成と分解",i:[
["力の合成","力の合成とは何か。角度をもってはたらく2力の合力の求め方を説明せよ。","2つの力と同じはたらきをする1つの力を求めること。求めた力を合力という。2力を2辺とする平行四辺形をかき、その対角線が合力になる（平行四辺形の法則）。一直線上で同じ向きなら和、反対向きなら差になる。"],
["力の分解","力の分解とは何か。斜面上の物体にはたらく重力の分解を例に説明せよ。","1つの力を、同じはたらきをする2つの力に分けること。分けた力を分力という。斜面上の物体の重力は、斜面に平行な分力と斜面に垂直な分力に分けられる。斜面の傾きが大きいほど、斜面に平行な分力は大きくなる。"],
["2力の角度と合力","2つの力の大きさが同じとき、2力の間の角度を大きくすると合力はどうなるか。","合力は小さくなる。例えば重い荷物を2人で持つとき、2人の腕の間の角度が大きいほど、それぞれが大きな力を出す必要がある。"]],
r:[["合力","2つ以上の力と同じはたらきをする1つの力。"],["分力","1つの力を、同じはたらきをする2つの力に分けたときのそれぞれの力。"],["平行四辺形の法則","2力を2辺とする平行四辺形の対角線が合力になるという規則。"]]},

{c:"物理",t:"物体の運動",i:[
["速さ","速さの求め方と、平均の速さ・瞬間の速さのちがいを説明せよ。","速さ＝移動距離÷移動にかかった時間（単位はm/s、km/hなど）。平均の速さは、ある距離を一定の速さで移動したと考えたときの速さ。瞬間の速さは、ごく短い時間に移動した距離から求めたその時々の速さ（自動車の速度計の値）。"],
["記録タイマー","記録タイマーのテープから運動のようすを読みとる方法を説明せよ。","記録タイマーは一定時間ごとに打点する（東日本では1秒間に50回）。打点の間隔が広いほど速い。5打点ごと（0.1秒）に切って並べると、速さの変化がわかる。"],
["等速直線運動","等速直線運動とは何か。グラフの特徴とあわせて説明せよ。","一定の速さで一直線上を進む運動。物体に力がはたらいていないか、はたらく力がつり合っているときに起こる。時間と速さのグラフは横軸に平行な直線、時間と移動距離のグラフは原点を通る直線（比例）。"],
["斜面を下る運動","斜面を下る台車の運動を、力と速さの変化に注目して説明せよ。","台車には斜面に平行な下向きの分力が一定の大きさではたらき続けるので、速さは一定の割合で大きくなる。斜面の傾きが大きいほど分力が大きく、速さの増え方も大きい。傾きが90°のときが自由落下。"],
["運動の向きと逆向きの力","運動の向きと逆向きに力がはたらくと、物体の運動はどうなるか。","速さがしだいに小さくなる。例：斜面をのぼる台車、摩擦力がはたらく物体。"]],
r:[["平均の速さ","ある距離を一定の速さで移動したと考えて求めた速さ。"],["瞬間の速さ","ごく短い時間に移動した距離から求めた、その時々の速さ。"],["等速直線運動","一定の速さで一直線上を進む運動。"],["自由落下","静止していた物体が、重力だけを受けて真下に落ちる運動。"],["記録タイマー","一定時間ごとにテープに点を打ち、物体の運動を記録する装置。"]]},

{c:"物理",t:"慣性と作用・反作用",i:[
["慣性の法則","慣性の法則とは何か。身近な例とあわせて説明せよ。","物体に力がはたらいていないか、はたらく力がつり合っているとき、静止している物体は静止し続け、運動している物体は等速直線運動を続ける。物体のこの性質を慣性という。例：電車が急に動き出すと、乗客は進行方向と逆向きにたおれそうになる。"],
["作用・反作用の法則","作用・反作用の法則とは何か。2力のつり合いとのちがいとあわせて説明せよ。","ある物体が別の物体に力を加えると（作用）、同時に相手から、同じ大きさで逆向きの力（反作用）を受ける。作用と反作用は2つの物体の間で互いにはたらく力であり、1つの物体にはたらく2力のつり合いとはちがう。例：壁を押すと押し返される。"]],
r:[["慣性","物体がそれまでの運動の状態を続けようとする性質。"],["慣性の法則","力がはたらいていないか、つり合っているとき、物体は静止または等速直線運動を続けるという法則。"],["作用・反作用の法則","物体に力を加えると、同時に同じ大きさで逆向きの力を受けるという法則。"]]},

{c:"物理",t:"仕事と仕事率",i:[
["仕事","理科での仕事とは何か。求め方と単位を答えよ。","物体に力を加えて、力の向きに動かしたとき、その力は物体に仕事をしたという。仕事〔J〕＝力の大きさ〔N〕×力の向きに動いた距離〔m〕。物体が動かなかったり、力の向きと動く向きが垂直だったりすると、仕事は0。"],
["仕事の原理","仕事の原理とは何か。動滑車を例に説明せよ。","道具を使っても使わなくても、仕事の大きさは変わらないこと。動滑車を使うと、ひもを引く力は半分になるが、ひもを引く距離は2倍になるので、仕事の大きさは同じ。斜面やてこも同じ。"],
["仕事率","仕事率とは何か。求め方と単位を答えよ。","1秒間あたりにする仕事の大きさ。仕事率〔W〕＝仕事〔J〕÷仕事にかかった時間〔s〕。単位はワット（W）。"]],
r:[["仕事","物体に力を加えて、その力の向きに物体を動かすこと。力の大きさ×動いた距離で求める。"],["ジュール（J）","仕事やエネルギー、熱量の単位。"],["仕事の原理","道具を使っても使わなくても、仕事の大きさは変わらないこと。"],["仕事率","1秒間あたりにする仕事の大きさ。単位はワット（W）。"]]},

{c:"物理",t:"力学的エネルギー",i:[
["エネルギー","理科でいうエネルギーとは何か説明せよ。","ほかの物体に仕事をする能力。仕事をすることができる物体は、エネルギーをもっているという。単位はジュール（J）。"],
["位置エネルギー","位置エネルギーとは何か。大きさが何によって決まるかを説明せよ。","高い所にある物体がもっているエネルギー。基準面からの高さが高いほど、物体の質量が大きいほど大きい。"],
["運動エネルギー","運動エネルギーとは何か。大きさが何によって決まるかを説明せよ。","運動している物体がもっているエネルギー。物体の速さが速いほど、質量が大きいほど大きい。"],
["力学的エネルギーの保存","力学的エネルギーの保存を、ふりこの運動を例に説明せよ。","位置エネルギーと運動エネルギーの和を力学的エネルギーといい、摩擦や空気の抵抗がなければ一定に保たれる。ふりこは、最も高い点で位置エネルギーが最大・運動エネルギーが0、最も低い点で運動エネルギーが最大（速さが最大）になり、互いに移り変わる。"]],
r:[["エネルギー","ほかの物体に仕事をする能力。"],["位置エネルギー","高い所にある物体がもっているエネルギー。"],["運動エネルギー","運動している物体がもっているエネルギー。"],["力学的エネルギー","位置エネルギーと運動エネルギーの和。"],["力学的エネルギーの保存","摩擦や空気の抵抗がなければ、力学的エネルギーが一定に保たれること。"]]},

{c:"物理",t:"エネルギーの移り変わりと熱",i:[
["エネルギーの種類","エネルギーの種類をあげ、移り変わりの例を説明せよ。","力学的エネルギー、電気エネルギー、熱エネルギー、光エネルギー、音エネルギー、化学エネルギー、核エネルギーなど。例：発電機は運動エネルギー→電気エネルギー、電球は電気エネルギー→光エネルギー（と熱エネルギー）、光合成は光エネルギー→化学エネルギー。"],
["エネルギーの保存と変換効率","エネルギーの保存と変換効率について説明せよ。","エネルギーが移り変わっても、その総量は変わらない（エネルギーの保存）。ただし一部は目的外の熱などになるので、利用できるエネルギーは減る。使ったエネルギーに対する利用できるエネルギーの割合を変換効率という。LED電球は白熱電球より変換効率が高い。"],
["熱の伝わり方","熱の3つの伝わり方を説明せよ。","伝導（熱伝導）：接している物体の間で、温度の高い方から低い方へ熱が伝わる。対流：液体や気体があたためられて移動し、熱が運ばれる。放射（熱放射）：高温の物体から出る光や赤外線によって、離れた物体に熱が伝わる。"],
["発電の方法","おもな発電方法と、エネルギーの移り変わりを説明せよ。","火力発電：化石燃料の化学エネルギー→熱→運動→電気。二酸化炭素を出す。水力発電：水の位置エネルギー→運動→電気。原子力発電：核エネルギー→熱→運動→電気。放射性廃棄物の処理が課題。太陽光発電（光→電気）、風力発電、地熱発電、バイオマス発電は再生可能エネルギー。"]],
r:[["エネルギーの保存","エネルギーが移り変わっても、その総量は変わらないこと。"],["変換効率","使ったエネルギーに対する、目的のエネルギーとして利用できるエネルギーの割合。"],["伝導（熱伝導）","接している物体の間で、温度の高い部分から低い部分へ熱が伝わる現象。"],["対流","液体や気体が移動して熱が運ばれる現象。"],["放射（熱放射）","高温の物体から出る光や赤外線によって熱が伝わる現象。"],["再生可能エネルギー","太陽光・風力・地熱など、いつまでも利用できるエネルギー。"]]}
);

T.push(
{c:"化学",t:"物質の区別",i:[
["有機物と無機物","有機物と無機物のちがいを、例をあげて説明せよ。","有機物は炭素をふくむ物質で、加熱すると燃えて二酸化炭素を発生する（多くは水も発生）。例：砂糖、デンプン、ロウ、プラスチック、エタノール。無機物は有機物以外の物質。例：食塩、金属、ガラス。炭素や二酸化炭素は炭素をふくむが無機物。"],
["金属の性質","金属に共通する性質を答えよ。","①電気をよく通す。②熱をよく伝える。③みがくと光る（金属光沢）。④たたくと広がり（展性）、引っぱるとのびる（延性）。磁石につくのは鉄など一部の金属だけで、金属共通の性質ではない。"],
["白い粉末の区別","砂糖・食塩・デンプンを区別する方法を説明せよ。","水にとかすと、デンプンはとけにくい。加熱すると、砂糖とデンプンはこげて炭になる（有機物）が、食塩はこげない。ヨウ素液で青紫色になるのはデンプン。"],
["ガスバーナーの使い方","ガスバーナーの火のつけ方と、炎の調節方法を説明せよ。","元栓→コックを開け、マッチに火をつけてからガス調節ねじを開いて点火する。次にガス調節ねじを押さえて空気調節ねじを開き、オレンジ色の炎を青い炎にする。消すときは空気→ガス→コック→元栓の順に閉める。"]],
r:[["有機物","炭素をふくみ、加熱すると燃えて二酸化炭素を発生する物質。"],["無機物","有機物以外の物質。食塩や金属など。"],["金属光沢","みがくと光る、金属に共通する性質。"],["延性・展性","引っぱるとのびる性質（延性）と、たたくと広がる性質（展性）。"]]},

{c:"化学",t:"密度",i:[
["密度","密度とは何か。求め方と単位を答えよ。","物質1㎤あたりの質量。密度〔g/㎤〕＝物質の質量〔g〕÷物質の体積〔㎤〕。物質の種類によって決まっているので、物質を区別する手がかりになる。"],
["浮き沈みと密度","密度と、液体に入れたときの浮き沈みの関係を説明せよ。","液体より密度が小さい物質は浮き、大きい物質は沈む。例：氷（約0.92g/㎤）は水（1.00g/㎤）に浮く。"],
["メスシリンダーの使い方","メスシリンダーの目もりの読み方を説明せよ。","水平な台に置き、液面のへこんだ下の面を、真横から見て、最小目もりの10分の1まで目分量で読む。"]],
r:[["密度","物質1㎤あたりの質量。"]]},

{c:"化学",t:"気体の性質と集め方",i:[
["気体の集め方","気体の3つの集め方と、それぞれどんな気体に適しているかを説明せよ。","水上置換法：水にとけにくい気体（酸素・水素・二酸化炭素など）。純粋な気体が集められる。上方置換法：水にとけやすく空気より軽い気体（アンモニア）。下方置換法：水にとけやすく空気より重い気体（二酸化炭素・塩化水素など）。"],
["酸素","酸素の発生方法と性質を答えよ。","二酸化マンガンにうすい過酸化水素水（オキシドール）を加える。無色・無臭、水にとけにくく、空気より少し重い。ものを燃やすはたらき（助燃性）があり、火のついた線香を入れると激しく燃える。"],
["二酸化炭素","二酸化炭素の発生方法と性質を答えよ。","石灰石（貝がら）にうすい塩酸を加える。無色・無臭、水に少しとけ、水溶液（炭酸水）は酸性。空気より重い。石灰水を白くにごらせる。ものを燃やすはたらきはない。"],
["水素","水素の発生方法と性質を答えよ。","亜鉛や鉄、マグネシウムなどの金属にうすい塩酸を加える。無色・無臭で、物質の中で最も軽い。水にとけにくい。空気中で燃えて水ができる（マッチの火を近づけるとポンと音を立てて燃える）。"],
["アンモニア","アンモニアの発生方法と性質を答えよ。","塩化アンモニウムと水酸化カルシウムを混ぜて加熱する。無色で特有の刺激臭があり、空気より軽い。水に非常にとけやすく、水溶液はアルカリ性。上方置換法で集める。噴水の実験に使われる。"],
["窒素と塩素","窒素と塩素の性質を答えよ。","窒素：空気の体積の約78％をしめる。無色・無臭で水にとけにくく、ほかの物質と反応しにくい。塩素：黄緑色で刺激臭があり、水にとけやすい。漂白作用・殺菌作用がある。"]],
r:[["水上置換法","水にとけにくい気体を、水と置きかえて集める方法。"],["上方置換法","水にとけやすく、空気より軽い気体を集める方法。"],["下方置換法","水にとけやすく、空気より重い気体を集める方法。"],["二酸化マンガン","うすい過酸化水素水に加えると酸素が発生する黒い固体。自身は変化しない。"]]},

{c:"化学",t:"水溶液と溶解度",i:[
["溶質・溶媒・溶液","溶質・溶媒・溶液とは何か。水溶液の性質とあわせて説明せよ。","とけている物質が溶質、溶質をとかしている液体が溶媒、溶質が溶媒にとけた液全体が溶液。溶媒が水のものを水溶液という。水溶液は透明で（色がついていることはある）、濃さはどこも均一。時間がたっても溶質は沈まない。"],
["質量パーセント濃度","質量パーセント濃度の求め方を説明せよ。","質量パーセント濃度〔％〕＝溶質の質量〔g〕÷溶液の質量〔g〕×100。溶液の質量は、溶質の質量＋溶媒の質量。"],
["溶解度","溶解度とは何か。溶解度曲線とあわせて説明せよ。","100gの水にとける物質の最大の質量。物質の種類と水の温度によって決まる。水の温度と溶解度の関係を表したグラフが溶解度曲線。多くの固体は温度が高いほど溶解度が大きくなるが、塩化ナトリウムは温度によってほとんど変わらない。"],
["再結晶","再結晶とは何か。2つの方法と、それぞれに適した物質を説明せよ。","固体の物質をいったん水にとかし、再び結晶として取り出すこと。①水溶液を冷やす：硝酸カリウムなど温度による溶解度の差が大きい物質に適している。②水を蒸発させる：塩化ナトリウムのように温度による溶解度の差が小さい物質に適している。"],
["ろ過","ろ過の正しい方法を説明せよ。","ろうとにろ紙をはめて水でぬらし、ろうとのあしのとがった方をビーカーの内壁につける。液はガラス棒を伝わらせて少しずつ注ぐ。"]],
r:[["溶質","溶液にとけている物質。"],["溶媒","溶質をとかしている液体。"],["溶解度","100gの水にとける物質の最大の質量。"],["飽和水溶液","物質がそれ以上とけることのできなくなった水溶液。"],["再結晶","いったん水にとかした物質を、再び結晶として取り出すこと。"],["結晶","いくつかの平面で囲まれた、規則正しい形をした固体。"]]},

{c:"化学",t:"状態変化と蒸留",i:[
["状態変化","状態変化とは何か。体積と質量の変化とあわせて説明せよ。","温度によって物質が固体・液体・気体と状態を変えること。粒子の運動のようすと粒子の間隔が変わるので体積は変わるが、粒子の数は変わらないので質量は変わらない。多くの物質は固体→液体→気体の順に体積が大きくなる。水は例外で、氷になると体積が大きくなる。"],
["融点と沸点","融点と沸点とは何か。純粋な物質と混合物のちがいを説明せよ。","融点：固体がとけて液体になるときの温度。沸点：液体が沸騰して気体になるときの温度。純粋な物質（純物質）では物質ごとに決まっていて、状態が変化している間は温度が一定。混合物では決まった値にならない。"],
["蒸留","蒸留とは何か。水とエタノールの混合物を例に説明せよ。","液体を加熱して沸騰させ、出てくる気体を冷やして再び液体として集める方法。沸点のちがいを利用して混合物を分けられる。水とエタノールの混合物では、沸点が低いエタノール（約78℃）を多くふくむ液体が先に出てくる。"],
["蒸留の注意点","蒸留の実験で、沸騰石を入れる理由と、火を消す前にすることを答えよ。","沸騰石は急な沸騰（突沸）を防ぐため。火を消す前に、ガラス管の先が試験管の液体につかっていないことを確認する（液体が逆流するのを防ぐ）。"]],
r:[["状態変化","温度によって、物質が固体・液体・気体と状態を変えること。"],["融点","固体がとけて液体になるときの温度。"],["沸点","液体が沸騰して気体になるときの温度。"],["蒸留","液体を加熱して出てきた気体を冷やし、再び液体として取り出す方法。"],["純粋な物質（純物質）","1種類の物質でできているもの。"],["混合物","いくつかの物質が混じり合ったもの。"]]},

{c:"化学",t:"熱分解",i:[
["分解","分解とは何か。熱分解との関係を説明せよ。","1種類の物質が2種類以上の別の物質に分かれる化学変化。加熱による分解を熱分解という。"],
["炭酸水素ナトリウムの熱分解","炭酸水素ナトリウムを加熱したときにできる物質と、その確かめ方を説明せよ。","炭酸ナトリウム（固体）、水（液体）、二酸化炭素（気体）に分解される。水は青色の塩化コバルト紙が赤色（桃色）になることで、二酸化炭素は石灰水が白くにごることで確かめる。炭酸ナトリウムは炭酸水素ナトリウムより水によくとけ、水溶液は強いアルカリ性（フェノールフタレインで濃い赤色）。"],
["実験の注意点","炭酸水素ナトリウムの熱分解で、試験管の口を少し下げる理由と、火を消す前にすることを答えよ。","発生した水が加熱部分に流れて、試験管が割れるのを防ぐため。火を消す前にガラス管を石灰水から出す（石灰水の逆流を防ぐため）。"],
["酸化銀の熱分解","酸化銀を加熱するとどうなるか説明せよ。","黒色の酸化銀が、白色の銀と酸素に分解される。銀は金属なので、みがくと光り、電気を通し、たたくとのびる。"]],
r:[["分解","1種類の物質が2種類以上の別の物質に分かれる化学変化。"],["熱分解","加熱によって起こる分解。"],["塩化コバルト紙","水にふれると青色から赤色（桃色）に変わる試験紙。"],["化学変化（化学反応）","もとの物質とはちがう物質ができる変化。"]]},

{c:"化学",t:"水の電気分解",i:[
["水の電気分解","水の電気分解で発生する気体と体積比、水酸化ナトリウムを加える理由を説明せよ。","陰極（－極）に水素、陽極（＋極）に酸素が発生し、体積比は水素：酸素＝2：1。純粋な水は電流を流しにくいので、電流を流しやすくするために水酸化ナトリウムを少しとかす。"],
["気体の確かめ方","水の電気分解で発生した気体の確かめ方を説明せよ。","陰極側：マッチの火を近づけると気体がポンと音を立てて燃える（水素）。陽極側：火のついた線香を入れると線香が激しく燃える（酸素）。"],
["化学反応式","水の電気分解を化学反応式で表せ。","2H₂O → 2H₂ ＋ O₂"]],
r:[["電気分解","物質に電流を流して分解すること。"],["陰極","電源の－極につないだ電極。"],["陽極","電源の＋極につないだ電極。"]]},

{c:"化学",t:"原子と分子・化学式",i:[
["原子の性質","原子の性質を3つ答えよ。","①化学変化でそれ以上分けることができない。②化学変化で、なくなったり、新しくできたり、ほかの種類の原子に変わったりしない。③種類によって質量や大きさが決まっている。"],
["分子","分子とは何か。分子をつくる物質とつくらない物質の例をあげよ。","いくつかの原子が結びついてできた、物質の性質を示す最小の粒子。分子をつくる物質：水素H₂、酸素O₂、水H₂O、二酸化炭素CO₂、アンモニアNH₃。分子をつくらない物質：金属（鉄Fe、銅Cu、銀Ag）、塩化ナトリウムNaCl、酸化銅CuOなど。"],
["単体と化合物","単体と化合物のちがいを、例をあげて説明せよ。","単体は1種類の元素からできている物質（水素、酸素、鉄、銅など）。化合物は2種類以上の元素からできている物質（水、二酸化炭素、塩化ナトリウムなど）。"],
["化学反応式のつくり方","化学反応式をつくるときの決まりを説明せよ。","矢印の左側に反応前の物質、右側に反応後の物質を化学式で書き、矢印の左右で原子の種類と数が等しくなるように化学式の前に係数をつける。化学式の中の数字（右下の小さい数字）は変えてはいけない。"],
["周期表","周期表とは何か説明せよ。","元素を原子番号の順に並べ、性質の似た元素が縦の列に並ぶようにした表。ロシアのメンデレーエフがもとをつくった。"]],
r:[["原子","化学変化でそれ以上分けることができない、物質をつくる最小の粒子。"],["分子","いくつかの原子が結びついてできた、物質の性質を示す最小の粒子。"],["元素","原子の種類のこと。"],["元素記号","元素をアルファベット1文字または2文字で表した記号。"],["単体","1種類の元素からできている物質。"],["化合物","2種類以上の元素からできている物質。"],["化学式","物質を元素記号と数字を使って表したもの。"],["周期表","元素を原子番号の順に並べ、性質の似た元素が縦に並ぶようにした表。"]]},

{c:"化学",t:"物質どうしが結びつく変化",i:[
["鉄と硫黄の反応","鉄と硫黄の混合物を加熱したときの変化と、反応前後の物質のちがいを説明せよ。","加熱して反応が始まると、加熱をやめても反応が続き（発熱反応）、黒色の硫化鉄ができる。Fe＋S→FeS。鉄は磁石につき、塩酸を加えると水素（無臭）が発生するが、硫化鉄は磁石につかず、塩酸を加えると硫化水素（腐卵臭）が発生する。"],
["銅と硫黄の反応","銅と硫黄の反応を説明せよ。","銅を硫黄の蒸気の中に入れると激しく反応し、黒色の硫化銅ができる。Cu＋S→CuS。"]],
r:[["硫化鉄","鉄と硫黄が結びついてできる黒色の物質。"],["硫化水素","硫化鉄にうすい塩酸を加えると発生する、腐った卵のようなにおいの気体。"]]},

{c:"化学",t:"酸化と燃焼",i:[
["酸化と燃焼","酸化と燃焼のちがいを説明せよ。","物質が酸素と結びつく化学変化が酸化、できた物質が酸化物。酸化のうち、熱や光を出しながら激しく進むものが燃焼。鉄がさびるのは、熱や光を出さずにおだやかに進む酸化。"],
["スチールウールの燃焼","スチールウール（鉄）を燃やしたときの変化を説明せよ。","鉄が酸素と結びついて黒色の酸化鉄になる。結びついた酸素の分だけ質量が増える。酸化鉄は電気を通さず、もろく、塩酸を加えても気体は発生しない。"],
["有機物の燃焼","有機物を燃焼させたときにできる物質を、エタノールやロウを例に説明せよ。","有機物にふくまれる炭素が酸化されて二酸化炭素、水素が酸化されて水ができる。発生した気体は空気中に出ていくので、燃えたあとの質量は小さくなる。"],
["銅・マグネシウムの酸化","銅とマグネシウムを加熱したときの変化と化学反応式を答えよ。","銅：赤色の銅が黒色の酸化銅になる。2Cu＋O₂→2CuO。マグネシウム：激しく光と熱を出して燃え、白色の酸化マグネシウムになる。2Mg＋O₂→2MgO。"]],
r:[["酸化","物質が酸素と結びつく化学変化。"],["酸化物","酸化によってできた物質。"],["燃焼","物質が熱や光を出しながら激しく酸化されること。"]]},

{c:"化学",t:"還元",i:[
["還元","還元とは何か。酸化との関係を説明せよ。","酸化物から酸素が取り除かれる化学変化。還元が起こるとき、酸素を受け取る物質は同時に酸化されるので、還元と酸化は同時に起こる。"],
["酸化銅と炭素の反応","酸化銅と炭素の粉末を混ぜて加熱したときの変化を説明せよ。","酸化銅は還元されて赤色の銅になり、炭素は酸化されて二酸化炭素になる（石灰水が白くにごる）。2CuO＋C→2Cu＋CO₂。銅は炭素より酸素と結びつきにくいため起こる。"],
["酸化銅と水素の反応","酸化銅を水素の中で加熱したときの変化を答えよ。","酸化銅が還元されて銅になり、水素は酸化されて水になる。CuO＋H₂→Cu＋H₂O。"],
["製鉄","鉄鉱石から鉄をつくるしくみを説明せよ。","鉄鉱石（酸化鉄）をコークス（炭素）とともに溶鉱炉で加熱し、酸化鉄を還元して鉄を取り出す。"],
["実験の注意点","酸化銅の還元の実験で、加熱をやめたあとにピンチコックでゴム管を閉じる理由を答えよ。","空気が試験管に入り、できた銅が再び酸化されるのを防ぐため。"]],
r:[["還元","酸化物から酸素が取り除かれる化学変化。"],["コークス","石炭からつくられる炭素のかたまり。製鉄で鉄鉱石の還元に使う。"]]},

{c:"化学",t:"化学変化と質量",i:[
["質量保存の法則","質量保存の法則とは何か。成り立つ理由とあわせて説明せよ。","化学変化の前後で、物質全体の質量は変わらないという法則。化学変化では原子の組み合わせが変わるだけで、原子の種類と数は変わらないため。状態変化でも成り立つ。"],
["気体が発生する反応","炭酸水素ナトリウムとうすい塩酸を反応させたとき、容器のふたを開けると質量はどうなるか。","発生した二酸化炭素が空気中に出ていくので、全体の質量は小さくなる。密閉したままなら質量は変わらない。"],
["結びつく物質の質量の比","金属と酸素が結びつくときの質量の比を、銅とマグネシウムについて答えよ。","化合する物質の質量の比はいつも一定。銅：酸素＝4：1（銅：酸化銅＝4：5）。マグネシウム：酸素＝3：2（マグネシウム：酸化マグネシウム＝3：5）。"],
["加熱をくり返したときの質量","銅の粉末を何度も加熱すると、質量はどのように変化するか。","はじめは結びついた酸素の分だけ増えていくが、銅がすべて酸化されると、それ以上は増えなくなる。"]],
r:[["質量保存の法則","化学変化の前後で、物質全体の質量が変わらないという法則。"]]},

{c:"化学",t:"化学変化と熱",i:[
["発熱反応","発熱反応とは何か。例をあげて説明せよ。","化学変化のときに熱を周囲に出し、温度が上がる反応。例：鉄粉と活性炭・食塩水による化学かいろ（鉄の酸化）、燃焼、酸化カルシウムと水の反応（加熱式弁当）、中和。"],
["吸熱反応","吸熱反応とは何か。例をあげて説明せよ。","化学変化のときに周囲から熱を吸収し、温度が下がる反応。例：炭酸水素ナトリウムとクエン酸の反応、塩化アンモニウムと水酸化バリウムの反応（冷却パック）。"]],
r:[["発熱反応","化学変化のときに熱を周囲に出し、温度が上がる反応。"],["吸熱反応","化学変化のときに周囲から熱を吸収し、温度が下がる反応。"]]},

{c:"化学",t:"電解質とイオン",i:[
["電解質と非電解質","電解質と非電解質のちがいを、例をあげて説明せよ。","水にとかしたとき水溶液に電流が流れる物質が電解質（塩化ナトリウム、塩化水素、塩化銅、水酸化ナトリウムなど）。電流が流れない物質が非電解質（砂糖、エタノールなど）。"],
["原子のつくり","原子のつくりを説明せよ。","中心に＋の電気をもつ原子核があり、そのまわりに－の電気をもつ電子がある。原子核は＋の電気をもつ陽子と電気をもたない中性子からなる。陽子の数と電子の数は等しく、原子全体では電気を帯びていない。同じ元素で中性子の数がちがう原子を同位体という。"],
["イオン","陽イオンと陰イオンのでき方を説明せよ。","原子が電子を失うと＋の電気を帯びた陽イオン（Na⁺、H⁺、Cu²⁺など）、電子を受け取ると－の電気を帯びた陰イオン（Cl⁻、OH⁻、SO₄²⁻など）になる。"],
["電離","電離とは何か。塩化ナトリウムと塩化銅を例に説明せよ。","電解質が水にとけて陽イオンと陰イオンに分かれること。NaCl→Na⁺＋Cl⁻、CuCl₂→Cu²⁺＋2Cl⁻。"]],
r:[["電解質","水にとかしたとき、水溶液に電流が流れる物質。"],["非電解質","水にとかしても、水溶液に電流が流れない物質。"],["原子核","原子の中心にあり、＋の電気をもつもの。陽子と中性子からなる。"],["陽子","原子核をつくる、＋の電気をもつ粒子。"],["中性子","原子核をつくる、電気をもたない粒子。"],["イオン","原子が電子を失ったり受け取ったりして、電気を帯びたもの。"],["陽イオン","原子が電子を失って、＋の電気を帯びたもの。"],["陰イオン","原子が電子を受け取って、－の電気を帯びたもの。"],["電離","電解質が水にとけて陽イオンと陰イオンに分かれること。"],["同位体","同じ元素で、中性子の数がちがう原子。"]]},

{c:"化学",t:"電気分解とイオン",i:[
["塩化銅水溶液の電気分解","塩化銅水溶液を電気分解したときの変化を、イオンの動きとあわせて説明せよ。","陰極には赤色の銅が付着し、陽極からは塩素が発生する（プールのようなにおい、赤インクの色が消える）。銅イオンCu²⁺は陰極に引かれて電子を受け取り銅に、塩化物イオンCl⁻は陽極に引かれて電子を渡し塩素になる。CuCl₂→Cu＋Cl₂。水溶液の青色はうすくなる。"],
["塩酸の電気分解","塩酸を電気分解したときの変化を説明せよ。","陰極から水素、陽極から塩素が発生する。発生する体積は同じだが、塩素は水にとけやすいので集まる量は少ない。2HCl→H₂＋Cl₂。"]],
r:[["塩素","塩化銅水溶液や塩酸の電気分解で陽極から発生する、黄緑色で刺激臭のある気体。"]]},

{c:"化学",t:"電池のしくみ",i:[
["電池（化学電池）","電池（化学電池）とは何か。つくるための条件を説明せよ。","化学変化を利用して、物質がもつ化学エネルギーを電気エネルギーに変える装置。2種類の異なる金属を電解質の水溶液に入れるとできる。同じ金属どうしや、非電解質の水溶液ではできない。"],
["金属のイオンへのなりやすさ","金属のイオンへのなりやすさの順と、それがわかる実験を説明せよ。","マグネシウム＞亜鉛＞銅。硫酸銅水溶液に亜鉛板を入れると、亜鉛がイオンになってとけ出し、表面に赤色の銅が付着する。逆に硫酸亜鉛水溶液に銅板を入れても変化しない。"],
["ダニエル電池","ダニエル電池のしくみを説明せよ。","亜鉛板を硫酸亜鉛水溶液に、銅板を硫酸銅水溶液に入れ、セロハン（素焼きの板）で仕切ったもの。イオンになりやすい亜鉛がZn→Zn²⁺＋2e⁻と電子を出して－極になり、電子は導線を通って銅板へ移動し、銅板の表面でCu²⁺＋2e⁻→Cuと銅が付着する（＋極）。セロハンは2つの水溶液がすぐに混ざるのを防ぎ、イオンを通過させる。"],
["一次電池・二次電池・燃料電池","一次電池・二次電池・燃料電池のちがいを説明せよ。","一次電池：使うと電圧が下がり、もとにもどらない（マンガン乾電池、アルカリ乾電池）。二次電池：充電してくり返し使える（リチウムイオン電池、鉛蓄電池）。燃料電池：水の電気分解と逆の化学変化（2H₂＋O₂→2H₂O）を利用して電気エネルギーを取り出す。水だけができ、環境への影響が少ない。"]],
r:[["電池（化学電池）","化学変化を利用して、化学エネルギーを電気エネルギーに変える装置。"],["一次電池","使うと電圧が下がり、充電してもとにもどすことができない電池。"],["二次電池（蓄電池）","充電によってくり返し使うことができる電池。"],["燃料電池","水素と酸素が反応して水ができるときに、電気エネルギーを取り出す装置。"],["ダニエル電池","亜鉛板と硫酸亜鉛水溶液、銅板と硫酸銅水溶液をセロハンで仕切ってつくる電池。"]]},

{c:"化学",t:"酸とアルカリ",i:[
["酸性の水溶液の性質","酸性の水溶液の性質を答えよ。","青色リトマス紙を赤色に変える。BTB溶液を黄色にする。マグネシウムなどの金属を入れると水素が発生する。pHが7より小さい。例：塩酸、硫酸、酢酸、炭酸水。"],
["アルカリ性の水溶液の性質","アルカリ性の水溶液の性質を答えよ。","赤色リトマス紙を青色に変える。BTB溶液を青色にする。フェノールフタレイン溶液を赤色にする。pHが7より大きい。例：水酸化ナトリウム水溶液、アンモニア水、石灰水。"],
["酸とアルカリの正体","酸とアルカリとは何か。イオンを使って説明せよ。","酸は水溶液中で電離して水素イオンH⁺を生じる物質（HCl→H⁺＋Cl⁻）。アルカリは水溶液中で電離して水酸化物イオンOH⁻を生じる物質（NaOH→Na⁺＋OH⁻）。酸性を示すもとはH⁺、アルカリ性を示すもとはOH⁻。"],
["イオンの移動の実験","酸性やアルカリ性を示すもとがイオンであることを確かめる実験を説明せよ。","食塩水でしめらせたろ紙の上にリトマス紙を置き、中央に塩酸をしみこませた糸を置いて電圧を加えると、青色リトマス紙の赤くなった部分が陰極側に移動する。＋の電気をもつH⁺が陰極に引かれるため。水酸化ナトリウム水溶液では、赤色リトマス紙の青くなった部分が陽極側に移動する（OH⁻）。"],
["pH","pHとは何か説明せよ。","酸性・アルカリ性の強さを表す数値。7が中性で、7より小さいほど酸性が強く、7より大きいほどアルカリ性が強い。"]],
r:[["酸","水溶液にしたとき、電離して水素イオンを生じる物質。"],["アルカリ","水溶液にしたとき、電離して水酸化物イオンを生じる物質。"],["pH","酸性・アルカリ性の強さを表す数値。7が中性。"],["BTB溶液","酸性で黄色、中性で緑色、アルカリ性で青色になる指示薬。"],["フェノールフタレイン溶液","アルカリ性で赤色になる指示薬。"]]},

{c:"化学",t:"中和と塩",i:[
["中和","中和とは何か。イオンの式とあわせて説明せよ。","酸とアルカリを混ぜたとき、酸の水素イオンとアルカリの水酸化物イオンが結びついて水ができ、たがいの性質を打ち消し合う反応。H⁺＋OH⁻→H₂O。中和は発熱反応。"],
["塩","塩とは何か。例をあげて説明せよ。","中和のとき、酸の陰イオンとアルカリの陽イオンが結びついてできる物質。塩酸＋水酸化ナトリウム→塩化ナトリウム（水にとける）＋水。硫酸＋水酸化バリウム→硫酸バリウム（水にとけにくく白い沈殿）＋水。"],
["中和とイオンの数の変化","塩酸に水酸化ナトリウム水溶液を少しずつ加えたときの、イオンの数の変化を説明せよ。","H⁺はOH⁻と結びつくので減っていき、中性になると0。Cl⁻は変化せず一定。Na⁺は加えた分だけ増え続ける。OH⁻は中性になるまでは0で、その後増えていく。イオンの総数は中性になるまで一定で、その後増える。"],
["中和の確認","BTB溶液を加えた塩酸に水酸化ナトリウム水溶液を加えていくとき、色はどう変化するか。","黄色→緑色（中性）→青色と変化する。緑色になったとき、水溶液を蒸発させると塩化ナトリウムの結晶が得られる。"]],
r:[["中和","酸とアルカリを混ぜたとき、たがいの性質を打ち消し合う反応。"],["塩","中和のときに、酸の陰イオンとアルカリの陽イオンが結びついてできる物質。"]]}
);

{c:"生物",t:"観察器具の使い方",i:[
["ルーペ","ルーペの使い方を説明せよ。","ルーペを目に近づけて持つ。観察するものが動かせるときは、観察するものを前後に動かしてピントを合わせる。動かせないときは、顔を前後に動かす。太陽を見てはいけない。"],
["顕微鏡の操作","顕微鏡でピントを合わせる手順を説明せよ。","はじめは低倍率の対物レンズにする。横から見ながら調節ねじを回して対物レンズとプレパラートをできるだけ近づけ、接眼レンズをのぞきながら、対物レンズとプレパラートを離す向きに回してピントを合わせる。直射日光の当たらない明るい場所で使う。"],
["倍率と見え方","顕微鏡の倍率の求め方と、高倍率にしたときの見え方の変化を答えよ。","倍率＝接眼レンズの倍率×対物レンズの倍率。高倍率にすると、見える範囲はせまくなり、視野は暗くなる。レンズは接眼レンズ→対物レンズの順に取りつける（ほこりが入るのを防ぐ）。"],
["双眼実体顕微鏡","双眼実体顕微鏡の特徴を答えよ。","両目で観察するので、20〜40倍程度で立体的に見える。プレパラートをつくる必要がない。"]],
r:[["プレパラート","スライドガラスに観察物をのせ、カバーガラスをかけたもの。"],["双眼実体顕微鏡","両目で観察し、ものを立体的に見ることができる顕微鏡。"]]},

{c:"生物",t:"花のつくり",i:[
["被子植物の花のつくり","被子植物の花のつくりを、外側から順に答えよ。","外側から、がく→花弁→おしべ→めしべ。おしべの先にはやくがあり、花粉が入っている。めしべの先は柱頭、根もとのふくらんだ部分が子房で、子房の中に胚珠がある。"],
["受粉と果実・種子","受粉とは何か。受粉後の変化とあわせて説明せよ。","おしべのやくから出た花粉が、めしべの柱頭につくこと。受粉すると、子房が成長して果実になり、子房の中の胚珠が成長して種子になる。"],
["裸子植物の花","マツの花のつくりを説明せよ。","雌花と雄花に分かれている。雌花のりん片には子房がなく胚珠がむき出しでついている。雄花のりん片には花粉のう（花粉が入った袋）がある。花粉は風で運ばれ、直接胚珠について受粉する。果実はできず、種子ができる（まつかさ）。"],
["花粉の運ばれ方","花粉の運ばれ方による花の特徴のちがいを説明せよ。","虫媒花：昆虫に花粉を運ばせる。花弁が目立ち、においや蜜をもつ（アブラナ、サクラ）。風媒花：風で花粉が運ばれる。花弁が目立たず、花粉が軽く多い（マツ、トウモロコシ、イネ）。"]],
r:[["めしべ","花の中心にあり、柱頭・花柱・子房からなる部分。"],["柱頭","めしべの先の部分。受粉のとき花粉がつく。"],["子房","めしべの根もとのふくらんだ部分。受粉後に果実になる。"],["胚珠","子房の中にあり、受粉後に種子になる部分。"],["やく","おしべの先にある、花粉が入っている袋。"],["受粉","めしべの柱頭に花粉がつくこと。"],["花粉のう","マツの雄花のりん片にある、花粉が入っている袋。"]]},

{c:"生物",t:"植物の分類",i:[
["被子植物と裸子植物","種子植物は、何のちがいで被子植物と裸子植物に分けられるか。例をあげて説明せよ。","胚珠が子房の中にあるのが被子植物（アブラナ、ツツジ、イネなど）。子房がなく胚珠がむき出しになっているのが裸子植物（マツ、イチョウ、スギ、ソテツ）。"],
["単子葉類と双子葉類","単子葉類と双子葉類のちがいを、子葉・葉脈・根・維管束について説明せよ。","単子葉類：子葉1枚、葉脈は平行脈、根はひげ根、茎の維管束は散らばっている（イネ、トウモロコシ、ユリ）。双子葉類：子葉2枚、葉脈は網状脈、根は主根と側根、茎の維管束は輪状に並ぶ（アブラナ、サクラ、ツツジ）。"],
["合弁花類と離弁花類","双子葉類の合弁花類と離弁花類のちがいを、例をあげて説明せよ。","花弁がくっついているのが合弁花類（アサガオ、ツツジ、タンポポ）。花弁が1枚1枚離れているのが離弁花類（アブラナ、サクラ、エンドウ）。"],
["シダ植物とコケ植物","シダ植物とコケ植物の特徴とちがいを説明せよ。","どちらも種子をつくらず、胞子でふえる。シダ植物（イヌワラビ、スギナ）：根・茎・葉の区別があり、維管束がある。茎は地下茎が多い。コケ植物（ゼニゴケ、スギゴケ）：根・茎・葉の区別がなく、維管束もない。仮根でからだを地面に固定し、水はからだの表面から吸収する。雄株と雌株がある。"]],
r:[["種子植物","花をさかせ、種子をつくってなかまをふやす植物。"],["被子植物","胚珠が子房の中にある種子植物。"],["裸子植物","子房がなく、胚珠がむき出しになっている種子植物。"],["単子葉類","子葉が1枚で、葉脈が平行、根がひげ根の被子植物。"],["双子葉類","子葉が2枚で、葉脈が網目状、根が主根と側根の被子植物。"],["合弁花類","花弁がくっついている双子葉類。"],["離弁花類","花弁が1枚1枚離れている双子葉類。"],["胞子","シダ植物やコケ植物が、なかまをふやすためにつくるもの。"],["仮根","コケ植物で、からだを地面などに固定するはたらきをするもの。"]]},

{c:"生物",t:"根・茎・葉のつくり",i:[
["根のはたらき","根のはたらきと、根毛があることの利点を説明せよ。","水や水にとけた養分（肥料分）を吸収し、からだを支える。根の先端近くには細い根毛が多数あり、土と接する表面積が大きくなるので、水や養分を効率よく吸収できる。"],
["道管と師管","道管と師管のはたらきと、茎での位置を説明せよ。","道管は根から吸収した水や養分が通る管。師管は葉でつくられた栄養分が通る管。茎の維管束では、道管が内側（中心側）、師管が外側にある。葉では道管が表側、師管が裏側。"],
["葉のつくり","葉の断面のつくりを説明せよ。","表皮の内側に葉緑体をもつ細胞が並び、すきまが多い。葉脈は維管束で、道管と師管が通っている。表皮には孔辺細胞に囲まれた気孔がある。気孔はふつう葉の裏側に多い。"],
["気孔","気孔とは何か。はたらきとあわせて説明せよ。","葉の表皮にある、三日月形の2つの孔辺細胞に囲まれたすきま。酸素・二酸化炭素の出入り口、蒸散による水蒸気の出口となる。孔辺細胞のはたらきで開いたり閉じたりする。"],
["根のつくりの確認","ホウセンカを色水にさしておくと、茎の断面はどのように染まるか。トウモロコシとのちがいとあわせて説明せよ。","道管が染まる。双子葉類のホウセンカでは維管束が輪状に並んでいるので輪状に、単子葉類のトウモロコシでは維管束が散らばっているので点々と染まる。"]],
r:[["根毛","根の先端付近にある細い毛のようなもの。土と接する面積を大きくする。"],["道管","根から吸収した水や水にとけた養分が通る管。"],["師管","葉でつくられた栄養分が通る管。"],["維管束","道管と師管が集まって束になったもの。"],["葉脈","葉にある維管束。"],["気孔","2つの孔辺細胞に囲まれたすきま。気体の出入り口となる。"],["孔辺細胞","気孔を囲む三日月形の細胞。"]]},

{c:"生物",t:"光合成",i:[
["光合成","光合成とは何か。材料と、できる物質を説明せよ。","植物が光のエネルギーを使って、二酸化炭素と水からデンプンなどの栄養分をつくるはたらき。このとき酸素も発生する。細胞の中の葉緑体で行われる。二酸化炭素は気孔から、水は根から取り入れる。"],
["光合成の確かめ方","光合成でデンプンができたことを確かめる実験の手順を説明せよ。","前日から暗い所に置いてデンプンをなくした葉に、日光を当てる。葉をあたためたエタノールにつけて脱色し（葉緑素をとかし出し、ヨウ素液の反応を見やすくする）、水洗いしてヨウ素液につけると、日光が当たった部分が青紫色になる。"],
["ふ入りの葉の実験","ふ入りの葉とアルミニウムはくを使った実験から、何がわかるか説明せよ。","日光が当たった緑色の部分だけが青紫色になる。日光が当たった緑色の部分と当たらない緑色の部分を比べると、光合成には光が必要なことがわかる。日光が当たった緑色の部分とふの部分を比べると、葉緑体が必要なことがわかる。"],
["二酸化炭素の確かめ方","光合成で二酸化炭素が使われることを、BTB溶液で確かめる方法を説明せよ。","息をふきこんで緑色にしたBTB溶液にオオカナダモを入れ、光を当てると、二酸化炭素が使われて青色になる。オオカナダモを入れない試験管も用意して比べる（対照実験）。"],
["栄養分のゆくえ","光合成でつくられたデンプンは、どのようにからだの各部へ運ばれるか。","水にとけやすい物質（ショ糖など）に変えられて、師管を通って運ばれる。からだの成長に使われたり、種子・根・いもなどに再びデンプンとしてたくわえられたりする。"]],
r:[["光合成","植物が光を受けて、二酸化炭素と水からデンプンなどをつくり、酸素を出すはたらき。"],["葉緑体","植物の細胞の中にある緑色の粒。光合成が行われる。"],["ヨウ素液","デンプンがあると青紫色に変化する液。"],["対照実験","調べたい条件以外を同じにして行う実験。"]]},

{c:"生物",t:"植物の呼吸と蒸散",i:[
["植物の呼吸","植物の呼吸とは何か。光合成との関係とあわせて説明せよ。","酸素を取り入れて二酸化炭素を出すはたらき。昼も夜も1日中行っている。昼は光合成が呼吸よりさかんなので、全体として二酸化炭素を取り入れて酸素を出しているように見える。夜は光合成を行わないので呼吸だけになる。"],
["蒸散","蒸散とは何か。はたらきとあわせて説明せよ。","植物のからだの水が、おもに気孔から水蒸気となって出ていくこと。根からの水の吸い上げをさかんにし、体温の上昇を防ぐ。"],
["蒸散量の実験","葉の表と裏にワセリンをぬって蒸散量を比べる実験で、葉の裏側からの蒸散量を求める方法を説明せよ。","A：何もぬらない（表＋裏＋茎）、B：表にぬる（裏＋茎）、C：裏にぬる（表＋茎）とすると、裏側からの蒸散量はA－C、表側はA－B で求められる。気孔が多い裏側の方が蒸散量が多い。水面に油をたらすのは、水面からの蒸発を防ぐため。"]],
r:[["蒸散","植物のからだの水が、おもに気孔から水蒸気となって出ていくこと。"],["呼吸（植物）","酸素を取り入れて二酸化炭素を出すはたらき。植物は1日中行う。"]]},

{c:"生物",t:"セキツイ動物の分類",i:[
["5つのなかま","セキツイ動物の5つのなかまと、それぞれの例を答えよ。","魚類（フナ、サメ）、両生類（カエル、イモリ）、ハチュウ類（トカゲ、ヘビ、カメ）、鳥類（ハト、ペンギン）、哺乳類（ヒト、イヌ、クジラ、コウモリ）。"],
["呼吸のしかた","セキツイ動物の呼吸のしかたのちがいを説明せよ。","魚類はえら呼吸。両生類は、子はえらと皮膚、親（おとな）は肺と皮膚で呼吸する。ハチュウ類・鳥類・哺乳類は肺呼吸。"],
["子のうまれ方","卵生と胎生のちがいを説明せよ。","卵生：親が卵をうみ、卵から子がかえる（魚類・両生類・ハチュウ類・鳥類）。魚類・両生類は殻のない卵を水中に、ハチュウ類・鳥類は殻のある卵を陸上にうむ。胎生：子が母親の体内である程度育ってからうまれる（哺乳類）。"],
["体温と体表","恒温動物と変温動物、セキツイ動物の体表のちがいを説明せよ。","恒温動物は周囲の温度が変わっても体温がほぼ一定（鳥類・哺乳類）。変温動物は周囲の温度によって体温が変わる（魚類・両生類・ハチュウ類）。体表は、魚類とハチュウ類はうろこ、両生類はしめった皮膚、鳥類は羽毛、哺乳類は毛。"],
["草食動物と肉食動物","草食動物と肉食動物のからだのつくりのちがいを説明せよ。","草食動物（シマウマ）：目が横向きについていて広い範囲を見わたせる。門歯と臼歯が発達し、草をかみ切ってすりつぶす。消化管が長い。肉食動物（ライオン）：目が前向きについていて、立体的に見える範囲が広く、獲物までの距離をはかりやすい。犬歯が発達し、獲物をとらえて肉を引きさく。"]],
r:[["セキツイ動物","背骨をもつ動物。"],["卵生","親が卵をうみ、卵から子がかえる子のうまれ方。"],["胎生","子が母親の体内である程度育ってからうまれる子のうまれ方。"],["恒温動物","周囲の温度が変わっても、体温がほぼ一定に保たれる動物。"],["変温動物","周囲の温度によって体温が変わる動物。"],["犬歯","肉食動物で発達している、獲物をとらえ肉を引きさくのに適した歯。"],["臼歯","草食動物で発達している、草をすりつぶすのに適した歯。"]]},

{c:"生物",t:"無セキツイ動物",i:[
["節足動物","節足動物とは何か。なかまと特徴を説明せよ。","からだが外骨格というかたい殻でおおわれ、からだやあしに節がある動物。昆虫類（頭部・胸部・腹部に分かれ、胸部にあしが3対6本、腹部の気門から空気を取り入れる）、甲殻類（エビ、カニ、ミジンコ。多くは水中でえら呼吸）、クモ類、ムカデ類など。成長するときは脱皮する。"],
["軟体動物","軟体動物とは何か。特徴と例を説明せよ。","内臓が外とう膜でおおわれ、からだやあしに節がない動物。あしは筋肉でできている。イカ、タコ、アサリ、マイマイ（カタツムリ）など。水中のものはえらで呼吸し、マイマイは肺で呼吸する。"],
["その他の無セキツイ動物","節足動物・軟体動物以外の無セキツイ動物の例をあげよ。","ミミズ（環形動物）、ウニ・ヒトデ、クラゲ、イソギンチャクなど。"]],
r:[["無セキツイ動物","背骨をもたない動物。"],["節足動物","外骨格をもち、からだやあしに節がある無セキツイ動物。"],["外骨格","節足動物のからだの外側をおおうかたい殻。"],["軟体動物","内臓が外とう膜でおおわれ、からだやあしに節がない無セキツイ動物。"],["外とう膜","軟体動物の内臓をおおっている膜。"],["気門","昆虫の胸部や腹部にある、空気を取り入れる穴。"]]},

{c:"生物",t:"細胞のつくり",i:[
["動物と植物に共通するつくり","動物の細胞と植物の細胞に共通するつくりを答えよ。","核と細胞膜。核は酢酸カーミン液（酢酸オルセイン液）で赤く染まり、ふつう1つの細胞に1つある。核以外の部分を細胞質という。"],
["植物の細胞だけのつくり","植物の細胞にだけ見られるつくりと、そのはたらきを答えよ。","細胞壁：細胞膜の外側にあるじょうぶな仕切り。からだを支える。葉緑体：光合成を行う緑色の粒。液胞：細胞の活動でできた物質や水をふくむ袋。成長した細胞で大きい。"],
["単細胞生物と多細胞生物","単細胞生物と多細胞生物のちがいを、例をあげて説明せよ。","単細胞生物は1つの細胞だけでからだができている生物（ゾウリムシ、ミカヅキモ、アメーバ、ミドリムシ）。多細胞生物は多くの細胞からできている生物。多細胞生物では、形やはたらきが同じ細胞が集まって組織、組織が集まって器官、器官が集まって個体ができている。"],
["細胞の呼吸","細胞による呼吸（細胞呼吸）とは何か説明せよ。","細胞が酸素を使って栄養分を分解し、生きるためのエネルギーを取り出すはたらき。このとき二酸化炭素と水ができる。"]],
r:[["細胞","生物のからだをつくっている最小単位。"],["核","細胞の中にふつう1つあり、酢酸カーミン液などで赤く染まるつくり。"],["細胞膜","細胞のまわりをとり囲むうすい膜。"],["細胞壁","植物の細胞の細胞膜の外側にある、じょうぶな仕切り。"],["液胞","植物の細胞にある、細胞の活動でできた物質や水をふくむ袋。"],["細胞質","細胞のうち、核以外の部分。"],["単細胞生物","1つの細胞だけでからだができている生物。"],["多細胞生物","多くの細胞からからだができている生物。"],["組織","形やはたらきが同じ細胞が集まったもの。"],["器官","いくつかの組織が集まって、特定のはたらきをする部分。"]]},

{c:"生物",t:"消化と吸収",i:[
["消化と消化酵素","消化と消化酵素とは何か説明せよ。","消化は、食物を分解して、吸収されやすい物質に変えるはたらき。消化酵素は消化液にふくまれ、食物を分解するはたらきをもつ物質。決まった物質にだけはたらき、体温くらいの温度でよくはたらく。"],
["消化酵素の種類","おもな消化酵素と、それがふくまれる消化液、分解する物質を答えよ。","アミラーゼ（だ液・すい液）：デンプンを分解。ペプシン（胃液）：タンパク質を分解。トリプシン（すい液）：タンパク質を分解。リパーゼ（すい液）：脂肪を分解。胆汁（肝臓でつくられ胆のうにたくわえられる）は消化酵素をふくまないが、脂肪の分解を助ける。"],
["最終的な分解物","デンプン・タンパク質・脂肪は、最終的に何に分解されるか。","デンプン→ブドウ糖。タンパク質→アミノ酸。脂肪→脂肪酸とモノグリセリド。"],
["だ液のはたらきの実験","だ液のはたらきを調べる実験の方法と結果を説明せよ。","デンプン溶液にだ液を加えたものと水を加えたものを、約40℃（体温くらい）で10分ほどあたためる。だ液を加えた方はヨウ素液で変化せず、ベネジクト液を加えて加熱すると赤かっ色の沈殿ができる。だ液によってデンプンが分解され、麦芽糖などができたことがわかる。"],
["吸収","小腸での吸収のしくみを説明せよ。","小腸の内側のかべには多くのひだがあり、その表面に柔毛という小さな突起が無数にあるので、表面積が大きく効率よく吸収できる。ブドウ糖とアミノ酸は柔毛の毛細血管に入り、肝臓を通って全身へ運ばれる。脂肪酸とモノグリセリドは柔毛内で再び脂肪になってリンパ管に入る。水分は小腸と大腸で吸収される。"]],
r:[["消化","食物を分解して、吸収されやすい物質に変えるはたらき。"],["消化酵素","消化液にふくまれ、食物を分解するはたらきをもつ物質。"],["アミラーゼ","だ液やすい液にふくまれ、デンプンを分解する消化酵素。"],["ペプシン","胃液にふくまれ、タンパク質を分解する消化酵素。"],["トリプシン","すい液にふくまれ、タンパク質を分解する消化酵素。"],["リパーゼ","すい液にふくまれ、脂肪を分解する消化酵素。"],["胆汁","肝臓でつくられ胆のうにたくわえられる、脂肪の消化を助ける液。消化酵素はふくまない。"],["柔毛","小腸の内側のかべにある小さな突起。養分を吸収する表面積を大きくしている。"],["ベネジクト液","ブドウ糖や麦芽糖があると、加熱したとき赤かっ色の沈殿ができる液。"]]},

{c:"生物",t:"呼吸のしくみ",i:[
["肺のつくり","肺のつくりと、肺胞が多数あることの利点を説明せよ。","気管が枝分かれした気管支の先に、肺胞という小さな袋が多数ある。肺胞のまわりは毛細血管がとり囲んでいる。肺胞が多数あることで、空気にふれる表面積が大きくなり、酸素と二酸化炭素の交換を効率よく行える。"],
["肺胞での気体の交換","肺胞での気体の交換を説明せよ。","肺胞内の空気中の酸素が毛細血管の血液にとりこまれ、血液中の二酸化炭素が肺胞内に出される。"],
["呼吸運動","息を吸うときの、ろっ骨と横隔膜の動きを説明せよ。","肺には筋肉がないので、ろっ骨が上がり横隔膜が下がることで胸の空間が広がり、肺に空気が入る。息をはくときは、ろっ骨が下がり横隔膜が上がる。"]],
r:[["肺胞","気管支の先にある小さな袋。毛細血管がとり囲み、気体の交換を行う。"],["気管支","気管が枝分かれした細い管。"],["横隔膜","肺の下にあり、上下に動いて呼吸運動を行う膜。"]]},

{c:"生物",t:"血液の循環",i:[
["血液の成分","血液の成分とそれぞれのはたらきを答えよ。","赤血球：ヘモグロビンをふくみ、酸素を運ぶ。白血球：体内に入った細菌などの異物を分解する。血小板：出血したとき血液を固める。血しょう：液体成分で、栄養分や二酸化炭素、不要な物質をとかして運ぶ。"],
["ヘモグロビン","ヘモグロビンの性質を説明せよ。","赤血球にふくまれる赤い物質。酸素の多い所では酸素と結びつき、酸素の少ない所では酸素をはなす性質があるので、肺で酸素を受け取り、全身の細胞にわたせる。"],
["組織液","組織液とは何か説明せよ。","血しょうの一部が毛細血管からしみ出して、細胞のまわりを満たしている液。血液と細胞の間で、栄養分・酸素・二酸化炭素・不要な物質の受けわたしのなかだちをする。"],
["心臓と血管","心臓のつくりと、動脈・静脈のちがいを説明せよ。","心臓は右心房・右心室・左心房・左心室の4つの部屋に分かれ、規則正しく収縮して血液を送り出す。動脈は心臓から送り出される血液が流れる血管で、かべが厚く弾力がある。静脈は心臓にもどる血液が流れる血管で、かべがうすく、ところどころに逆流を防ぐ弁がある。"],
["肺循環と体循環","肺循環と体循環を説明せよ。動脈血・静脈血とあわせて答えよ。","肺循環：右心室→肺動脈→肺→肺静脈→左心房。体循環：左心室→大動脈→全身→大静脈→右心房。酸素を多くふくむ動脈血は肺静脈と大動脈を、二酸化炭素を多くふくむ静脈血は大静脈と肺動脈を流れる。"]],
r:[["赤血球","ヘモグロビンをふくみ、酸素を運ぶ血液の成分。"],["白血球","体内に入った細菌などの異物を分解する血液の成分。"],["血小板","出血したとき、血液を固めるはたらきをする血液の成分。"],["血しょう","血液の液体成分。栄養分や不要な物質をとかして運ぶ。"],["ヘモグロビン","赤血球にふくまれ、酸素の多い所で酸素と結びつく赤い物質。"],["組織液","血しょうが毛細血管からしみ出し、細胞のまわりを満たしている液。"],["動脈","心臓から送り出される血液が流れる血管。"],["静脈","心臓にもどる血液が流れる血管。ところどころに弁がある。"],["動脈血","酸素を多くふくむ血液。"],["静脈血","二酸化炭素を多くふくむ血液。"],["肺循環","心臓から肺を通って心臓にもどる血液の流れ。"],["体循環","心臓から全身を通って心臓にもどる血液の流れ。"]]},

{c:"生物",t:"排出",i:[
["肝臓のはたらき","肝臓のはたらきを答えよ。","アミノ酸が分解されてできる有害なアンモニアを、害の少ない尿素に変える。胆汁をつくる。ブドウ糖をグリコーゲンに変えてたくわえる。"],
["じん臓のはたらき","じん臓のはたらきと、尿が体外に出されるまでの流れを説明せよ。","血液中から尿素などの不要な物質や余分な水分・塩分をこし出して尿をつくる。尿は輸尿管を通ってぼうこうに一時的にためられ、体外に出される。"]],
r:[["排出","からだの中でできた不要な物質を体外に出すはたらき。"],["尿素","肝臓でアンモニアからつくられる、害の少ない物質。"],["じん臓","血液中の尿素などの不要な物質をこし出して尿をつくる器官。"],["ぼうこう","尿を一時的にためておく袋。"]]},

{c:"生物",t:"刺激と反応",i:[
["感覚器官","感覚器官とは何か。目と耳のつくりを説明せよ。","外界からの刺激を受け取る器官。目：レンズ（水晶体）で光を屈折させ、網膜に像を結ぶ。虹彩でひとみの大きさを変え、入る光の量を調節する。耳：鼓膜が音をとらえて振動し、耳小骨を通してうずまき管に伝える。"],
["神経系","中枢神経と末しょう神経のちがいを説明せよ。","中枢神経は脳とせきずいで、判断や命令を行う。末しょう神経は中枢神経から枝分かれして全身に広がる神経で、感覚器官からの信号を伝える感覚神経と、中枢神経からの命令を筋肉に伝える運動神経がある。"],
["意識して起こす反応","「手をにぎられたのでにぎり返す」反応で、刺激や命令の信号が伝わる経路を説明せよ。","皮膚（感覚器官）→感覚神経→せきずい→脳（判断・命令）→せきずい→運動神経→筋肉（運動器官）。"],
["反射","反射とは何か。経路と例を説明せよ。","刺激に対して、意識とは関係なく決まった反応が起こること。感覚器官→感覚神経→せきずい→運動神経→筋肉と、脳を通らずにせきずいなどから命令が出るので、反応までの時間が短い。危険から体を守るのに役立つ。例：熱いものにふれて手を引っこめる、明るい所でひとみが小さくなる。"],
["骨格と筋肉","うでを曲げるときの筋肉のはたらきを説明せよ。","骨格を動かす筋肉は両端がけんで骨についていて、関節をへだてた2つの骨についている。うでを曲げるときは内側の筋肉が縮み、外側の筋肉がゆるむ。筋肉は縮むことはできるが、自分でのびることはできない。"]],
r:[["感覚器官","外界からの刺激を受け取る器官。"],["網膜","目のおくにあり、光の刺激を受け取る細胞がある膜。"],["虹彩","ひとみの大きさを変えて、目に入る光の量を調節するつくり。"],["中枢神経","脳とせきずい。判断や命令を行う。"],["末しょう神経","中枢神経から枝分かれして全身に広がる神経。感覚神経と運動神経がある。"],["感覚神経","感覚器官からの信号を中枢神経に伝える神経。"],["運動神経","中枢神経からの命令を筋肉に伝える神経。"],["反射","刺激に対して、意識とは関係なく決まった反応が起こること。"],["けん","筋肉の両端にあり、骨についているじょうぶなつくり。"],["関節","骨と骨のつなぎ目で、曲がる部分。"]]},

{c:"生物",t:"細胞分裂と成長",i:[
["体細胞分裂の順序","体細胞分裂の過程を順に説明せよ。","①核の中で染色体が複製される。②染色体が太く短くなって見えるようになる。③染色体が細胞の中央に並ぶ。④染色体が分かれて両端へ移動する。⑤2つの核ができ、細胞質が2つに分かれる（植物では中央に仕切りができる）。"],
["生物の成長","生物のからだが成長するしくみを説明せよ。","体細胞分裂で細胞の数がふえ、分裂した細胞が大きくなることで成長する。体細胞分裂では、もとの細胞と同じ数の染色体をもつ細胞ができる。"],
["根の成長の観察","タマネギの根で細胞分裂を観察するときの、うすい塩酸の役割と、よく観察できる部分を答えよ。","うすい塩酸であたためると、細胞どうしが離れやすくなり、顕微鏡で見やすくなる。根の先端付近（根冠のすぐ内側の成長点）で細胞分裂がさかんで、小さい細胞が多い。根もとに近いほど細胞は大きい。"]],
r:[["体細胞分裂","からだをつくる細胞がふえるときの細胞分裂。染色体の数は変わらない。"],["染色体","細胞分裂のときに核の中に見えるひも状のもの。遺伝子をふくむ。"],["成長点","根の先端付近にある、細胞分裂がさかんな部分。"]]},

{c:"生物",t:"生物のふえ方",i:[
["無性生殖","無性生殖とは何か。例と特徴を説明せよ。","受精を行わず、からだの一部が分かれて新しい個体ができる生殖。分裂（ゾウリムシ、ミカヅキモ）、出芽（ヒドラ、酵母）、栄養生殖（ジャガイモのいも、サツマイモ、オランダイチゴのほふく茎、さし木）。子は親とまったく同じ遺伝子を受けつぐので、親と同じ形質になる。"],
["有性生殖","有性生殖とは何か説明せよ。","雌雄の生殖細胞が受精して新しい個体ができる生殖。子は両方の親から半分ずつ遺伝子を受けつぐので、親と異なる形質が現れることがある。"],
["動物の有性生殖","動物の有性生殖で、受精から個体になるまでを説明せよ。","雌の卵巣でつくられた卵と、雄の精巣でつくられた精子が受精して受精卵ができる。受精卵は体細胞分裂をくり返して胚になり、組織や器官がつくられて個体になる。この過程を発生という。"],
["植物の有性生殖","被子植物の受精のしくみを説明せよ。","花粉が柱頭につくと、花粉から胚珠に向かって花粉管がのびる。花粉管の中を精細胞が移動し、胚珠の中の卵細胞と受精する。受精卵は胚になり、胚珠全体は種子に、子房は果実になる。"],
["減数分裂","減数分裂とは何か説明せよ。","生殖細胞がつくられるときの特別な細胞分裂。染色体の数がもとの細胞の半分になる。受精によって、受精卵の染色体の数は親の体細胞と同じになる。"]],
r:[["生殖","生物が自分と同じ種類の新しい個体をつくること。"],["無性生殖","受精を行わず、からだの一部から新しい個体ができる生殖。"],["栄養生殖","植物で、からだの一部（いもや茎など）から新しい個体ができる無性生殖。"],["有性生殖","生殖細胞が受精して新しい個体ができる生殖。"],["生殖細胞","生殖のためにつくられる特別な細胞。卵や精子、卵細胞や精細胞。"],["受精","生殖細胞の核どうしが合体すること。"],["胚","受精卵が細胞分裂を始めてから、自分で食物をとり始めるまでの間の子。"],["発生","受精卵が胚になり、からだのつくりが完成していく過程。"],["花粉管","花粉が柱頭についたあと、胚珠に向かってのびる管。"],["減数分裂","生殖細胞がつくられるときの、染色体の数が半分になる細胞分裂。"]]},

{c:"生物",t:"遺伝の規則性",i:[
["遺伝と遺伝子","遺伝・形質・遺伝子とは何か説明せよ。","生物のもつ形や性質を形質といい、親の形質が子や孫に伝わることを遺伝という。形質を伝えるもとになるものを遺伝子といい、細胞の核の染色体にふくまれている。遺伝子の本体はDNA（デオキシリボ核酸）という物質。"],
["顕性形質と潜性形質","顕性形質と潜性形質とは何か。エンドウの種子の形を例に説明せよ。","対立形質をもつ純系どうしをかけ合わせたとき、子に現れる形質が顕性形質、現れない形質が潜性形質。丸い種子（AA）としわのある種子（aa）をかけ合わせると、子はすべてAaになり、すべて丸い種子（顕性）になる。"],
["分離の法則","分離の法則とは何か説明せよ。","減数分裂のとき、対になっている遺伝子が分かれて、別々の生殖細胞に入ること。メンデルが発見した。"],
["孫の代の分離比","Aaの子どうしをかけ合わせたときの、孫の代の遺伝子の組み合わせと形質の比を答えよ。","遺伝子の組み合わせはAA：Aa：aa＝1：2：1。形質は顕性：潜性＝3：1（丸：しわ＝3：1）。"],
["DNAの利用","遺伝子やDNAに関する技術の利用例を答えよ。","遺伝子組換え技術（病気に強い作物、インスリンなど医薬品の製造）、ゲノム編集、DNA鑑定、iPS細胞による再生医療など。"]],
r:[["形質","生物のもつ形や性質の特徴。"],["遺伝","親の形質が子や孫に伝わること。"],["遺伝子","形質を伝えるもとになるもの。染色体にふくまれる。"],["DNA（デオキシリボ核酸）","遺伝子の本体である物質。"],["対立形質","エンドウの丸としわのように、どちらか一方しか現れない形質どうし。"],["純系","親、子、孫と代を重ねても、その形質がすべて親と同じである系統。"],["顕性形質","対立形質の純系どうしをかけ合わせたとき、子に現れる形質。"],["潜性形質","対立形質の純系どうしをかけ合わせたとき、子に現れない形質。"],["分離の法則","減数分裂のとき、対になっている遺伝子が分かれて別々の生殖細胞に入ること。"],["メンデル","エンドウを使って遺伝の規則性を発見した人物。"]]},

{c:"生物",t:"生物の進化",i:[
["進化","進化とは何か。セキツイ動物の出現の順序とあわせて説明せよ。","生物が長い年月をかけて世代を重ねる間に変化すること。セキツイ動物は、魚類→両生類→ハチュウ類→哺乳類・鳥類の順に出現したと考えられる。水中から陸上の生活に適したからだに変化していった。"],
["相同器官","相同器官とは何か。例とあわせて説明せよ。","形やはたらきはちがっていても、もとは同じ器官であったと考えられるもの。ヒトのうで、クジラの胸びれ、コウモリのつばさ、鳥のつばさなど。骨格の基本的なつくりが似ている。進化の証拠となる。"],
["始祖鳥","始祖鳥の特徴と、進化の上での意味を説明せよ。","羽毛やつばさをもつ（鳥類の特徴）一方、口に歯があり、つばさの先につめがあり、長い尾に骨がある（ハチュウ類の特徴）。鳥類がハチュウ類から進化したことを示す証拠と考えられる。"]],
r:[["進化","生物が長い年月をかけて、世代を重ねる間に変化すること。"],["相同器官","形やはたらきはちがっても、もとは同じ器官であったと考えられるもの。"],["始祖鳥","ハチュウ類と鳥類の両方の特徴をもつ古生物。"]]},

{c:"生物",t:"食物連鎖と生態系",i:[
["食物連鎖と食物網","食物連鎖と食物網とは何か説明せよ。","生物どうしの「食べる・食べられる」という関係の一連のつながりが食物連鎖。実際には多くの生物の間で網の目のように複雑にからみ合っており、これを食物網という。"],
["生産者・消費者","生産者と消費者とは何か説明せよ。","生産者は光合成によって無機物から有機物をつくり出す生物（植物、植物プランクトン）。消費者は生産者がつくった有機物を直接または間接に食べて取り入れる生物（動物）。"],
["数量のつり合い","生態系の生物の数量関係と、つり合いがくずれたときの変化を説明せよ。","ふつう、食べられる生物の数量の方が多く、生産者を底辺としたピラミッド形になる。草食動物が一時的に増えると、植物は減り肉食動物は増える。その後、草食動物は食物不足と肉食動物に食べられることで減り、やがてもとのつり合いにもどる。"],
["分解者","分解者とは何か。例とあわせて説明せよ。","生物の死がいやふんなどの有機物を、二酸化炭素や水などの無機物に分解する生物。菌類（カビ、キノコ）や細菌類（乳酸菌、大腸菌）、土の中の小動物（ミミズ、ダンゴムシ）など。分解者も消費者の一部。"],
["分解者のはたらきの実験","土の中の微生物のはたらきを調べる実験を説明せよ。","土の上ずみ液にデンプン溶液を加えて数日置き、ヨウ素液を加えても変化しない（デンプンが分解された）。上ずみ液を沸騰させたものでは青紫色になる（微生物が死んでデンプンが分解されない）。"]],
r:[["食物連鎖","生物どうしの「食べる・食べられる」の関係の一連のつながり。"],["食物網","食物連鎖が網の目のように複雑にからみ合っている関係。"],["生態系","ある地域にすむ生物と、それをとりまく環境をひとつのまとまりとしてとらえたもの。"],["生産者","光合成によって無機物から有機物をつくり出す生物。"],["消費者","ほかの生物を食べて有機物を取り入れる生物。"],["分解者","死がいやふんなどの有機物を無機物に分解する生物。"],["菌類","カビやキノコのなかま。"],["細菌類","乳酸菌や大腸菌など、単細胞の微生物。"]]},

{c:"生物",t:"物質の循環と自然環境",i:[
["炭素の循環","自然界での炭素の循環を説明せよ。","大気中の二酸化炭素は、生産者の光合成で有機物に取りこまれ、食物連鎖を通して消費者に移る。生物の呼吸や分解者のはたらき、化石燃料の燃焼で二酸化炭素として大気中にもどる。酸素は光合成で出され、呼吸で使われる。"],
["地球温暖化","地球温暖化とは何か。原因とあわせて説明せよ。","地球の平均気温が上昇すること。化石燃料の大量消費や森林の減少で、大気中の二酸化炭素などの温室効果ガスが増え、地表から出る熱が宇宙へ逃げにくくなったことが原因と考えられる。海面の上昇や異常気象などの影響がある。"],
["外来種","外来種とは何か。問題点と例を説明せよ。","人間の活動によって、本来生息していなかった地域に持ちこまれ、定着した生物。在来種を食べたり、すみかをうばったりして生態系のつり合いをくずす。例：オオクチバス（ブラックバス）、アライグマ、ウシガエル、セイヨウタンポポ。"],
["環境の保全","自然環境を守る取り組みの例をあげよ。","水質調査（指標生物を使う）、生物多様性の保全、森林の保護、絶滅危惧種の保護（レッドリスト）、再生可能エネルギーの利用、3R（リデュース・リユース・リサイクル）など。"],
["水質の調査","川の水質を調べる指標生物とは何か。例とあわせて説明せよ。","すむ生物の種類によって水のよごれの程度がわかる生物。きれいな水：カワゲラ、サワガニ、ヒラタカゲロウ。ややきれいな水：カワニナ、ゲンジボタル。きたない水：タニシ、ミズカマキリ。とてもきたない水：アメリカザリガニ、セスジユスリカ。"]],
r:[["地球温暖化","二酸化炭素などの温室効果ガスが増えて、地球の平均気温が上昇すること。"],["温室効果ガス","二酸化炭素やメタンなど、地表から出る熱を吸収して地球をあたためる気体。"],["外来種（外来生物）","人間の活動によって、本来の生息地以外から持ちこまれて定着した生物。"],["在来種","その地域にもとから生息している生物。"],["指標生物","すんでいる生物の種類から、水のよごれの程度などの環境を知る手がかりとなる生物。"]]}
);

T.push(
{c:"地学",t:"火山とマグマ",i:[
["マグマと噴火","マグマとは何か。火山が噴火するしくみとあわせて説明せよ。","地下の岩石がとけたもの。マグマが上昇し、ふくまれていた水蒸気などの気体が発泡して圧力が高まり、地表にふき出すことで噴火が起こる。"],
["火山噴出物","火山噴出物にはどのようなものがあるか答えよ。","溶岩（マグマが地表に流れ出たもの、冷え固まったものも）、火山弾、軽石、火山れき、火山灰、火山ガス（大部分は水蒸気）。"],
["マグマのねばりけと火山の形","マグマのねばりけと、火山の形・噴火のようす・溶岩の色の関係を説明せよ。","ねばりけが強い：ドーム状（例：昭和新山、雲仙普賢岳）。激しく爆発的な噴火で、溶岩や火山灰は白っぽい。中間：円すい形（成層火山、例：富士山、桜島）。ねばりけが弱い：たて状（傾斜がゆるやか、例：マウナロア）。おだやかに溶岩を流し出す噴火で、溶岩は黒っぽい。"],
["鉱物","火山灰にふくまれる鉱物の種類と特徴を答えよ。","無色鉱物：セキエイ（無色・白色、不規則に割れる）、チョウ石（白色・うすもも色、決まった方向に割れる）。有色鉱物：クロウンモ（黒色、うすくはがれる）、カクセン石（緑黒色、長い柱状）、キ石（緑黒色、短い柱状）、カンラン石（黄緑色）。無色鉱物が多いほど白っぽい。"],
["火山灰の観察","火山灰を観察するときの処理の方法を説明せよ。","火山灰を蒸発皿に入れて水を加え、指でおして洗い、にごった水を捨てる。水がにごらなくなるまでくり返し、乾燥させてから双眼実体顕微鏡やルーペで観察する。"]],
r:[["マグマ","地下の岩石がどろどろにとけたもの。"],["溶岩","マグマが地表に流れ出たもの。また、それが冷え固まったもの。"],["火山噴出物","噴火によって火口から出された溶岩・火山弾・軽石・火山灰・火山ガスなど。"],["鉱物","マグマが冷えてできた結晶の粒。"],["セキエイ","無色・白色で、不規則に割れる無色鉱物。"],["チョウ石","白色・うすもも色で、決まった方向に割れる無色鉱物。"],["クロウンモ","黒色で、うすくはがれる有色鉱物。"]]},

{c:"地学",t:"火成岩",i:[
["火山岩と深成岩","火山岩と深成岩のでき方とつくりのちがいを説明せよ。","火山岩はマグマが地表や地表付近で急に冷え固まってできた。細かい粒やガラス質の石基の中に、大きな結晶の斑晶が散らばる斑状組織。深成岩はマグマが地下深くでゆっくり冷え固まってできた。大きな結晶がすき間なく組み合わさった等粒状組織。"],
["火成岩の種類","火成岩の種類を、色の白っぽいものから順に、火山岩と深成岩に分けて答えよ。","火山岩：流紋岩（白っぽい）→安山岩→玄武岩（黒っぽい）。深成岩：花こう岩（白っぽい）→せん緑岩→斑れい岩（黒っぽい）。白っぽい岩石ほどセキエイ・チョウ石などの無色鉱物を多くふくむ。"],
["結晶の大きさとでき方","ミョウバンの結晶をつくる実験で、急に冷やしたときとゆっくり冷やしたときのちがいを、火成岩のつくりと関連づけて説明せよ。","急に冷やすと小さな結晶が多くでき、ゆっくり冷やすと大きな結晶ができる。火山岩の石基はマグマが急に冷えたため結晶になれなかった部分、深成岩はゆっくり冷えたので大きな結晶になった。"]],
r:[["火成岩","マグマが冷え固まってできた岩石。"],["火山岩","マグマが地表や地表付近で急に冷え固まってできた火成岩。"],["深成岩","マグマが地下深くでゆっくり冷え固まってできた火成岩。"],["斑状組織","石基の中に斑晶が散らばっている、火山岩のつくり。"],["等粒状組織","大きな結晶がすき間なく組み合わさった、深成岩のつくり。"],["石基","火山岩で、細かい粒やガラス質の部分。"],["斑晶","火山岩で、石基の中に散らばる大きな結晶。"],["花こう岩","白っぽい深成岩。セキエイやチョウ石を多くふくむ。"],["玄武岩","黒っぽい火山岩。"]]},

{c:"地学",t:"地震のゆれ",i:[
["震源と震央","震源と震央とは何か説明せよ。","地下で地震が発生した場所が震源、震源の真上の地表の地点が震央。震源から観測地点までの距離を震源距離という。"],
["初期微動と主要動","初期微動と主要動とは何か。P波・S波とあわせて説明せよ。","はじめの小さなゆれが初期微動で、速く伝わるP波（約6〜8km/s）によるもの。あとから来る大きなゆれが主要動で、おそく伝わるS波（約3〜4km/s）によるもの。P波とS波は震源で同時に発生する。"],
["初期微動継続時間","初期微動継続時間とは何か。震源からの距離との関係を説明せよ。","P波が到着してからS波が到着するまでの時間（初期微動が続く時間）。震源からの距離に比例して長くなる。これを利用して震源までの距離を推定できる。"],
["震度とマグニチュード","震度とマグニチュードのちがいを説明せよ。","震度はある地点でのゆれの大きさで、0〜7の10段階（5と6は強・弱）。ふつう震央から遠いほど小さくなるが、地盤のようすでも変わる。マグニチュード（M）は地震そのものの規模（エネルギーの大きさ）。1大きくなるとエネルギーは約32倍、2大きくなると1000倍。"],
["緊急地震速報","緊急地震速報のしくみを説明せよ。","震源に近い地震計でP波を観測し、震源の位置や規模を計算して、S波が届く前に大きなゆれが来ることを知らせるしくみ。P波とS波の伝わる速さのちがいを利用している。"]],
r:[["震源","地下で地震が発生した場所。"],["震央","震源の真上の地表の地点。"],["初期微動","地震のはじめの小さなゆれ。P波によるゆれ。"],["主要動","初期微動のあとに続く大きなゆれ。S波によるゆれ。"],["P波","速く伝わり、初期微動を起こす地震の波。"],["S波","おそく伝わり、主要動を起こす地震の波。"],["初期微動継続時間","P波が到着してからS波が到着するまでの時間。"],["震度","ある地点での地震のゆれの大きさ。10段階で表す。"],["マグニチュード","地震の規模（エネルギーの大きさ）を表す値。"],["緊急地震速報","P波を観測して、大きなゆれが来ることを事前に知らせるしくみ。"]]},

{c:"地学",t:"地震の起こるしくみと大地の変動",i:[
["プレート","プレートとは何か。日本列島付近のプレートを答えよ。","地球の表面をおおう、厚さ100kmほどの岩盤。日本列島付近には、陸のプレート（北アメリカプレート、ユーラシアプレート）と海のプレート（太平洋プレート、フィリピン海プレート）がある。"],
["海溝型地震","海溝型地震が起こるしくみを説明せよ。","海のプレートが陸のプレートの下に沈みこむとき、陸のプレートの先端が引きずりこまれてひずみがたまり、それが限界になると陸のプレートが急激にはね上がって地震が起こる。津波を伴うことがある。震源は太平洋側で浅く、大陸側に向かって深くなる。"],
["内陸型地震と断層","内陸型地震と断層の関係を説明せよ。","プレートの動きで大地に大きな力が加わり、岩盤が破壊されてずれ（断層）が生じると地震が起こる。くり返しずれ動いた証拠があり、今後も動く可能性がある断層を活断層という。震源が浅いので、規模が小さくても大きな被害が出ることがある。"],
["大地の変動","地震に伴う大地の変動と、地形の例を説明せよ。","大地がもち上がる隆起と、沈む沈降が起こる。隆起によって海岸段丘や河岸段丘ができ、沈降によってリアス海岸ができる。地層に力が加わって曲がったものをしゅう曲という。"],
["地震による災害","地震によって起こる災害の例を答えよ。","建物の倒壊、土砂くずれ、液状化現象（埋め立て地などで地面が液体のようになる）、津波、火災など。"]],
r:[["プレート","地球の表面をおおう、厚さ100kmほどの岩盤。"],["海溝","海のプレートが陸のプレートの下に沈みこむところにできる、深い溝。"],["断層","大地に大きな力が加わり、地層や岩盤がずれたもの。"],["活断層","くり返しずれ動いた証拠があり、今後も動く可能性がある断層。"],["隆起","大地がもち上がること。"],["沈降","大地が沈むこと。"],["しゅう曲","地層に大きな力が加わって、波打つように曲がったもの。"],["液状化現象","地震のゆれで、埋め立て地などの地面が液体のようになる現象。"],["津波","海底の地形が急に変化することで起こる、高い波。"]]},

{c:"地学",t:"地層のでき方",i:[
["風化・侵食・運搬・堆積","風化・侵食・運搬・堆積とは何か説明せよ。","風化：気温の変化や水のはたらきなどで、岩石がもろくなること。侵食：流水などが岩石をけずるはたらき。運搬：流水が土砂を運ぶはたらき。堆積：流れがゆるやかな所で、運ばれた土砂が積もるはたらき。"],
["粒の大きさと堆積場所","れき・砂・泥の区別と、海で堆積する場所のちがいを説明せよ。","粒の大きさで、れき（2mm以上）、砂（2〜1/16mm）、泥（1/16mm以下）に分ける。粒が大きいものほど早く沈むので、れきは河口付近、砂はその沖、泥は河口から遠い沖合に堆積する。"],
["地層の重なり","地層の重なり方からわかることを説明せよ。","ふつう、下の層ほど古く、上の層ほど新しい。下かられき→砂→泥と粒が小さくなっていれば、その場所の水の深さがしだいに深くなった（海面が上昇した、または土地が沈降した）と考えられる。"],
["柱状図とかぎ層","柱状図とかぎ層を使って、離れた地点の地層を比べる方法を説明せよ。","柱状図は地層の重なりを柱状に表した図。火山灰の層は、同じ時期に広い範囲に堆積するので、離れた地点の地層を比べる目印（かぎ層）になる。標高を考えて、かぎ層の高さを比べると、地層の傾きがわかる。"],
["不整合","不整合とは何か。でき方を説明せよ。","上下の地層の重なり方が不連続になっていること。水中で堆積した地層が隆起して陸上で侵食され、再び沈降して水中で新しい地層が堆積するとできる。境目の上にれきがあることが多い。"]],
r:[["風化","気温の変化や水のはたらきで、岩石がもろくなること。"],["侵食","流水などが岩石をけずるはたらき。"],["運搬","流水が土砂を運ぶはたらき。"],["堆積","運ばれた土砂が、流れがゆるやかな所に積もるはたらき。"],["地層","れき・砂・泥や火山灰などが積み重なってできた層。"],["柱状図","地層の重なりを柱のように表した図。"],["かぎ層","火山灰の層など、離れた地点の地層を比べるときの目印になる層。"],["露頭","地層や岩石が地表に現れている所。"],["不整合","上下の地層が不連続に重なっていること。"]]},

{c:"地学",t:"堆積岩と化石",i:[
["堆積岩","堆積岩とは何か。粒の形の特徴とあわせて説明せよ。","堆積物が長い年月をかけて押し固められてできた岩石。流水で運ばれるうちに角がけずられるので、れき岩・砂岩・泥岩の粒は丸みを帯びている。火成岩の粒は角ばっている。"],
["堆積岩の種類","堆積岩の種類と、それぞれをつくる堆積物を答えよ。","れき岩（れき）、砂岩（砂）、泥岩（泥）：粒の大きさで区別。石灰岩（生物の殻や骨、炭酸カルシウム）、チャート（生物の殻、二酸化ケイ素）、凝灰岩（火山灰などの火山噴出物。粒は角ばっている）。"],
["石灰岩とチャートの見分け方","石灰岩とチャートを見分ける方法を2つ答えよ。","①うすい塩酸をかけると、石灰岩は二酸化炭素を発生してとけるが、チャートは反応しない。②くぎでひっかくと、石灰岩は傷がつくが、チャートは非常にかたく傷がつかない（鉄のハンマーでたたくと火花が出る）。"],
["示相化石","示相化石とは何か。例とあわせて説明せよ。","地層が堆積した当時の環境を知ることができる化石。限られた環境でしか生活できない生物の化石が適している。サンゴ：あたたかくて浅い海。シジミ：河口や湖（淡水と海水が混じる所）。アサリ・ハマグリ：浅い海。ブナ：やや寒冷な気候の陸地。"],
["示準化石と地質年代","示準化石とは何か。地質年代とあわせて例を答えよ。","地層が堆積した年代（地質年代）を知ることができる化石。広い範囲に生息し、短い期間だけ栄えた生物の化石が適している。古生代：サンヨウチュウ、フズリナ。中生代：アンモナイト、恐竜。新生代：ビカリア、ナウマンゾウ、マンモス。"]],
r:[["堆積岩","堆積物が押し固められてできた岩石。"],["石灰岩","生物の殻などからでき、うすい塩酸をかけると二酸化炭素が発生する堆積岩。"],["チャート","生物の殻などからでき、非常にかたく、うすい塩酸をかけても気体が発生しない堆積岩。"],["凝灰岩","火山灰などの火山噴出物が堆積して固まった岩石。"],["化石","地層の中に残された、昔の生物の死がいや生活のあと。"],["示相化石","地層が堆積した当時の環境を知る手がかりになる化石。"],["示準化石","地層が堆積した年代を知る手がかりになる化石。"],["地質年代","化石などをもとに区分した地球の歴史の時代区分。"]]},

{c:"地学",t:"気象観測",i:[
["気象要素","気象要素にはどのようなものがあるか。おもな測り方とあわせて説明せよ。","気温・湿度・気圧・風向・風力・雲量・天気・降水量など。気温は地上約1.5mの高さで、直射日光を当てずに風通しのよい所で測る。湿度は乾湿計で、乾球と湿球の示度の差から湿度表を使って求める。気圧はアネロイド気圧計で測る。"],
["天気の決め方","雲量と天気の関係を答えよ。","空全体を10としたときの雲がおおっている割合を雲量という。雲量0〜1は快晴、2〜8は晴れ、9〜10はくもり（雨や雪が降っていればそれが天気）。"],
["天気図記号","天気図記号で、風向・風力・天気の表し方を説明せよ。","○の中の記号で天気を表す（快晴は○、晴れは①のような縦線、くもりは◎）。矢ばねの向きで風向（風がふいてくる方向）、羽根の数で風力（0〜12）を表す。"],
["晴れの日の気温と湿度","晴れた日の気温と湿度の1日の変化を説明せよ。","気温は日の出前が最も低く、午後2時ごろ最も高くなる。湿度は気温と逆の変化をする（気温が上がると飽和水蒸気量が大きくなるため湿度は下がる）。くもりや雨の日は気温・湿度の変化が小さく、湿度は高い。"]],
r:[["気象要素","気温・湿度・気圧・風向・風力・雲量など、大気の状態を表すもの。"],["雲量","空全体を10としたとき、雲がおおっている割合。"],["乾湿計","乾球温度計と湿球温度計の示す温度の差から湿度を求める器具。"],["風向","風がふいてくる方向。16方位で表す。"]]},

{c:"地学",t:"湿度と雲のでき方",i:[
["飽和水蒸気量","飽和水蒸気量とは何か。気温との関係とあわせて説明せよ。","空気1㎥中にふくむことのできる水蒸気の最大量（g/㎥）。気温が高いほど大きくなる。"],
["露点","露点とは何か。測る方法とあわせて説明せよ。","空気中の水蒸気が冷やされて凝結し、水滴に変わり始める温度。金属製のコップに水を入れ、氷水を少しずつ加えて冷やし、コップの表面がくもり始めたときの水温を測る。露点のとき、空気中の水蒸気量はその温度の飽和水蒸気量と等しい。"],
["湿度","湿度とは何か。求め方を答えよ。","空気のしめりけの度合い。湿度〔％〕＝空気1㎥中にふくまれる水蒸気量〔g/㎥〕÷その気温での飽和水蒸気量〔g/㎥〕×100。"],
["雲のでき方","雲ができるしくみを説明せよ。","空気のかたまりが上昇すると、上空ほど気圧が低いので膨張して温度が下がる。気温が露点より低くなると、水蒸気が凝結して水滴や氷の粒になり、雲ができる。雲粒が大きくなって落ちてくると雨や雪になる。"],
["上昇気流が起こる場合","空気のかたまりが上昇するのはどのような場合か答えよ。","①地面が強くあたためられたとき。②空気が山の斜面に沿ってのぼるとき。③あたたかい空気と冷たい空気がぶつかったとき（前線）。④低気圧の中心付近で空気が集まるとき。"],
["水の循環","地球上の水の循環を説明せよ。","海や陸地の水は太陽のエネルギーによって蒸発し、上空で雲になる。雨や雪となって地上に降り、川や地下水となって海にもどる。水の循環のもとになるエネルギーは太陽のエネルギー。"]],
r:[["飽和水蒸気量","空気1㎥中にふくむことのできる水蒸気の最大量。"],["露点","空気中の水蒸気が凝結して、水滴に変わり始める温度。"],["凝結","気体の水蒸気が液体の水滴に変わること。"],["湿度","空気のしめりけの度合い。水蒸気量÷飽和水蒸気量×100で求める。"],["上昇気流","上に向かう空気の流れ。"],["下降気流","下に向かう空気の流れ。"]]},

{c:"地学",t:"気圧と風",i:[
["等圧線","等圧線とは何か。読み方を説明せよ。","気圧が等しい地点を結んだ曲線。1000hPaを基準に4hPaごとに細線、20hPaごとに太線で引く。等圧線の間隔がせまいほど風が強い。"],
["風のふき方","風はどのようにふくか説明せよ。","気圧の高い所から低い所へ向かってふく。等圧線に垂直な方向から少しずれた向きにふく。"],
["高気圧","高気圧とは何か。風のふき方と天気を説明せよ。","まわりより気圧が高い所。北半球では、中心から時計回りに風がふき出す。中心付近では下降気流が生じ、雲ができにくく晴れることが多い。"],
["低気圧","低気圧とは何か。風のふき方と天気を説明せよ。","まわりより気圧が低い所。北半球では、反時計回りに中心に向かって風がふきこむ。中心付近では上昇気流が生じ、雲ができやすく、くもりや雨になることが多い。"],
["海陸風","海風と陸風のしくみを説明せよ。","陸は海よりあたたまりやすく冷めやすい。昼は陸の方が高温になり、陸上で上昇気流が生じて気圧が下がるので、海から陸へ海風がふく。夜は海の方が高温になるので、陸から海へ陸風がふく。朝と夕方に風がやむことを凪という。"]],
r:[["等圧線","気圧が等しい地点を結んだ曲線。"],["高気圧","まわりより気圧が高い所。下降気流が生じ、晴れやすい。"],["低気圧","まわりより気圧が低い所。上昇気流が生じ、くもりや雨になりやすい。"],["海風","昼に海から陸に向かってふく風。"],["陸風","夜に陸から海に向かってふく風。"],["ヘクトパスカル（hPa）","気圧の単位。1hPaは100Pa。"]]},

{c:"地学",t:"前線と天気の変化",i:[
["気団と前線","気団と前線とは何か説明せよ。","気温や湿度がほぼ一様な大きな空気のかたまりが気団。性質のちがう気団が接すると、すぐには混じり合わず境界面（前線面）ができ、前線面が地表と接する所が前線。"],
["寒冷前線","寒冷前線のでき方と、通過するときの天気の変化を説明せよ。","寒気が暖気の下にもぐりこみ、暖気を急激におし上げながら進む前線。積乱雲が発達し、せまい範囲に強い雨が短時間降り、雷や突風を伴うこともある。通過後は風が北寄りに変わり、気温が急に下がる。"],
["温暖前線","温暖前線のでき方と、通過するときの天気の変化を説明せよ。","暖気が寒気の上にはい上がり、寒気をおしやりながら進む前線。乱層雲などが広がり、広い範囲に長い時間おだやかな雨が降る。通過後は風が南寄りに変わり、気温が上がる。"],
["停滞前線と閉そく前線","停滞前線と閉そく前線について説明せよ。","停滞前線：寒気と暖気の勢力がほぼ同じで、ほとんど動かない前線。梅雨前線や秋雨前線（くもりや雨の日が続く）。閉そく前線：寒冷前線が温暖前線に追いついてできる前線。"],
["温帯低気圧","温帯低気圧と天気の移り変わりを説明せよ。","日本付近の低気圧は、南東側に温暖前線、南西側に寒冷前線をともなうことが多い（温帯低気圧）。上空の偏西風の影響で西から東へ移動するので、日本の天気は西から東へ変わることが多い。"]],
r:[["気団","気温や湿度がほぼ一様な、大きな空気のかたまり。"],["前線","性質のちがう気団の境界面が地表と接する所。"],["寒冷前線","寒気が暖気の下にもぐりこみ、暖気をおし上げながら進む前線。"],["温暖前線","暖気が寒気の上にはい上がり、寒気をおしやりながら進む前線。"],["停滞前線","寒気と暖気の勢力がほぼ同じで、ほとんど動かない前線。"],["閉そく前線","寒冷前線が温暖前線に追いついてできる前線。"],["積乱雲","強い上昇気流でできる、垂直に発達した雲。強い雨や雷をもたらす。"],["乱層雲","温暖前線付近にできる、広い範囲をおおう雲。おだやかな雨を長く降らせる。"],["偏西風","日本付近の上空を、西から東へ1年中ふく強い風。"],["温帯低気圧","中緯度で発生し、温暖前線と寒冷前線をともなうことが多い低気圧。"]]},

{c:"地学",t:"日本の天気と季節",i:[
["日本付近の気団","日本の天気に影響する3つの気団と、その性質を答えよ。","シベリア気団（冬、大陸上で発達、冷たく乾燥）、小笠原気団（夏、太平洋上で発達、あたたかく湿っている）、オホーツク海気団（つゆ・初夏、冷たく湿っている）。"],
["冬の天気","冬の天気の特徴を、気圧配置と季節風を使って説明せよ。","西高東低の気圧配置（大陸にシベリア高気圧、日本の東に低気圧）で、等圧線が南北に並ぶ。北西の季節風がふく。季節風は日本海の上で水蒸気をふくみ、日本海側に大雪を降らせ、山脈をこえた太平洋側では乾燥した晴れの日が続く。"],
["夏の天気","夏の天気の特徴を説明せよ。","南高北低の気圧配置で、太平洋高気圧（小笠原気団）におおわれ、南東の季節風がふき、蒸し暑い日が続く。強い日射で積乱雲が発達し、夕立が降ることがある。"],
["つゆと秋雨","つゆ（梅雨）と秋雨の天気を説明せよ。","オホーツク海気団と小笠原気団の勢力がほぼつり合い、停滞前線（梅雨前線）ができて、くもりや雨の日が続く。夏の終わりにも同じように秋雨前線ができる。"],
["春と秋の天気","春と秋の天気の特徴を説明せよ。","偏西風の影響で、移動性高気圧と低気圧が交互に西から東へ通過し、天気が周期的に変わる。"],
["台風","台風とは何か。特徴を説明せよ。","熱帯地方の海上で発生した熱帯低気圧のうち、最大風速が約17m/s以上になったもの。前線をともなわず、等圧線が同心円状で間隔がせまい。中心に向かって反時計回りに強い風がふきこむ。夏から秋に、太平洋高気圧のふちに沿って北上し、偏西風によって東寄りに進路を変える。"],
["季節風","季節風とは何か。ふくしくみとあわせて説明せよ。","季節によってふく向きが変わる風。陸と海のあたたまり方のちがいで生じる。冬は大陸が冷えて高気圧ができ、大陸から海洋へ北西の風、夏は大陸があたたまって低気圧ができ、海洋から大陸へ南東の風がふく。"]],
r:[["シベリア気団","冬に大陸上で発達する、冷たく乾燥した気団。"],["小笠原気団","夏に太平洋上で発達する、あたたかく湿った気団。"],["オホーツク海気団","つゆのころに発達する、冷たく湿った気団。"],["西高東低","冬に多い、日本の西に高気圧、東に低気圧がある気圧配置。"],["季節風","季節によってふく向きが変わる風。"],["梅雨前線","つゆの時期に、日本付近に長くとどまる停滞前線。"],["移動性高気圧","春や秋に、西から東へ移動していく高気圧。"],["台風","熱帯低気圧のうち、最大風速が約17m/s以上になったもの。"]]},

{c:"地学",t:"太陽の日周運動",i:[
["天球","天球とは何か説明せよ。","観測者を中心とした、空を大きな球の内面と考えたもの。天頂は観測者の真上の点。天体の位置は方位と高度で表す。"],
["日周運動","太陽の日周運動とは何か。原因とあわせて説明せよ。","太陽が東の地平線からのぼり、南の空を通って西の地平線にしずむ、1日の見かけの動き。地球が地軸を中心に西から東へ1日1回自転しているために起こる。"],
["透明半球での観測","透明半球で太陽の動きを記録する方法と、わかることを説明せよ。","サインペンの先のかげが透明半球の中心（観測者の位置）にくるように点を記録する。点の間隔は等しく、太陽が一定の速さで動いていることがわかる。1時間あたりの間隔から、日の出・日の入りの時刻を求められる。太陽は1時間に15°動く。"],
["南中と南中高度","南中と南中高度とは何か説明せよ。","太陽が真南にくることを南中、そのときの高度を南中高度という。太陽の高度が1日で最も高くなる。"]],
r:[["天球","観測者を中心とした、空を大きな球の内面と考えたもの。"],["天頂","天球上で、観測者の真上の点。"],["日周運動","地球の自転による、天体の1日の見かけの動き。"],["自転","地球が地軸を中心に、西から東へ1日1回転すること。"],["南中","天体が真南にくること。"],["南中高度","天体が南中したときの高度。"]]},

{c:"地学",t:"星の日周運動と年周運動",i:[
["星の日周運動","星の日周運動を、東西南北の空での動きに分けて説明せよ。","東の空：右ななめ上にのぼる。南の空：東から西へ弧をえがく。西の空：右ななめ下にしずむ。北の空：北極星を中心に反時計回りに回転する。1時間に約15°動く（24時間で360°）。"],
["北極星","北極星がほとんど動かない理由を説明せよ。","北極星が地軸を北に延長した方向の近くにあるため。北極星の高度は観測地点の緯度とほぼ等しい。"],
["年周運動","星の年周運動とは何か。原因とあわせて説明せよ。","同じ時刻に見える星座の位置が、1か月に約30°ずつ東から西へ移っていく見かけの動き。地球が太陽のまわりを1年かけて公転しているために起こる（360°÷12か月＝30°）。同じ位置に見える時刻は1か月に約2時間ずつ早くなる。"],
["季節と星座","季節によって見える星座が変わる理由と、真夜中に南の空に見える星座の考え方を説明せよ。","地球の公転によって、夜（太陽と反対側）に見える方向が変わるため。太陽と反対の方向にある星座が真夜中に南の空に見える。太陽と同じ方向にある星座は見えない。"],
["黄道","黄道とは何か説明せよ。","天球上の太陽の見かけの通り道。地球の公転によって、太陽は星座の間を1年かけて西から東へ移動していくように見える。黄道上にある12の星座を黄道12星座という。"]],

function pickVoice(){if(!TTS)return;const v=speechSynthesis.getVoices().filter(x=>/^ja/i.test(x.lang));jaVoice=v.find(x=>/Kyoko|O-ren|Google|Nanami/i.test(x.name))||v[0]||null;}

function readable(s){return s.replace(/→/g,"、").replace(/〜/g,"から").replace(/＋/g,"と").replace(/[（(]/g,"、").replace(/[）)]/g,"、").replace(/・/g,"、").replace(/[①-⑩]/g,m=>(NUM.indexOf(m)+1)+"、").replace(/○/g,"まる").replace(/×/g,"ばつ").replace(/△/g,"さんかく").replace(/「|」|『|』/g,"");}

function ttsStop(){ttsTok++;if(TTS)speechSynthesis.cancel();document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));document.querySelectorAll(".sbtn[aria-pressed='true'],.mini[aria-pressed='true']").forEach(b=>{b.setAttribute("aria-pressed","false");if(b.dataset.label)b.textContent=b.dataset.label;});}
/* parts: [{text, el}] を順番に読む。読み終えたら done() */
function ttsPlay(parts,btn,done){
  ttsStop();if(!TTS)return;const tok=ttsTok;
  if(btn){btn.setAttribute("aria-pressed","true");btn.dataset.label=btn.dataset.label||btn.textContent;btn.textContent=btn.classList.contains("mini")?"■":"■ 停止";}
  const lines=[];parts.forEach(p=>chunks(p.text).forEach(t=>lines.push({t,el:p.el})));
  let i=0;
  const next=()=>{
    if(tok!==ttsTok)return;
    document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));
    if(i>=lines.length){ttsStop();done&&done();return;}

}

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const KEYTERMS=[...new Set(REV.flatMap(r=>{const t=r[1];const out=[t.replace(/[（(].*?[）)]/g,"")];(t.match(/[（(](.*?)[）)]/g)||[]).forEach(m=>out.push(m.slice(1,-1)));return out.flatMap(s=>s.includes("・")?[s,...s.split("・")]:[s]);}))].filter(s=>s.length>=2).sort((a,b)=>b.length-a.length);
const KEYEXTRA={};
const KW_RX=new RegExp(KEYTERMS.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g");
const YR_RX=/\d+(?:\.\d+)?(?:[：:]\d+(?:\.\d+)?)+|\d+(?:\.\d+)?(?:km\/s|m\/s|cm\/s|km\/h|g\/㎤|g\/㎥|hPa|Pa|kWh|Wh|mA|km|cm|mm|kg|㎤|㎡|Hz|℃|°|％|%|Ω|V|A|W|J|N|g|m|倍|秒|分|時間|日|年|か月|万|億|兆)/g;
/* 答えの重要語に印をつける（数値は赤、用語はマーカー） */
function fmt(text,key){
  const marks=[];
  const add=(rx,cls)=>{rx.lastIndex=0;let m;while((m=rx.exec(text))){if(!m[0])break;marks.push([m.index,m.index+m[0].length,cls]);}};
  (KEYEXTRA[key]||[]).forEach(p=>{let i=-1;while((i=text.indexOf(p,i+1))>=0)marks.push([i,i+p.length,"kw"]);});
  add(YR_RX,"yr");add(KW_RX,"kw");
  marks.sort((a,b)=>a[0]-b[0]||(b[1]-b[0])-(a[1]-a[0]));
  let out="",pos=0;
  for(const [s,e,c] of marks){if(s<pos)continue;out+=esc(text.slice(pos,s))+`<b class="${c}">${esc(text.slice(s,e))}</b>`;pos=e;}
  return out+esc(text.slice(pos));
}

function addDays(s,n){const [y,m,d]=s.split("-").map(Number);return ymd(new Date(y,m-1,d+n));}

function topbar(){return `<div class="nav"><button class="btn ghost" id="back">← ${SES&&Object.keys(SES.res).length?"終了":"一覧"}</button><span class="sub" style="align-self:center">${pos+1} / ${queue.length}</span></div><div class="pbar"><i style="width:${(pos/queue.length*100).toFixed(1)}%"></i></div>`;}
function head(c){return `<div class="qno"><span class="tag t-${c.q.c}">${c.q.c}</span><span>${c.q.u===c.q.t?"":esc(c.q.u)+"・"}${esc(c.q.t)}（${c.k+1}/${c.q.i.length}）</span></div>`;}

/* 一問一答の入力を判定（カタカナ・ひらがな、かっこ内の別名も可） */
function judge(c,guess){
  if(!guess||!guess.trim())return null;
  const term=c.q.i[c.k][0],g=norm(guess);
  const cands=[term,term.replace(/[（(].*?[）)]/g,"")];(term.match(/[（(](.*?)[）)]/g)||[]).forEach(m=>cands.push(m.slice(1,-1)));
  return cands.some(x=>norm(x)===g);
}

function question(){
  ttsStop();scr="q";
  const c=queue[pos];const pr=qPrompt(c);
  app.innerHTML=`${topbar()}
  <div class="sheet">
    ${head(c)}
    <div class="qtext" id="qtext">${esc(pr)}</div>${c.q.rev?`<div class="ask">これを何というか答えよ。</div>`:""}
    ${speakBar("sayQ","問題を読む")}
    ${c.q.rev
      ?`<div><label class="label" for="memo">答えを入力（入力すると自動で判定します。書かなくても可）</label><input id="memo" class="guess" type="text" autocomplete="off" placeholder="用語を入力" value="${esc(S.memo[mkey(c)]||"")}"></div>`
      :`<div><label class="label" for="memo">自分の答え（書かなくても可）</label><textarea id="memo" placeholder="思い出せることを書き出してみよう">${esc(S.memo[mkey(c)]||"")}</textarea></div>`}
  </div>
  <div class="nav"><button class="btn ghost" id="prev" ${pos?"":"disabled"}>← 前の問題</button><button class="btn pen" id="show">答えを見る</button></div>`;
  app.querySelector("#back").onclick=leave;
  const m=app.querySelector("#memo");m.oninput=()=>{S.memo[mkey(c)]=m.value;save();};
  if(c.q.rev)m.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();answer();}};
  app.querySelector("#prev").onclick=()=>{pos--;question();};
  app.querySelector("#show").onclick=answer;
  const sq=app.querySelector("#sayQ");
  if(sq){sq.onclick=toggle(sq,()=>ttsPlay([{text:sayQ(c),el:app.querySelector("#qtext")}],sq));bindRate();}
  window.scrollTo(0,0);
}

function grade(c,v){
  const before=gradeOf(c);setGrade(c,v);
  if(gradeOf(c)){if(!before)logOne();if(SES)SES.res[rkey(c)]=v;}else if(SES)delete SES.res[rkey(c)];
  save();
}
function goNext(){if(pos<queue.length-1){pos++;question();}else leave();}

function answer(){
  ttsStop();scr="a";
  const c=queue[pos];const memo=S.memo[mkey(c)];
  const ok=c.q.rev?judge(c,memo):null;
  if(ok===true&&gradeOf(c)!=="o")grade(c,"o");
  app.innerHTML=`${topbar()}
  <div class="sheet">
    ${head(c)}
    <div class="qtext" style="font-size:1rem;color:var(--muted)">${esc(qPrompt(c))}</div>
    ${memo?`<div><div class="label">あなたの答え</div><div class="memo">${esc(memo)}</div>${ok===true?`<div class="verdict ok">正解！ ○をつけました</div>`:ok===false?`<div class="verdict ng">答えとちがうようです。書き方のちがいだけなら○をつけてください</div>`:""}</div>`:""}
    <div class="ans">${ansHTML(c).replace("__ID__","it")}</div>
    ${c.q.rev?"":`<div class="legend"><b class="kw">マーカー</b>は重要語、<b class="yr">赤字</b>は数値や比。これが書けていれば○の目安です。</div>`}
    ${speakBar("sayA","答えを読む")}
    <div class="label">自己採点：○（書けた）△（一部）×（書けなかった）</div>
    <div class="grade" role="group" aria-label="自己採点">${["o","t","x"].map((v,i)=>`<button class="g ${v}" data-v="${v}" aria-pressed="${gradeOf(c)===v}">${MARK[v]}<small>${i+1}</small></button>`).join("")}</div>
    <div class="sub" id="nextrv">${nextLabel(c)}</div>
    <label class="auto"><input type="checkbox" id="auto" ${S.auto?"checked":""}> 採点したら自動で次の問題へ</label>
  </div>
  <div class="nav"><button class="btn ghost" id="again">問題にもどる</button><button class="btn" id="next">${pos<queue.length-1?"次の問題 →":"結果を見る"}</button></div>`;
  app.querySelector("#back").onclick=leave;
  let timer=null,pend=false;
  app.querySelectorAll(".g").forEach(b=>b.onclick=()=>{
    clearTimeout(timer);grade(c,b.dataset.v);
    app.querySelectorAll(".g").forEach(x=>x.setAttribute("aria-pressed",gradeOf(c)===x.dataset.v));
    app.querySelector("#nextrv").textContent=nextLabel(c);
    pend=false;
    if(S.auto&&gradeOf(c)){const sa=app.querySelector("#sayA");if(sa&&sa.getAttribute("aria-pressed")==="true"){pend=true;}else{const here=pos;timer=setTimeout(()=>{if(scr==="a"&&pos===here)goNext();},450);}}
  });
  app.querySelector("#auto").onchange=e=>{S.auto=e.target.checked;save();};
  const sa=app.querySelector("#sayA");
  const here=pos;
  if(sa){sa.onclick=()=>{if(sa.getAttribute("aria-pressed")==="true"){ttsStop();if(pend&&scr==="a"&&pos===here)goNext();}else ttsPlay([{text:aText(c),el:app.querySelector("#it")}],sa,()=>{if(pend&&scr==="a"&&pos===here)setTimeout(()=>{if(scr==="a"&&pos===here)goNext();},400);});};bindRate();}
  app.querySelector("#again").onclick=question;
  app.querySelector("#next").onclick=goNext;
  window.scrollTo(0,0);
}

/* ---- 結果画面 ---- */
function result(){
  ttsStop();scr="r";
  const s=SES;const ks=Object.keys(s.res);const cnt={o:0,t:0,x:0};ks.forEach(k=>cnt[s.res[k]]++);
  const miss=s.cards.filter(c=>s.res[rkey(c)]==="x"||s.res[rkey(c)]==="t");
  const rate=pct(cnt.o,ks.length);
  app.innerHTML=`<div class="sheet result">
    <div class="label">${esc(s.label||"結果")}</div>
    <div class="score"><b>${rate}</b><small>%</small><span class="sub">○の割合（採点した${ks.length}問中）</span></div>
    <div class="stats"><span><b>${cnt.o}</b> ○</span><span><b>${cnt.t}</b> △</span><span><b>${cnt.x}</b> ×</span><span><b>${s.cards.length-ks.length}</b> 未採点</span></div>
    <div class="sub">${rate>=90?"すばらしい出来です。この調子で復習を続けましょう。":rate>=60?"よくできています。×と△をもう一度確認しましょう。":"まずは×と△をくり返して、答えの重要語を覚えましょう。"}</div>
    ${miss.length?`<div class="label">もう一度確認したい問題</div><ul class="miss">${miss.map(c=>`<li><span class="mk ${s.res[rkey(c)]}">${MARK[s.res[rkey(c)]]}</span><span>${esc(c.q.rev?c.q.i[c.k][0]:qPrompt(c))}</span></li>`).join("")}</ul>`:""}
    <div class="actions">${miss.length?`<button class="btn pen" id="retry">×と△をもう一度（${miss.length}問）</button>`:""}<button class="btn ghost" id="home">一覧にもどる</button></div>
  </div>`;
  const r=app.querySelector("#retry");if(r)r.onclick=()=>start(miss,"×と△のやり直し");

/* ---- 記録の引き継ぎ（コピー＆貼り付け） ---- */
function backupHTML(){return `<details class="backup"><summary>記録の引き継ぎ・バックアップ</summary>
  <div class="bk"><div class="sub">記録はこの端末のブラウザにだけ保存されています。下のコードをコピーしてメモなどに保存しておくと、ほかの端末やブラウザに記録を移せます。</div>
  <div class="actions"><button class="btn ghost" id="bkcopy">記録のコードをコピー</button></div><textarea id="bkout" readonly hidden></textarea>
  <label class="label" for="bkin">コードを貼り付けて読み込む</label><textarea id="bkin" placeholder="RKC1: で始まるコードを貼り付け"></textarea>
  <div class="actions"><button class="btn ghost" id="bkload">読み込む</button></div><div class="sub" id="bkmsg" role="status"></div></div></details>`;}
function bindBackup(){
  const msg=t=>app.querySelector("#bkmsg").textContent=t;
  app.querySelector("#bkcopy").onclick=()=>{
    const data={g:S.g,r:S.r,memo:S.memo,log:S.log,calcStat:S.calcStat};
    const code="RKC1:"+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    const out=app.querySelector("#bkout");out.value=code;out.hidden=false;
    const fallback=()=>{out.focus();out.select();msg("コピーできなかったので、上のコードを選択しました。長押しなどでコピーしてください。");};
    try{navigator.clipboard.writeText(code).then(()=>msg("コピーしました。メモなどに貼り付けて保存してください。"),fallback);}catch(e){fallback();}
  };
  app.querySelector("#bkload").onclick=()=>{
    const v=app.querySelector("#bkin").value.trim();
    let data=null;try{if(!v.startsWith("RKC1:"))throw 0;data=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));}catch(e){msg("コードを読み取れませんでした。RKC1: から最後まで、全部貼り付けてください。");return;}
    const b=app.querySelector("#bkload");
    if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="今の記録を上書きして読み込む";b.classList.add("pen");msg("今の記録はコードの内容に置きかわります。よければもう一度押してください。");return;}
    Object.assign(S,{g:data.g||{},r:data.r||{},memo:data.memo||{},log:data.log||{},calcStat:data.calcStat||S.calcStat});save();home();
  };
}

const SUBD="₀₁₂₃₄₅₆₇₈₉",SUPD="⁰¹²³⁴⁵⁶⁷⁸⁹";
function fsub(f){return f.replace(/([A-Za-z)])(\d+)/g,(m,a,d)=>a+d.split("").map(x=>SUBD[x]).join(""));}
function fion(f){const m=f.match(/^(.*?)(\d?)([+-])$/);if(!m)return fsub(f);return fsub(m[1])+(m[2]?SUPD[m[2]]:"")+(m[3]==="+"?"⁺":"⁻");}
function feq(e){return e.split("→").map(side=>side.split("+").map(t=>{const m=t.match(/^(\d*)(.*)$/);return m[1]+fsub(m[2]);}).join(" ＋ ")).join(" → ");}
function chemNorm(s){return (s||"").normalize("NFKC").replace(/[\s　]/g,"").replace(/[−–—ーｰ‐]/g,"-");}
function eqTerms(side){return side.split("+").filter(Boolean).map(t=>{const m=t.match(/^(\d*)(.+)$/);return (m[1]&&m[1]!=="1"?m[1]:"")+"|"+m[2];}).sort().join(",");}
function eqParse(s){s=chemNorm(s).replace(/->|=>|⟶|⇒|=|＝|>/g,"→");const p=s.split("→");if(p.length!==2||!p[0]||!p[1])return null;return eqTerms(p[0])+">"+eqTerms(p[1]);}
