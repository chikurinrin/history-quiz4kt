["冬の日本海側に雪が多く降る理由として正しいものは？","北西の季節風が日本海の上で水蒸気をふくみ、山脈にぶつかって雲をつくるから",["南東の季節風が太平洋から水蒸気を運ぶから","オホーツク海気団が発達するから","台風が通過するから"],"シベリア気団からの乾いた風が日本海で湿り、日本海側に雪を降らせる。"],
["北の空の星を観察したときの動きとして正しいものは？","北極星を中心に反時計回りに回転する",["北極星を中心に時計回りに回転する","東から西へ直線的に動く","ほとんど動かない"],"地球の自転による日周運動。1時間に約15°動く。"],
["同じ時刻に見えるオリオン座の位置は、1か月後どう変わるか。","約30°西へ移動する",["約30°東へ移動する","約15°西へ移動する","変わらない"],"地球の公転による年周運動。"],
["夏至の日の太陽の動きとして正しいものは？","真東より北寄りからのぼり、南中高度が最も高い",["真東からのぼり、真西にしずむ","真東より南寄りからのぼり、南中高度が最も低い","真西からのぼる"],"夏至は日の出・日の入りが北寄りで、昼が最も長い。"],
["太陽の黒点が東から西へ移動して見えることからわかることは？","太陽が自転していること",["太陽が球形であること","黒点の温度が低いこと","地球が公転していること"],"球形であることは、黒点が周辺部でだ円形に見えることからわかる。"],
["地球の公転面に対して地軸が傾いていなかったとしたら、どうなるか。","季節による南中高度の変化がなくなる",["昼と夜がなくなる","月の満ち欠けがなくなる","太陽が西からのぼる"],"季節の変化は地軸の傾きによって起こる。"],
["火星や木星のように、地球より外側を公転する惑星について正しいものは？","真夜中にも見えることがある",["明け方と夕方にしか見えない","満ち欠けして大きく欠けて見える","太陽の近くにしか見えない"],"外惑星は地球をはさんで太陽と反対側にくることがあり、真夜中にも見える。"]]};
const GEN_BANK=c=>["実験・観察（"+c+"）",()=>{const it=pk(BANK[c]);return choiceP(it[0],it[1],it[2],it[3]);}];
/* ---- 演習ドリル：分野ごとの問題の種類 ---- */
const DRILL={
 "物理":[...GEN["電気"],...GEN["力・運動"],...GEN_PHY_MORE,GEN_BANK("物理")],
 "化学":[...GEN["化学"],...GEN_CHEM_MORE,GEN_BANK("化学")],
 "化学式・反応式":GEN_CHEMF,
 "生物":[...GEN_BIO_MORE,GEN_BANK("生物")],
 "地学":[...GEN["地学"],...GEN_EARTH_MORE,GEN_BANK("地学")]};
const CALC_CATS=["すべて",...Object.keys(DRILL)];
const CK=["ア","イ","ウ","エ","オ"];
function tagOf(c){return c==="化学式・反応式"?"化学":c;}
function weightOf(k){return /^実験・観察/.test(k)?3:1;}
function makeCalc(only){
  let pool=[];if(only)pool=[{c:only.c,g:DRILL[only.c].find(x=>x[0]===only.k)}];
  else (S.calcCat==="すべて"?Object.keys(DRILL):[S.calcCat]).forEach(c=>DRILL[c].forEach(g=>{for(let w=weightOf(g[0]);w>0;w--)pool.push({c,g});}));
  const x=pk(pool);return Object.assign({t:"num"},x.g[1](),{c:x.c,k:x.g[0]});
}
function calcJudge(input,p){
  const t=p.t;
  if(t==="num"){const s=(input||"").normalize("NFKC").replace(/[,\s]/g,"");const m=s.match(/-?\d+(?:\.\d+)?/);if(!m)return null;return Math.abs(rd(+m[0],p.d)-p.a)<1e-9;}
  if(t==="time"){const s=(input||"").normalize("NFKC");const m=s.match(/(\d{1,2})\D+(\d{1,2})/)||s.match(/^\D*(\d{1,2})\D*$/);if(!m)return null;let x=(+m[1])*60+(+(m[2]||0));if(x>=720)x-=720;return x===p.a;}
  if(t==="choice")return input===p.a;
  if(t==="text"){
    if(p.coef){const s=(input||"").normalize("NFKC").trim().replace(/[\s、，,・\/]+/g,",").replace(/^,|,$/g,"");if(!s)return null;return s===p.acc[0];}
    const s=chemNorm(input);if(!s)return null;return p.acc.some(x=>chemNorm(x)===s);}
  if(t==="eq"){const e=eqParse(input);if(e===null)return chemNorm(input)?false:null;return e===eqParse(p.eq);}
  return null;
}
function caseOnly(input,p){if(p.t==="text"&&!p.coef&&!p.name)return p.acc.some(x=>chemNorm(x).toLowerCase()===chemNorm(input).toLowerCase());if(p.t==="eq"){const e=eqParse((input||"").toLowerCase()),r=eqParse(p.eq.toLowerCase());return e!==null&&e===r;}return false;}
const ansDisp=p=>p.ad!=null?p.ad:`${fn(p.a)} ${esc(p.u||"")}`;
if(!S.calcCat||!(S.calcCat in DRILL||S.calcCat==="すべて"))S.calcCat="すべて";
if(!S.calcStat)S.calcStat={n:0,ok:0,by:{}};
if(!S.calcStat.by)S.calcStat.by={};
let CQ=null;
function calcHome(){
  scr="home";
  const st=S.calcStat,cats=S.calcCat==="すべて"?Object.keys(DRILL):[S.calcCat];
  const total=Object.values(DRILL).reduce((a,x)=>a+x.length,0);
  app.innerHTML=`
  <div class="head"><div><h1>理科 記述チェック</h1><div class="sub">演習ドリル（${total}種類・数値や選択肢は毎回変わります）</div></div>${dayBadge()}</div>
  ${modeTabs()}
  <section class="review"><div class="label">入試形式の演習</div>
  <div class="sub">計算は数値だけ、化学式は H2O のように入力します。表やグラフを読む問題、実験の選択問題もあります。まちがえたら解き方を確認しましょう。</div>
  <div class="chips" role="group" aria-label="分野">${CALC_CATS.map(c=>`<button class="chip" data-cc="${c}" aria-pressed="${S.calcCat===c}">${c}</button>`).join("")}</div>
  <div class="actions"><button class="btn pen" id="cgo">10問に挑戦</button></div>
  <div class="sub">これまでの成績：${st.n?`${st.ok} / ${st.n}問正解（${pct(st.ok,st.n)}%）`:"まだ解いていません"}</div></section>
  <div class="legend">種類を選ぶと、その種類だけを10問出題します。</div>
  <div class="list">${cats.map(c=>`<div class="grp">${c}</div>`+DRILL[c].map(g=>{const k=g[0],b=st.by[k]||{n:0,ok:0};return `<button class="row" data-kind="${esc(k)}" data-kc="${c}"><span class="tag t-${tagOf(c)}">${c==="化学式・反応式"?"化学式":c}</span><span class="ttl">${esc(k)}<span class="unit">${b.n?`${b.ok}/${b.n}問正解`:"未挑戦"}</span></span><span class="pcnt">${b.n?pct(b.ok,b.n)+"%":""}</span></button>`;}).join("")).join("")}</div>
  ${backupHTML()}`;
  bindModes();
  app.querySelectorAll("[data-cc]").forEach(b=>b.onclick=()=>{S.calcCat=b.dataset.cc;save();calcHome();});
  app.querySelector("#cgo").onclick=()=>calcStart(null);
  app.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>calcStart({c:b.dataset.kc,k:b.dataset.kind}));
  bindBackup();
  window.scrollTo(0,0);
}
function calcStart(only){CQ={i:0,n:10,ok:0,only,p:makeCalc(only),done:null,input:"",hist:[]};calcQ();}
function inputHTML(p,done){
  if(p.t==="choice")return `<div class="evs">${p.opts.map((o,i)=>`<button class="ev ${done!==null?(i===p.a?"good":i===CQ.input?"bad":""):""}" data-ch="${i}" ${done!==null?"disabled":""}><span class="kana">${CK[i]}</span><span class="evt">${o}</span><span></span></button>`).join("")}</div>`;
  const chem=p.t==="eq"||(p.t==="text"&&!p.coef&&!p.name);
  const keys=p.t==="eq"?["→","+","(",")"]:/イオン/.test(p.k)?["+","-"]:[];
  return `<div><label class="label" for="cin">答え${p.hint?`<span class="hintx">（${esc(p.hint)}）</span>`:""}</label><div class="numrow"><input id="cin" class="guess" type="text" ${p.t==="num"?'inputmode="decimal"':""} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${p.t==="num"?"数値を入力":p.t==="time"?"例：5時30分":"入力"}" value="${esc(CQ.input||"")}" ${done!==null?"disabled":""}>${p.t==="num"?`<span class="unitlbl">${esc(p.u||"")}</span>`:""}</div>${keys.length&&done===null?`<div class="keys2">${keys.map(k=>`<button class="mini" data-ins="${k}" aria-label="${k}を入力">${k}</button>`).join("")}</div>`:""}${chem?`<div class="sub">大文字・小文字を区別します。数字はそのまま入力（例：H2SO4）</div>`:""}</div>`;
}
function calcQ(){
  scr="calc";
  const p=CQ.p,done=CQ.done;
  app.innerHTML=`<div class="nav"><button class="btn ghost" id="back">← 一覧</button><span class="sub" style="align-self:center">${CQ.i+1} / ${CQ.n}　正解 ${CQ.ok}</span></div><div class="pbar"><i style="width:${(CQ.i/CQ.n*100).toFixed(1)}%"></i></div>
  <div class="sheet">
    <div class="qno"><span class="tag t-${tagOf(p.c)}">${p.c==="化学式・反応式"?"化学式":p.c}</span><span>${esc(p.k)}</span></div>
    <div class="qtext">${p.q}</div>
    ${inputHTML(p,done)}
    ${done!==null?`<div class="verdict ${done?"ok":"ng"}">${done?"正解！":"不正解"}　答え：${ansDisp(p)}</div>${!done&&CQ.caseHint?`<div class="sub">大文字・小文字のちがいだけでした。元素記号は1文字目が大文字、2文字目が小文字です。</div>`:""}<div class="item"><div class="k"><span>解</span>解き方・解説</div><div class="a">${fmt(p.s,"")}</div></div>`:""}
  </div>
  <div class="nav">${done!==null?`<span></span><button class="btn" id="cnext">${CQ.i<CQ.n-1?"次の問題 →":"結果を見る"}</button>`:`<span class="sub" id="cmsg" role="status"></span>${p.t==="choice"?"":`<button class="btn pen" id="ccheck">答え合わせ</button>`}`}</div>`;
  app.querySelector("#back").onclick=home;
  const record=(v,ok)=>{CQ.input=v;CQ.done=ok;CQ.caseHint=!ok&&caseOnly(v,p);if(ok)CQ.ok++;const st=S.calcStat;st.n++;if(ok)st.ok++;const b=st.by[p.k]=st.by[p.k]||{n:0,ok:0};b.n++;if(ok)b.ok++;logOne();CQ.hist.push({p,ok,input:p.t==="choice"?CK[v]+"　"+p.opts[v]:v});save();calcQ();};
  if(done===null){
    if(p.t==="choice")app.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{const v=+b.dataset.ch;record(v,calcJudge(v,p));});
    else{const inp=app.querySelector("#cin");
      const check=()=>{const v=inp.value;const ok=calcJudge(v,p);if(ok===null){app.querySelector("#cmsg").textContent=p.t==="eq"?"→ をふくむ式を入力してください":"答えを入力してください";inp.focus();return;}record(v,ok);};
      inp.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();check();}};
      app.querySelector("#ccheck").onclick=check;
      app.querySelectorAll("[data-ins]").forEach(b=>b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e2=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.dataset.ins+inp.value.slice(e2);inp.focus();const c=s+b.dataset.ins.length;try{inp.setSelectionRange(c,c);}catch(x){}});
      if(matchMedia("(hover:hover)").matches)inp.focus({preventScroll:true});}
  }
  const n=app.querySelector("#cnext");if(n){n.onclick=()=>{if(CQ.i<CQ.n-1){CQ.i++;CQ.p=makeCalc(CQ.only);CQ.done=null;CQ.input="";calcQ();}else calcResult();};n.focus({preventScroll:true});}
  window.scrollTo(0,0);
}
function calcResult(){
  scr="r";
  const miss=CQ.hist.filter(h=>!h.ok);
  const brief=q=>q.replace(/<div class="tbl">[\s\S]*?<\/div>/g,"（表・図）").replace(/<div class="(term|qsub)"[^>]*>([\s\S]*?)<\/div>/g," $2");
  app.innerHTML=`<div class="sheet result"><div class="label">演習ドリル（${esc(CQ.only?CQ.only.k:S.calcCat)}）</div>
  <div class="score"><b>${CQ.ok}</b><small>/ ${CQ.n}</small><span class="sub">正解</span></div>
  ${miss.length?`<div class="label">まちがえた問題</div><ul class="miss">${miss.map(h=>`<li><span class="mk x">×</span><span><span class="sub">${esc(h.p.k)}</span><br>${brief(h.p.q)}<br>あなたの答え：${h.p.t==="choice"?h.input:esc(h.input)}<br>正解：<b class="yr">${ansDisp(h.p)}</b><br><span class="sub">${esc(h.p.s)}</span></span></li>`).join("")}</ul>`:`<div class="sub">全問正解です。</div>`}
  <div class="actions"><button class="btn pen" id="cagain">もう一度10問</button><button class="btn ghost" id="home">一覧にもどる</button></div></div>`;
  app.querySelector("#cagain").onclick=()=>calcStart(CQ.only);
  app.querySelector("#home").onclick=home;
  window.scrollTo(0,0);
}
/* ---- キーボード操作 ---- */
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();if(tag==="textarea"||tag==="input")return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(scr==="q"&&(e.key===" "||e.key==="Enter")){e.preventDefault();answer();}
  else if(scr==="a"){const m={"1":"o","2":"t","3":"x"}[e.key];if(m){e.preventDefault();const b=app.querySelector(`.g.${m}`);b&&b.click();}else if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){e.preventDefault();goNext();}}
  else if(scr==="l"){const m={"1":"o","2":"t","3":"x"}[e.key];if(m){e.preventDefault();const b=app.querySelector(`.lgrade .g.${m}`);b&&b.click();}}
  else if(scr==="calc"){const i={"1":0,"2":1,"3":2,"4":3}[e.key];if(i!=null){const b=app.querySelector(`[data-ch="${i}"]`);b&&!b.disabled&&b.click();}}
  if(e.key==="Escape"&&scr!=="home"){if(scr==="q"||scr==="a")leave();else home();}
});

/* ---- 聞き流しモード：問題 → 間 → 答え → 次 ---- */
let LS=null,wake=null;
if(S.gap==null)S.gap=5;
if(S.gapE==null)S.gapE=8;
function gapKey(c){return c.q.rev?"gap":"gapE";}
function gapOpts(c){return c.q.rev?[3,5,8]:[5,8,15];}
function stopListen(){if(!LS)return;clearTimeout(LS.timer);LS=null;ttsStop();try{wake&&wake.release();}catch(e){}wake=null;}
function listen(cards){
  if(!cards.length||!TTS)return;
  stopListen();LS={cards,i:0,playing:true,timer:null};
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{});}catch(e){}
  lstep();
}
function lrender(revealed){
  const c=LS.cards[LS.i],it=c.q.i[c.k];
  app.innerHTML=`<div class="nav"><button class="btn ghost" id="back">← 一覧</button><span class="sub" style="align-self:center">聞き流し ${LS.i+1} / ${LS.cards.length}</span></div>
  <div class="sheet">
    ${head(c)}
    <div class="qtext" id="lq">${esc(qPrompt(c))}</div>
    <div class="ans ${revealed?"":"veil"}">${ansHTML(c).replace("__ID__","la")}</div>
    <div class="lgrade"><span class="label">自己採点（読み上げは止まりません）</span><div class="grade" role="group" aria-label="自己採点">${["o","t","x"].map((v,i)=>`<button class="g ${v}" data-v="${v}" aria-pressed="${gradeOf(c)===v}">${MARK[v]}<small>${i+1}</small></button>`).join("")}</div></div>
    <div class="lctl"><button class="btn ghost" id="lprev" ${LS.i?"":"disabled"}>← 前へ</button><button class="btn pen" id="lplay">${LS.playing?"一時停止":"再開"}</button><button class="btn ghost" id="lnext" ${LS.i<LS.cards.length-1?"":"disabled"}>次へ →</button></div>
    <div class="speak"><span class="label">考える時間</span><div class="rate" role="group" aria-label="考える時間">${gapOpts(c).map(s=>`<button data-gap="${s}" aria-pressed="${S[gapKey(c)]==s}">${s}秒</button>`).join("")}</div>
    <div class="rate" role="group" aria-label="読み上げの速さ">${[[0.8,"ゆっくり"],[1,"ふつう"],[1.3,"速い"]].map(([r,l])=>`<button data-rate="${r}" aria-pressed="${S.rate==r}">${l}</button>`).join("")}</div></div>
  </div>`;
  app.querySelector("#back").onclick=home;scr="l";
  app.querySelectorAll(".lgrade .g").forEach(b=>b.onclick=()=>{grade(c,b.dataset.v);app.querySelectorAll(".lgrade .g").forEach(x=>x.setAttribute("aria-pressed",gradeOf(c)===x.dataset.v));});
  app.querySelector("#lplay").onclick=()=>{if(LS.playing){LS.playing=false;clearTimeout(LS.timer);ttsStop();lrender(revealed);}else{LS.playing=true;lstep();}};
  app.querySelector("#lprev").onclick=()=>{clearTimeout(LS.timer);LS.i--;LS.playing=true;lstep();};
  app.querySelector("#lnext").onclick=()=>{clearTimeout(LS.timer);LS.i++;LS.playing=true;lstep();};
  app.querySelectorAll("[data-gap]").forEach(b=>b.onclick=()=>{S[gapKey(c)]=+b.dataset.gap;save();app.querySelectorAll("[data-gap]").forEach(x=>x.setAttribute("aria-pressed",S[gapKey(c)]==x.dataset.gap));});
  bindRate();
}
function lstep(){
  if(!LS)return;const me=LS;clearTimeout(me.timer);
  const c=me.cards[me.i],it=c.q.i[c.k];
  lrender(false);window.scrollTo(0,0);
  ttsPlay([{text:sayQ(c),el:app.querySelector("#lq")}],null,()=>{
    if(LS!==me||!me.playing)return;
    me.timer=setTimeout(()=>{
      if(LS!==me||!me.playing)return;
      lrender(true);
      ttsPlay([{text:aText(c),el:app.querySelector("#la")}],null,()=>{
        if(LS!==me||!me.playing)return;
        me.timer=setTimeout(()=>{
          if(LS!==me||!me.playing)return;
          if(me.i<me.cards.length-1){me.i++;lstep();}
          else{stopListen();app.innerHTML=`<div class="sheet"><h2>聞き流し おわり</h2><div class="sub">${me.cards.length}問を読み上げました。</div><div class="actions"><button class="btn" id="back">一覧にもどる</button></div></div>`;app.querySelector("#back").onclick=home;}
        },1500);
      });
    },S[gapKey(c)]*1000);
  });
}
home();
</script>
