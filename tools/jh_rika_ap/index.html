<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>社会 記述チェック</title>
<style>
/* layout: one column, "解答用紙" — question sheet → answer sheet with red-pen self-marking */
:root{
  --paper:#f3f5f4; --sheet:#ffffff; --ink:#1d2a3a; --muted:#5d6b78; --rule:#d5dcdf;
  --pen:#c8321e; --pen-soft:#fbe9e5; --mid:#c98a12; --mid-soft:#fbf1dc; --ok:#2f7a4f; --ok-soft:#e3f2e8;
  --chi:#2b6f8f; --rek:#8a4b2a; --kou:#4b5aa0; --mark:#fbe38a;
  --f-display:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a20; --sheet:#1c242c; --ink:#e4e9ee; --muted:#9aa7b3; --rule:#33404b;
  --pen:#ff7a63; --pen-soft:#3a201c; --mid:#e8b04a; --mid-soft:#352a14; --ok:#6cc792; --ok-soft:#18301f;
  --chi:#6fb5d6; --rek:#d79670; --kou:#9aa6ea; --mark:#6b5a1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a20; --sheet:#1c242c; --ink:#e4e9ee; --muted:#9aa7b3; --rule:#33404b;
  --pen:#ff7a63; --pen-soft:#3a201c; --mid:#e8b04a; --mid-soft:#352a14; --ok:#6cc792; --ok-soft:#18301f;
  --chi:#6fb5d6; --rek:#d79670; --kou:#9aa6ea; --mark:#6b5a1e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:1.6rem;letter-spacing:.04em}
h2{font-size:1.25rem;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--chi);outline-offset:2px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:.85rem}
.stats{display:flex;gap:14px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{color:var(--ink);font-size:1.05rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:8px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.pen{background:var(--pen);border-color:var(--pen);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover{background:var(--sheet)}
.tag{font-size:.72rem;letter-spacing:.08em;padding:2px 8px;border-radius:4px;color:var(--sheet);white-space:nowrap}
.t-地理{background:var(--chi)}.t-歴史{background:var(--rek)}.t-公民{background:var(--kou)}
.row .ttl{min-width:0;font-weight:600}
.row .unit{display:block;font-weight:400;font-size:.78rem;color:var(--muted)}
.marks{display:flex;gap:3px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--rule)}
.dot.o{background:var(--ok);border-color:var(--ok)}.dot.t{background:var(--mid);border-color:var(--mid)}.dot.x{background:var(--pen);border-color:var(--pen)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.qno{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.qtext{font-family:var(--f-display);font-size:1.15rem;line-height:1.8}
.need{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.need li{border:1px dashed var(--muted);border-radius:4px;padding:2px 10px;font-size:.88rem}
textarea{width:100%;min-height:140px;border:1px solid var(--rule);border-radius:4px;background:repeating-linear-gradient(var(--sheet),var(--sheet) 31px,var(--rule) 32px);line-height:32px;padding:0 10px;font:inherit;color:var(--ink);resize:vertical}
.label{font-size:.75rem;letter-spacing:.1em;color:var(--muted)}
.ans{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)}
.item{display:grid;grid-template-columns:1fr;gap:6px;padding:14px 0;border-bottom:1px solid var(--rule)}
.item .k{font-weight:700;display:flex;gap:8px;align-items:baseline}
.item .k span{font-family:var(--f-display);color:var(--pen)}
.item .a{min-width:0}
.grade{display:flex;gap:6px}
.g{width:64px;height:48px;border:1px solid var(--rule);border-radius:6px;background:transparent;font-size:1.1rem;font-weight:700;color:var(--muted)}
.g[aria-pressed="true"].o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.g[aria-pressed="true"].t{background:var(--mid-soft);border-color:var(--mid);color:var(--mid)}
.g[aria-pressed="true"].x{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}
.memo{border-left:3px solid var(--rule);padding-left:12px;color:var(--muted);font-size:.9rem;white-space:pre-wrap}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.kw{font-weight:700;background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 1px}
.yr{font-weight:700;color:var(--pen)}
.review{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--pen);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.rv-n{font-family:var(--f-display);font-size:1.1rem}.rv-n b{font-size:2rem;color:var(--pen);font-variant-numeric:tabular-nums;margin-right:2px}
.veil .a,.veil .term{filter:blur(8px);user-select:none}
.prog{display:flex;flex-direction:column;gap:6px}
.plegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.75rem;color:var(--muted);align-items:center}
.plegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--rule)}
.bar{display:flex;height:12px;border-radius:999px;background:var(--rule);overflow:hidden;min-width:0}
.bar i{display:block;height:100%}
.bo{background:var(--ok)!important}.bt{background:var(--mid)!important}.bx{background:var(--pen)!important}
.pc{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.pc summary{display:grid;grid-template-columns:auto 3.6em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}
.pc summary::-webkit-details-marker{display:none}
.pc summary:focus-visible{outline:2px solid var(--chi);outline-offset:2px}
.pnum{font-family:var(--f-display);font-size:1.25rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}.pnum small{font-size:.7rem}
.pcnt{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:3.2em}
.units{display:flex;flex-direction:column;gap:8px;padding:4px 12px 12px;border-top:1px solid var(--rule)}
.urow{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) auto;gap:10px;align-items:center;padding-top:6px}
.uname{font-size:.82rem;overflow-wrap:anywhere}
.urow{border:0;background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:4px}
.urow:hover{background:var(--paper)}
.days{display:flex;gap:12px;font-size:.82rem;color:var(--muted)}.days b{font-size:1.2rem;color:var(--ink);font-variant-numeric:tabular-nums}
.pbar{height:4px;background:var(--rule);border-radius:999px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--pen)}
.g small{font-size:.65rem;font-weight:400;opacity:.6;margin-left:4px;vertical-align:top}
.auto{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.guess{width:100%;font:inherit;font-size:1.1rem;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink)}
.verdict{margin-top:6px;font-weight:700;font-size:.92rem;padding:6px 10px;border-radius:6px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}.verdict.ng{background:var(--mid-soft);color:var(--mid)}
.search{display:flex;flex-direction:column;gap:4px}
.search input{font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);width:100%}
.backup{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.backup summary{padding:12px 14px;cursor:pointer;font-weight:700;font-size:.9rem}
.bk{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px}
.bk textarea{min-height:80px;line-height:1.4;background:var(--sheet);font-size:.8rem;word-break:break-all;padding:8px}
.result{gap:14px}
.score{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.score b{font-family:var(--f-display);font-size:3.2rem;line-height:1;color:var(--pen);font-variant-numeric:tabular-nums}.score small{font-size:1rem;font-weight:700}
.miss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.miss li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:.9rem}
.mk{font-weight:700}.mk.x{color:var(--pen)}.mk.t{color:var(--mid)}
.chron{list-style:none;margin:0;padding:4px 14px 14px;display:flex;flex-direction:column;gap:6px}
.result .chron{padding:0 0 8px;border-bottom:1px solid var(--rule)}
.chron li{display:grid;grid-template-columns:6.2em minmax(0,1fr);gap:10px;font-size:.88rem}
.chron .yr{font-variant-numeric:tabular-nums}
.evs{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;font:inherit;color:inherit;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px;cursor:pointer}
.ev:hover:not(:disabled){border-color:var(--ink)}
.ev:disabled{cursor:default}
.ev.on{background:var(--paper);opacity:.75}
.ev.good{border-color:var(--ok);background:var(--ok-soft);opacity:1}.ev.bad{border-color:var(--pen);background:var(--pen-soft);opacity:1}
.kana{font-family:var(--f-display);font-weight:700;font-size:1.1rem;width:1.8em;height:1.8em;display:grid;place-items:center;border:1px solid var(--ink);border-radius:50%}
.evt{display:flex;flex-direction:column;gap:2px}.evy{font-size:.85rem}
.ord{font-weight:700;color:var(--pen);font-size:1.2rem;font-variant-numeric:tabular-nums}
.seq{font-family:var(--f-display);font-size:1.15rem;font-weight:700;letter-spacing:.06em;min-height:1.6em}
.modes{grid-template-columns:repeat(3,1fr)!important}
.range{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.range summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:12px 14px;cursor:pointer}
.range summary b{font-size:1rem}
.rbody{display:flex;flex-direction:column;gap:12px;padding:0 14px 14px}
.rgrp{display:flex;flex-direction:column;gap:6px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.linkbtn{border:0;background:none;color:var(--chi);font:inherit;font-size:.82rem;text-decoration:underline;cursor:pointer;padding:4px}
.uchip{font-size:.85rem;padding:6px 12px}.uchip small{margin-left:6px;opacity:.6;font-variant-numeric:tabular-nums}
.mtab{font-size:.9rem}
@media (hover:none){.keys{display:none}}
.modes{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:8px;overflow:hidden}
.mtab{border:0;background:var(--sheet);padding:10px 8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.mtab span{font-size:.72rem;font-weight:400;color:var(--muted)}
.mtab[aria-selected="true"]{background:var(--ink);color:var(--sheet)}.mtab[aria-selected="true"] span{color:var(--sheet);opacity:.8}
.term{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.4;background:linear-gradient(transparent 62%,var(--mark) 62%);justify-self:start;padding:0 4px}
.ask{font-size:.9rem;color:var(--pen);font-weight:700}
.vsel{font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);width:100%}
.lgrade{display:flex;flex-direction:column;gap:6px}
.lctl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grp{font-size:.78rem;letter-spacing:.1em;color:var(--muted);padding:18px 4px 6px;border-bottom:1px solid var(--rule);font-weight:700}
.speak{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sbtn{border:1px solid var(--chi);color:var(--chi);background:transparent;border-radius:999px;padding:6px 14px;font-size:.9rem;font-weight:600}
.sbtn[aria-pressed="true"]{background:var(--chi);color:var(--sheet)}
.rate{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.rate button{border:0;background:transparent;padding:5px 10px;font-size:.8rem;color:var(--muted)}
.rate button[aria-pressed="true"]{background:var(--rule);color:var(--ink);font-weight:700}
.mini{border:1px solid var(--rule);background:transparent;border-radius:999px;width:30px;height:30px;font-size:.75rem;color:var(--chi);margin-left:auto;flex:none}
.item.reading,.qtext.reading{background:var(--ok-soft);box-shadow:-8px 0 0 var(--ok-soft),8px 0 0 var(--ok-soft)}
.legend{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head>

<script>
const Q=[
/* ===== 公民 ===== */
{c:"公民",u:"国際社会",t:"国際連合",q:"国際連合について、設立年、設立経緯、加盟国数、意思決定の方法、国際連盟とのちがい、主要な組織を説明せよ。",i:[
["設立年","1945年（10月24日に発足）。"],
["設立経緯","第二次世界大戦を防げなかった国際連盟の反省から、戦争中の1941年に米英が大西洋憲章で戦後の平和構想を示し、1945年6月のサンフランシスコ会議で国際連合憲章が採択された。"],
["加盟国数","193か国（2011年の南スーダン加盟が最新）。日本は1956年、日ソ共同宣言でソ連との国交を回復したことで加盟が実現した。"],
["意思決定の方法","総会は全加盟国が1国1票、一般事項は過半数、重要事項は3分の2以上で議決（多数決）。安全保障理事会は15か国（常任理事国5か国＋非常任理事国10か国・任期2年）で、重要事項は9か国以上の賛成が必要。ただし常任理事国（米・英・仏・露・中）が1か国でも反対すると決まらない＝拒否権。"],
["国際連盟とのちがい","連盟（1920年、本部ジュネーブ）は全会一致制で決めにくく、制裁は経済制裁のみ、アメリカが不参加でソ連の加盟も遅れ、日本・ドイツなどが脱退した。国連（本部ニューヨーク）は多数決制で、安保理が武力制裁を含む措置を決定でき、大国が最初から参加している。"],
["主要な組織","総会、安全保障理事会、経済社会理事会、国際司法裁判所（オランダのハーグ）、事務局（代表は事務総長）、信託統治理事会（現在は活動停止）。専門機関にUNESCO（教育・科学・文化）、WHO（保健）、ILO（労働）、IMF など。ほかにUNICEF（子ども）、UNHCR（難民）、PKO（平和維持活動）。"]]},
{c:"公民",u:"憲法",t:"日本国憲法",q:"日本国憲法について、公布日と施行日、三つの基本原則、天皇の地位、改正の手続き、大日本帝国憲法とのちがいを説明せよ。",i:[
["公布日と施行日","1946年11月3日公布（現在の文化の日）、1947年5月3日施行（現在の憲法記念日）。"],
["三つの基本原則","国民主権、基本的人権の尊重、平和主義。平和主義は前文と第9条（戦争放棄・戦力不保持・交戦権の否認）に示される。"],
["天皇の地位","日本国と日本国民統合の「象徴」。政治的権限はもたず、憲法に定められた国事行為（内閣総理大臣の任命、法律の公布、国会の召集など）のみを、内閣の助言と承認にもとづいて行う。"],
["改正の手続き","衆議院・参議院それぞれの総議員の3分の2以上の賛成で国会が発議し、国民投票で有効投票の過半数の賛成が必要。成立すると天皇が国民の名で公布する。"],
["大日本帝国憲法とのちがい","帝国憲法は天皇が定めた欽定憲法で、主権は天皇にあり、天皇が軍の統帥権をもった。人権は「法律の範囲内」で認められる臣民の権利だった。日本国憲法は国民が定めた民定憲法で、主権は国民、人権は永久の権利として保障される。"]]},
{c:"公民",u:"政治のしくみ",t:"国会",q:"国会について、憲法上の地位、二院制のしくみ、衆議院の優越、国会の種類、おもな仕事を説明せよ。",i:[
["憲法上の地位","国権の最高機関であり、国の唯一の立法機関（第41条）。"],
["二院制のしくみ","衆議院：定数465、任期4年、解散あり、被選挙権25歳以上。参議院：定数248、任期6年（3年ごとに半数改選）、解散なし、被選挙権30歳以上。慎重に審議し、国民の多様な意見を反映させるため。"],
["衆議院の優越","任期が短く解散もあり、国民の意思を反映しやすいため。法律案は衆議院で出席議員の3分の2以上で再可決すれば成立。予算は衆議院が先に審議（予算先議権）。予算・条約の承認・内閣総理大臣の指名は、両院協議会でも一致しないとき衆議院の議決が国会の議決になる。内閣不信任決議は衆議院だけができる。"],
["国会の種類","常会（通常国会）：毎年1回1月に召集、会期150日。臨時会：内閣が必要と認めたときなど。特別会：衆議院解散後の総選挙の日から30日以内に召集し、首相を指名。参議院の緊急集会：衆議院解散中に緊急の必要があるとき。"],
["おもな仕事","法律の制定、予算の議決、条約の承認、内閣総理大臣の指名、弾劾裁判所の設置、国政調査権、憲法改正の発議。"]]},
{c:"公民",u:"政治のしくみ",t:"内閣と議院内閣制",q:"内閣について、構成、議院内閣制の意味、内閣不信任決議と解散の関係、おもな仕事を説明せよ。",i:[
["構成","内閣総理大臣と国務大臣で構成。首相は国会議員の中から国会が指名し、天皇が任命する。国務大臣は首相が任命し、その過半数は国会議員。全員が文民でなければならない。閣議は全会一致が原則。"],
["議院内閣制の意味","内閣が国会（衆議院）の信任にもとづいて成立し、国会に対して連帯して責任を負うしくみ。"],
["不信任決議と解散","衆議院で内閣不信任決議が可決されると、内閣は10日以内に衆議院を解散するか、総辞職しなければならない。解散した場合は総選挙後の特別会で首相が指名される。"],
["おもな仕事","法律の執行、予算の作成と国会への提出、条約の締結、政令の制定、外交関係の処理、天皇の国事行為への助言と承認、最高裁判所長官の指名とその他の裁判官の任命。"]]},
{c:"公民",u:"政治のしくみ",t:"裁判所と司法",q:"裁判所について、裁判所の種類、三審制、司法権の独立、違憲審査権、民事裁判と刑事裁判のちがい、裁判員制度を説明せよ。",i:[
["裁判所の種類","最高裁判所と下級裁判所（高等裁判所・地方裁判所・家庭裁判所・簡易裁判所）。"],
["三審制","判決に不服があれば、上級の裁判所に控訴、さらに上告でき、1つの事件について3回まで裁判を受けられる。誤った判決を防ぎ人権を守るため。"],
["司法権の独立","裁判官は良心に従い、憲法と法律にのみ拘束される。国会や内閣など他の権力から干渉を受けない。裁判官は弾劾裁判や国民審査（最高裁）などでしか辞めさせられない。"],
["違憲審査権","法律や命令などが憲法に違反していないかを判断する権限。すべての裁判所がもつが、最終的に決定する最高裁判所は「憲法の番人」とよばれる。"],
["民事裁判と刑事裁判","民事裁判：お金の貸し借りなど個人や企業の争いで、訴えた側が原告、訴えられた側が被告。刑事裁判：犯罪について検察官が被疑者を起訴し（被告人）、有罪・無罪や刑罰を決める。被告人には弁護人をつける権利がある。"],
["裁判員制度","2009年開始。国民から選ばれた裁判員（原則6人）が裁判官（3人）とともに、重大な刑事事件の第一審（地方裁判所）で有罪・無罪と刑罰の内容を決める。司法に国民の感覚を反映させるため。"]]},
{c:"公民",u:"政治のしくみ",t:"三権分立",q:"三権分立について、考えを唱えた人物、目的、国会・内閣・裁判所が互いにおさえ合う関係、国民とのかかわりを説明せよ。",i:[
["唱えた人物","フランスのモンテスキューが『法の精神』で唱えた。"],
["目的","権力を立法・行政・司法に分け、互いに抑制し均衡を保つことで、権力の集中と濫用を防ぎ、国民の自由と権利を守る。"],
["国会と内閣","国会→内閣：内閣総理大臣の指名、内閣不信任決議。内閣→国会：衆議院の解散、臨時会の召集の決定。"],
["国会と裁判所","国会→裁判所：弾劾裁判所で裁判官を裁く。裁判所→国会：法律の違憲審査。"],
["内閣と裁判所","内閣→裁判所：最高裁長官の指名、その他の裁判官の任命。裁判所→内閣：命令・規則・処分の違憲・違法審査。"],
["国民とのかかわり","国民は国会に対して選挙、内閣に対して世論、最高裁判所の裁判官に対して国民審査で関わる。"]]},
{c:"公民",u:"地方自治",t:"地方自治",q:"地方自治について、「民主主義の学校」の意味、首長と地方議会の関係、直接請求権の内容、地方財政の財源を説明せよ。",i:[
["民主主義の学校","住民が身近な地域の政治に参加することで、民主主義のあり方を学べるという意味。イギリスのブライスのことば。"],
["首長と議会","首長（知事・市区町村長）と議員はどちらも住民が直接選挙で選ぶ（二元代表制）。任期はともに4年。被選挙権は知事30歳以上、市区町村長・議員25歳以上。議会は首長の不信任決議ができ、首長は議会を解散できる。"],
["直接請求権","条例の制定・改廃：有権者の50分の1以上の署名で首長へ。監査請求：50分の1以上で監査委員へ。議会の解散、首長・議員の解職（リコール）：原則3分の1以上で選挙管理委員会へ、その後住民投票。"],
["地方財政の財源","自主財源の地方税。依存財源として、地方交付税交付金（地方公共団体間の財政格差をおさえるため国が配分、使い道は自由）、国庫支出金（義務教育や公共事業など使い道を指定して国が支出）、地方債（借金）。"]]},
{c:"公民",u:"人権",t:"基本的人権",q:"基本的人権について、平等権・自由権・社会権の内容、人権を守るための権利、新しい人権、公共の福祉、国民の義務を説明せよ。",i:[
["平等権","法の下の平等（第14条）、両性の本質的平等など。男女雇用機会均等法、男女共同参画社会基本法、障害者差別解消法などで実現をはかる。"],
["自由権","精神の自由（思想・良心、信教、表現、学問の自由）、身体の自由（奴隷的拘束・苦役からの自由、令状なしの逮捕の禁止など）、経済活動の自由（居住・移転・職業選択の自由、財産権）。"],
["社会権","人間らしい生活を国に求める権利。生存権（第25条「健康で文化的な最低限度の生活」）、教育を受ける権利、勤労の権利、労働基本権。ドイツのワイマール憲法（1919年）で初めて規定された。"],
["人権を守るための権利","参政権（選挙権・被選挙権、憲法改正の国民投票、最高裁判所裁判官の国民審査、請願権）、請求権（裁判を受ける権利、国家賠償請求権、刑事補償請求権）。"],
["新しい人権","社会の変化で主張されるようになった権利。環境権（日照権など、環境アセスメント）、知る権利（情報公開制度）、プライバシーの権利（個人情報保護制度）、自己決定権（インフォームド・コンセント、臓器提供意思表示カード）。"],
["公共の福祉と義務","人権は他人の人権との調整のため「公共の福祉」によって制限されることがある。国民の三大義務は、子どもに普通教育を受けさせる義務、勤労の義務、納税の義務。"]]},
{c:"公民",u:"政治のしくみ",t:"選挙制度",q:"選挙について、選挙の四原則、選挙権の年齢、衆議院と参議院の選挙制度、小選挙区制と比例代表制の特徴、選挙の課題を説明せよ。",i:[
["選挙の四原則","普通選挙（一定年齢以上のすべての国民）、平等選挙（一人一票）、秘密選挙（無記名）、直接選挙（有権者が直接選ぶ）。"],
["選挙権の年齢","満18歳以上（2016年の選挙から。それまでは20歳以上）。"],
["衆議院と参議院","衆議院は小選挙区比例代表並立制（小選挙区289＋比例代表176）。参議院は選挙区（原則都道府県単位）148と全国1区の比例代表100。"],
["小選挙区制と比例代表制","小選挙区制：1選挙区から1人を選ぶ。大政党に有利で政権が安定しやすいが、落選者への票（死票）が多い。比例代表制：政党の得票数に応じて議席を配分（ドント式）。死票が少なく少数意見も反映されるが、小党が分立しやすい。"],
["選挙の課題","選挙区ごとの議員一人あたりの有権者数の差による「一票の格差」（最高裁が違憲状態と判断したこともある）、若い世代を中心とした投票率の低下。"]]},
{c:"公民",u:"経済",t:"市場経済と価格",q:"市場経済について、需要と供給の関係、均衡価格、独占と寡占、独占禁止法、公共料金を説明せよ。",i:[
["需要と供給の関係","需要量（買いたい量）が供給量（売りたい量）より多いと価格は上がり、少ないと価格は下がる。価格が上がると需要量は減り、供給量は増える。"],
["均衡価格","需要量と供給量が一致したときの価格。グラフでは需要曲線と供給曲線の交点。"],
["独占と寡占","独占：1社が市場を支配する状態。寡占：少数の企業が市場を支配する状態。競争がなくなり、企業が一方的に決める独占価格（管理価格）がつけられ、消費者が不利益を受ける。"],
["独占禁止法","企業の自由な競争を確保するための法律。公正取引委員会が運用し、価格カルテル（企業間の価格の取り決め）などを監視・取りしまる。"],
["公共料金","電気・ガス・水道・鉄道運賃など、国民生活への影響が大きいため、国や地方公共団体が決定したり認可したりする料金。"]]},
{c:"公民",u:"経済",t:"金融と日本銀行",q:"金融について、直接金融と間接金融、日本銀行の三つの役割、景気を調整する金融政策を説明せよ。",i:[
["直接金融と間接金融","直接金融：企業が株式や社債を発行して出資者から直接資金を集める。間接金融：銀行などの金融機関が預金者から集めたお金を企業などに貸し出す。"],
["日本銀行の三つの役割","発券銀行（日本銀行券＝紙幣を発行）、銀行の銀行（一般の銀行に資金を貸し出したり預金を受け入れたりする）、政府の銀行（政府の資金を預かり、出し入れを行う）。日本の中央銀行。"],
["金融政策","おもに公開市場操作。不景気のとき：日本銀行が銀行から国債などを買い、銀行の資金を増やす→企業に貸し出しやすくなり景気回復へ。好景気（インフレ）のとき：国債などを売り、銀行の資金を減らして景気の過熱をおさえる。"]]},
{c:"公民",u:"経済",t:"財政と税金",q:"財政について、財政の三つの役割、直接税と間接税、累進課税、景気を調整する財政政策、日本の財政の課題を説明せよ。",i:[
["財政の三つの役割","資源配分（道路・公園など社会資本や公共サービスの提供）、所得の再分配（累進課税や社会保障で格差を縮める）、景気の安定化。"],
["直接税と間接税","直接税：税を納める人と負担する人が同じ（所得税、法人税、相続税など）。間接税：納める人と負担する人が異なる（消費税、酒税など）。"],
["累進課税","所得が多い人ほど高い税率をかけるしくみ。所得税などで採用され、所得の格差を小さくする。一方、消費税は所得の低い人ほど負担の割合が重くなる（逆進性）。"],
["財政政策","不景気のとき：減税や公共投資の増加で需要を増やす。好景気のとき：増税や公共投資の削減で景気の過熱をおさえる。"],
["日本の財政の課題","歳入の多くを国債（借金）に頼り、国債残高が増え続けている。歳出では社会保障関係費と国債費の割合が大きい。"]]},
{c:"公民",u:"経済",t:"労働者の権利",q:"労働について、労働三法、労働三権、労働基準法のおもな内容、雇用をめぐる課題を説明せよ。",i:[
["労働三法","労働基準法（労働条件の最低基準）、労働組合法（労働組合の結成と活動を保障）、労働関係調整法（労働争議の予防と解決）。"],
["労働三権","団結権（労働組合をつくる）、団体交渉権（使用者と労働条件を交渉する）、団体行動権（争議権・ストライキなど）。憲法第28条で保障。"],
["労働基準法の内容","労働時間は1日8時間・週40時間以内、毎週少なくとも1日の休日、男女同一賃金、児童の使用禁止など。"],
["雇用の課題","パートやアルバイト・派遣など非正規雇用の増加と正規雇用との賃金格差、長時間労働や過労死、仕事と生活の調和（ワーク・ライフ・バランス）の実現。"]]},
{c:"公民",u:"経済",t:"消費者の権利",q:"消費者の保護について、消費者主権の考え方、クーリング・オフ制度、製造物責任法、消費者を守るおもな法律と行政機関を説明せよ。",i:[
["消費者主権","消費者が自分の意思と判断で商品を選んで購入し、その選択が生産のあり方を決めるという考え方。アメリカのケネディ大統領が消費者の4つの権利（安全を求める、知らされる、選ぶ、意見を反映させる）を唱えた。"],
["クーリング・オフ","訪問販売や電話勧誘販売などで契約した場合、一定期間内（多くは8日以内）であれば無条件で契約を解除できる制度。"],
["製造物責任法（PL法）","1995年施行。製品の欠陥によって消費者が被害を受けた場合、企業に過失がなくても損害賠償の責任を負わせる法律。"],
["その他の法律・機関","消費者契約法（不当な契約の取り消し）、消費者基本法（2004年、消費者の自立を支援）、消費者庁（2009年設置）、国民生活センター・消費生活センター。"]]},
{c:"公民",u:"国際社会",t:"地球環境問題",q:"地球環境問題について、おもな問題の種類と原因、京都議定書、パリ協定、持続可能な開発目標（SDGs）を説明せよ。",i:[
["おもな問題と原因","地球温暖化（二酸化炭素など温室効果ガスの増加）、酸性雨（工場や自動車の排出ガス）、オゾン層の破壊（フロンガス）、砂漠化（過放牧・過耕作）、熱帯林の減少（焼畑や開発）。"],
["京都議定書","1997年、地球温暖化防止京都会議で採択。先進国に温室効果ガスの削減を義務づけたが、途上国に削減義務がなく、アメリカも離脱した。"],
["パリ協定","2015年採択。途上国を含むすべての参加国が温室効果ガスの削減目標を立てて取り組む。産業革命前からの気温上昇を2℃未満、できれば1.5℃におさえることをめざす。"],
["SDGs","2015年に国連で採択された「持続可能な開発目標」。貧困・飢餓・教育・気候変動など17の目標を2030年までに達成することをめざす。"],
["地球サミット","1992年、ブラジルのリオデジャネイロで開かれた国連環境開発会議。「持続可能な開発」を理念とし、気候変動枠組条約と生物多様性条約が調印された。京都議定書やパリ協定は、気候変動枠組条約にもとづく会議で採択された。"]]},
{c:"公民",u:"経済",t:"社会保障制度",q:"社会保障制度について、憲法上の根拠、四つの柱の内容、介護保険制度、少子高齢化による課題を説明せよ。",i:[
["憲法上の根拠","第25条の生存権（健康で文化的な最低限度の生活を営む権利）にもとづき、国が国民の生活を保障する。"],
["四つの柱","社会保険（医療保険・年金保険・雇用保険・介護保険など、保険料を積み立てて給付）、公的扶助（生活保護）、社会福祉（高齢者・障がいのある人・子どもなどへの支援）、公衆衛生（感染症予防・上下水道整備など）。"],
["介護保険制度","2000年開始。40歳以上の人が加入して保険料を納め、介護が必要になったときにサービスを受けられる。"],
["少子高齢化による課題","働く世代が減り、高齢者を支える現役世代一人あたりの負担が重くなる。年金・医療費など社会保障費が増え、財源の確保と給付とのバランスが問題になる。"]]},

/* ===== 歴史 ===== */
{c:"歴史",u:"古代",t:"大化の改新と律令国家",q:"大化の改新について、年代、中心人物、目的と改革の内容、その後の政治の流れ（大宝律令まで）を説明せよ。",i:[
["年代","645年。蘇我蝦夷・入鹿父子を倒した事件から始まる（乙巳の変）。"],
["中心人物","中大兄皇子（のちの天智天皇）と中臣鎌足（のちの藤原鎌足）。"],
["目的と改革の内容","権力をふるう蘇我氏を倒し、唐のような天皇中心の国づくりをめざした。豪族が支配していた土地と人民を国家のものとする公地・公民の方針を示した。"],
["その後の流れ","663年白村江の戦いで唐・新羅に敗れ、西日本に山城や水城を築く。天智天皇の死後、672年に壬申の乱が起こり、勝った大海人皇子が天武天皇として即位。701年、唐の律令にならった大宝律令が完成し、律令国家のしくみが整った。"]]},
{c:"歴史",u:"中世",t:"鎌倉幕府",q:"鎌倉幕府について、成立の過程、御恩と奉公、執権政治、承久の乱とその結果、御成敗式目、元寇とその影響を説明せよ。",i:[
["成立の過程","源頼朝が平氏を倒し、1185年に国ごとに守護、荘園・公領ごとに地頭を置くことを朝廷に認めさせた。1192年に征夷大将軍に任命された。"],
["御恩と奉公","将軍が御家人の領地を保護し新しい領地を与える（御恩）かわりに、御家人は京都・鎌倉の警備や戦いで命がけで働く（奉公）。土地を仲立ちとした主従関係。"],
["執権政治","頼朝の死後、源氏の将軍が3代で絶え、北条氏が執権（将軍の補佐役）として実権をにぎった。"],
["承久の乱","1221年、後鳥羽上皇が幕府を倒そうと兵をあげたが敗れた。幕府は京都に六波羅探題を置いて朝廷を監視し、上皇側の土地を取り上げて御家人に与え、支配を西国にも広げた。"],
["御成敗式目","1232年、執権北条泰時が定めた武士の最初の法律。武家社会の慣習や裁判の基準をまとめた。"],
["元寇とその影響","執権北条時宗のとき、元が1274年（文永の役）と1281年（弘安の役）に襲来。撃退したが恩賞の土地が十分に与えられず、御家人は生活に苦しんだ。幕府は1297年に徳政令を出したが効果は一時的で、御家人の不満が高まり、1333年に幕府は滅びた。"]]},
{c:"歴史",u:"中世",t:"室町幕府",q:"室町幕府について、成立、幕府のしくみ、足利義満の政治と日明貿易、応仁の乱の原因と影響を説明せよ。",i:[
["成立","後醍醐天皇の建武の新政が2年あまりでくずれ、足利尊氏が京都に別の天皇を立て、1338年に征夷大将軍になった。後醍醐天皇は吉野に移り、南北朝の対立が約60年続いた。"],
["幕府のしくみ","将軍の補佐役として管領を置き、有力な守護大名（細川・斯波・畠山氏）が交代で務めた。関東には鎌倉府を置いた。守護は権力を強めて守護大名となった。"],
["足利義満の政治","3代将軍。1392年に南北朝を統一。京都の室町に「花の御所」を建て、北山に金閣を建てた。"],
["日明貿易","義満が始めた明との貿易。倭寇と区別するため勘合という証明書を用いた（勘合貿易）。銅銭・生糸などを輸入し、刀・銅などを輸出した。"],
["応仁の乱","1467年、8代将軍足利義政の後継ぎ争いに、有力守護大名の細川氏と山名氏の対立が結びついて起こり、約11年続いた。京都は荒廃し、幕府の力は弱まった。下剋上の風潮が広がり、戦国大名が各地を支配する戦国時代となった。"]]},
{c:"歴史",u:"近世",t:"江戸幕府のしくみと鎖国",q:"江戸幕府について、成立、幕藩体制と大名の区別、大名の統制、鎖国の完成過程、鎖国中の4つの窓口を説明せよ。",i:[
["成立","徳川家康が1600年の関ヶ原の戦いに勝利し、1603年に征夷大将軍となって江戸に幕府を開いた。1615年の大阪の陣で豊臣氏を滅ぼした。"],
["幕藩体制と大名","幕府と藩（大名の領地）が全国の土地と人民を支配するしくみ。大名は、徳川一族の親藩、古くからの家臣の譜代大名、関ヶ原の戦い前後に従った外様大名に分けられ、外様は江戸から遠い地に配置された。"],
["大名の統制","武家諸法度で城の無断の修理や大名どうしの無断の結婚を禁止。3代将軍徳川家光が1635年に参勤交代を制度化し、大名に1年おきに江戸と領地を往復させ、妻子を江戸に住まわせた。大名には大きな経済的負担となった。"],
["鎖国の完成過程","キリスト教の禁止（禁教令）と貿易の統制が目的。1637年の島原・天草一揆の後、1639年にポルトガル船の来航を禁止し、1641年にオランダ商館を長崎の出島に移して完成した。絵踏みなどでキリスト教徒を取りしまった。"],
["4つの窓口","長崎（オランダ・中国）、対馬藩（朝鮮・朝鮮通信使）、薩摩藩（琉球王国）、松前藩（蝦夷地のアイヌ）。"],
["幕府の役職","将軍の下で、老中が政治全体を統括し、臨時の最高職として大老が置かれた。老中の下に大目付・町奉行・勘定奉行、将軍直属の寺社奉行、老中を補佐する若年寄などが置かれた。"],
["朱印船貿易","鎖国の前、徳川家康は大名や商人に海外渡航を許可する朱印状を与え、東南アジアとの朱印船貿易を奨励した。東南アジア各地には日本町ができた。"],
["朝鮮・琉球・アイヌとの関係","朝鮮：対馬藩の仲立ちで国交が回復し、将軍の代がわりなどに朝鮮通信使が江戸を訪れた。琉球王国：薩摩藩に支配されながら、中国（清）にも朝貢を続けた。アイヌ：松前藩との不利な交易に不満をもち、1669年にシャクシャインを中心に戦いを起こしたが敗れた。"]]},
{c:"歴史",u:"近世",t:"江戸の三大改革と田沼の政治",q:"江戸時代の政治改革について、享保の改革、田沼意次の政治、寛政の改革、天保の改革のそれぞれの中心人物と内容を説明せよ。",i:[
["享保の改革","8代将軍徳川吉宗（1716年〜）。質素・倹約、新田開発、上げ米の制（大名に米を献上させるかわりに参勤交代をゆるめる）、公事方御定書（裁判の基準）、目安箱の設置。"],
["田沼意次の政治","老中（18世紀後半）。商工業者の株仲間を奨励して税を取り、長崎貿易で海産物（俵物）の輸出を増やし、印旛沼の干拓を進めた。わいろが横行し、天明のききんなどで批判を受けて失脚した。"],
["寛政の改革","老中松平定信（1787年〜）。吉宗の政治を理想とし、倹約、ききんに備えた米のたくわえ（囲い米）、旗本・御家人の借金帳消し、朱子学以外の学問を幕府の学校で禁じた。厳しすぎて人々の反発を招いた。"],
["天保の改革","老中水野忠邦（1841年〜）。倹約令、物価を下げるための株仲間の解散、農村の立て直しのため江戸に出た農民を村に帰す。江戸・大阪周辺を幕府の直轄地にしようとして反対にあい、失敗に終わった。"]]},
{c:"歴史",u:"近代",t:"明治維新",q:"明治維新について、新政府の方針、中央集権化の改革、三大改革（学制・兵制・税制）の内容、殖産興業を説明せよ。",i:[
["新政府の方針","1868年、五箇条の御誓文で、会議を開いて世論にもとづく政治を行うことなどを示した。同年、江戸を東京と改めた。"],
["中央集権化","1869年の版籍奉還で、大名に土地（版）と人民（籍）を天皇に返させた。1871年の廃藩置県で藩を廃止して府県を置き、中央から府知事・県令を派遣した。"],
["学制","1872年。満6歳以上のすべての男女に小学校教育を受けさせることにした。"],
["徴兵令","1873年。満20歳以上の男子に兵役を義務づけた。"],
["地租改正","1873年。土地の所有者に地券を発行し、地価の3％を地租として現金で納めさせた。政府の収入が安定した。農民の反対一揆が起き、1877年に2.5％に引き下げた。"],
["殖産興業","欧米に対抗する国力をつけるため産業を育てる政策。官営模範工場の富岡製糸場（1872年、群馬県）、鉄道の開通（1872年、新橋〜横浜）など。"]]},
{c:"歴史",u:"近代",t:"大日本帝国憲法",q:"大日本帝国憲法について、制定までの流れ、発布年と起草の中心人物、手本にした国、内容の特徴、帝国議会と最初の選挙を説明せよ。",i:[
["制定までの流れ","1874年、板垣退助らが民撰議院設立の建白書を提出し、自由民権運動が始まった。1881年、政府は10年後の国会開設を約束（国会開設の勅諭）。板垣は自由党、大隈重信は立憲改進党を結成した。"],
["発布年と中心人物","1889年2月11日発布。伊藤博文がヨーロッパで憲法を調査し、草案をつくった。1885年に内閣制度をつくり、初代内閣総理大臣となった。"],
["手本にした国","君主の権力が強いドイツ（プロイセン）の憲法。"],
["内容の特徴","天皇が国の元首として主権をもつ。天皇が軍隊を統率し、条約の締結や戦争の開始・終結を行う。国民は「臣民」とされ、権利は法律の範囲内で認められた。"],
["帝国議会と最初の選挙","帝国議会は貴族院と衆議院の二院制。1890年の第1回衆議院議員選挙では、選挙権は直接国税15円以上を納める満25歳以上の男子に限られ、有権者は総人口の約1.1％だった。"]]},
{c:"歴史",u:"近代",t:"日清戦争と日露戦争",q:"日清戦争と日露戦争について、それぞれの原因、講和条約の内容、戦後の国内外への影響を説明せよ。",i:[
["日清戦争の原因","朝鮮をめぐる日本と清の対立。1894年、朝鮮で甲午農民戦争が起こり、両国が出兵して開戦した。"],
["下関条約","1895年。清は朝鮮の独立を認め、日本に遼東半島・台湾・澎湖諸島をゆずり、賠償金2億両を支払う。"],
["三国干渉","ロシア・フランス・ドイツが遼東半島を清に返すよう要求し、日本は受け入れた。ロシアへの反感が高まった。賠償金の一部で八幡製鉄所をつくった（1901年操業）。"],
["日露戦争の原因","満州・朝鮮をめぐる日本とロシアの対立。1902年に日英同盟を結び、1904年に開戦した。"],
["ポーツマス条約","1905年、アメリカの仲介で結ばれた。ロシアは韓国における日本の優越権を認め、樺太の南半分、旅順・大連の租借権、南満州の鉄道の利権を日本にゆずった。賠償金はなかった。"],
["日露戦争後の影響","多くの犠牲と増税に耐えた国民は、賠償金がないことに不満をもち、日比谷焼き打ち事件が起きた。日本は1910年に韓国を併合した。日本の勝利はアジアの民族運動を勇気づけた。"]]},
{c:"歴史",u:"近代",t:"第一次世界大戦",q:"第一次世界大戦について、対立の構図、きっかけ、日本の参戦理由と行動、戦争の終わりと講和条約、国際連盟の成立を説明せよ。",i:[
["対立の構図","三国同盟（ドイツ・オーストリア・イタリア）と三国協商（イギリス・フランス・ロシア）。バルカン半島は民族対立から「ヨーロッパの火薬庫」とよばれた。イタリアは協商国側で参戦した。"],
["きっかけ","1914年、サラエボでオーストリアの皇位継承者夫妻がセルビア人青年に暗殺された（サラエボ事件）。"],
["日本の参戦","日英同盟を理由に連合国側で参戦し、中国の山東省のドイツ租借地や太平洋のドイツ領南洋諸島を占領した。1915年、中国に二十一か条の要求を出し、大部分を認めさせた。大戦中は輸出が増えて好景気（大戦景気）となった。"],
["戦争の終わり","1917年にアメリカが参戦、ロシア革命でロシアが離脱。1918年にドイツが降伏。1919年のパリ講和会議でベルサイユ条約が結ばれ、ドイツは全植民地を失い、巨額の賠償金を課された。"],
["国際連盟","アメリカのウィルソン大統領の提案で1920年に発足。本部はスイスのジュネーブ。日本は常任理事国となったが、アメリカは議会の反対で参加しなかった。全会一致制で、武力制裁ができなかった。"]]},
{c:"歴史",u:"近代",t:"世界恐慌",q:"世界恐慌について、始まりと広がり、アメリカ・イギリスとフランス・ソ連の対応、ファシズムの台頭、日本への影響を説明せよ。",i:[
["始まりと広がり","1929年、ニューヨークの株式市場で株価が大暴落し、アメリカから世界中に不景気が広がった。企業の倒産や失業者の増加が起きた。"],
["アメリカの対応","ローズベルト大統領がニューディール政策を行った。ダムの建設など大規模な公共事業で雇用を生み、労働組合を保護した。"],
["イギリス・フランスの対応","本国と植民地の結びつきを強め、外国の商品に高い関税をかけて締め出すブロック経済を行った。"],
["ソ連","スターリンの指導のもと、計画経済（五か年計画）を進めており、世界恐慌の影響をほとんど受けなかった。"],
["ファシズムの台頭","植民地が少ないドイツ・イタリアでは、民主主義や自由主義を否定し、軍事力で対外侵略をめざすファシズムが広がった。ドイツではヒトラーのナチス、イタリアではムッソリーニのファシスト党が政権をにぎった。"],
["日本への影響","昭和恐慌となり、生糸の輸出が減って農村が大打撃を受けた。軍部が力を強め、1931年の満州事変へとつながった。"]]},
{c:"歴史",u:"現代",t:"戦後改革",q:"第二次世界大戦後の日本の民主化について、占領の体制、経済の民主化、政治の民主化、教育の民主化を説明せよ。",i:[
["占領の体制","連合国軍最高司令官総司令部（GHQ、最高司令官マッカーサー）の指令にもとづき、日本政府が政治を行う間接統治。軍隊を解散し、戦争犯罪人を処罰した（極東国際軍事裁判）。"],
["経済の民主化","財閥解体（経済を支配していた財閥を解体）。農地改革（政府が地主の小作地を買い上げて小作人に安く売り、自作農を大幅に増やした）。労働組合法などの制定で労働者の権利を保障。"],
["政治の民主化","1945年に選挙法を改正し、満20歳以上のすべての男女に選挙権を認めた（女性参政権の実現）。1946年に日本国憲法を公布した。"],
["教育の民主化","1947年に教育基本法を制定し、民主主義教育の基本を示した。義務教育を小学校6年・中学校3年の9年間とした。"]]},
{c:"歴史",u:"現代",t:"日本の独立と国際社会への復帰",q:"戦後日本の国際社会への復帰について、サンフランシスコ平和条約、日米安全保障条約、国際連合への加盟、近隣諸国との国交正常化、沖縄返還を説明せよ。",i:[
["サンフランシスコ平和条約","1951年、吉田茂内閣が48か国と結び、翌1952年に日本は独立を回復した。ソ連などは調印しなかった。冷戦や朝鮮戦争（1950年）を背景に、アメリカが日本の独立を急いだ。"],
["日米安全保障条約","平和条約と同じ日に結ばれ、独立後もアメリカ軍が日本国内に基地を置くことを認めた。1960年に改定された（安保闘争）。"],
["国際連合への加盟","1956年、日ソ共同宣言でソ連との国交を回復し、ソ連の反対がなくなったため国連加盟が実現した。北方領土問題は未解決のまま。"],
["近隣諸国との国交正常化","1965年、日韓基本条約で韓国と国交正常化。1972年、日中共同声明で中国と国交正常化し、1978年に日中平和友好条約を結んだ。"],
["沖縄返還","1972年、佐藤栄作内閣のとき沖縄が日本に復帰した。非核三原則（持たず、つくらず、持ちこませず）が示された。返還後も多くのアメリカ軍基地が残っている。"]]},

/* ===== 地理 ===== */
{c:"地理",u:"世界の地理",t:"世界の気候帯",q:"世界の気候について、5つの気候帯の名称と特色、それぞれの代表的な暮らし・植生を説明せよ。",i:[
["熱帯","一年中気温が高い。一年中雨が多い熱帯雨林気候（密林が広がる）と、雨季と乾季があるサバナ気候（まばらな樹木と草原）。高床の住居が見られる。"],
["乾燥帯","雨が少ない。砂漠気候（オアシスで農業、日干しれんがの住居）と、少し雨が降るステップ気候（短い草の草原、遊牧）。"],
["温帯","四季の変化がある。温暖湿潤気候（日本の大部分、季節風の影響）、西岸海洋性気候（偏西風と暖流の影響で冬も比較的温暖、西ヨーロッパ）、地中海性気候（夏は乾燥し冬に雨、オリーブ・ぶどう栽培）。"],
["亜寒帯（冷帯）","冬の寒さが厳しく、夏と冬の気温差が大きい。針葉樹林（タイガ）が広がる。北半球にのみ分布。永久凍土の上に高床の建物を建てる。"],
["寒帯","一年中寒い。夏に地表の氷がとけてこけ類が育つツンドラ気候と、一年中氷と雪におおわれる氷雪気候。イヌイットなどの暮らし。"],
["高山気候","気候帯とは別に、標高が高い地域（アンデス山脈など）では、同じ緯度の低地より気温が低い。リャマ・アルパカの放牧、じゃがいも栽培。"]]},
{c:"地理",u:"日本の地理",t:"日本の気候区分",q:"日本の気候について、季節風の影響、6つの気候区分それぞれの特色を説明せよ。",i:[
["季節風の影響","夏は太平洋から南東の湿った季節風（モンスーン）が吹き、太平洋側に雨が多い。冬は大陸から北西の季節風が吹き、日本海をわたるときに水蒸気をふくんで日本海側に雪を降らせる。"],
["北海道の気候","冷帯（亜寒帯）。冬の寒さが厳しく、梅雨がほとんどなく降水量が少ない。"],
["日本海側の気候","冬に北西の季節風の影響で雪が多い。"],
["太平洋側の気候","夏に南東の季節風の影響で雨が多く、冬は乾燥して晴れの日が多い。"],
["中央高地と瀬戸内の気候","中央高地（内陸性）：山に囲まれて季節風がさえぎられ、一年中降水量が少なく、夏と冬、昼と夜の気温差が大きい。瀬戸内：中国山地と四国山地に季節風がさえぎられ、一年中降水量が少なく温暖。水不足に備えてため池がつくられてきた。"],
["南西諸島の気候","亜熱帯。一年中温暖で降水量が多い。台風の通り道となる。"]]},
{c:"地理",u:"日本の地理",t:"日本の地形",q:"日本の地形について、造山帯、フォッサマグナと日本アルプス、川の特徴、扇状地と三角州、リアス海岸、周辺の海流を説明せよ。",i:[
["造山帯","日本列島は環太平洋造山帯に属し、火山が多く地震が多発する。国土の約4分の3が山地と丘陵地。"],
["フォッサマグナと日本アルプス","フォッサマグナは本州中央部を南北に横切る大きなみぞ状の地形で、日本列島を東日本と西日本に分ける。その西側に飛驒・木曽・赤石山脈（日本アルプス）がそびえる。"],
["川の特徴","大陸の川に比べて長さが短く、流れが急。流域面積も小さい。"],
["扇状地と三角州","扇状地：川が山地から平地に出る所に土砂が積もってできた扇形の地形。水はけがよく果樹園に利用される（甲府盆地など）。三角州：川が海や湖に流れこむ所に細かい土砂が積もってできた低く平らな地形。水田や都市に利用される（広島市など）。"],
["リアス海岸","山地が海に沈んでできた、出入りの複雑な海岸。湾内は波が静かで養殖業に適し、天然の良港が多い。三陸海岸、志摩半島、若狭湾など。津波の被害が大きくなりやすい。"],
["周辺の海流","暖流：太平洋側の黒潮（日本海流）、日本海側の対馬海流。寒流：太平洋側の親潮（千島海流）、日本海側のリマン海流。黒潮と親潮がぶつかる三陸沖は潮目（潮境）となり、好漁場になる。"],
["日本の川と平野","最も長い川は信濃川（長野県・新潟県）、流域面積が最も大きい川は利根川（関東地方）。おもな平野は、日本最大の関東平野、石狩平野、越後平野、濃尾平野、大阪平野など。平野の多くは川が運んだ土砂でできている。"]]},
{c:"地理",u:"世界の地理",t:"時差",q:"時差について、時差が生じるしくみ、経度と時差の関係、日本の標準時子午線、本初子午線、日付変更線、計算の手順を説明せよ。",i:[
["時差のしくみ","地球は24時間で1回転（360度）するため、場所によって太陽の南中時刻が異なり、各国・地域が基準とする標準時がずれる。"],
["経度と時差の関係","360度÷24時間＝15度。経度15度ごとに1時間の時差が生じる。東にある地域ほど時刻が進んでいる。"],
["日本の標準時子午線","東経135度（兵庫県明石市を通る）。"],
["本初子午線","経度0度の線。イギリスのロンドン（旧グリニッジ天文台）を通る。日本との時差は135÷15＝9時間で、日本の方が9時間進んでいる。"],
["日付変更線","おおむね経度180度に沿って引かれた線。西から東へこえるときは日付を1日おくらせ、東から西へこえるときは1日進める。"],

{c:"地理",u:"世界の地理",t:"ヨーロッパ連合（EU）",q:"EUについて、発足年と前身、加盟国数、統合の目的とおもな取り組み、共通通貨、統合の課題を説明せよ。",i:[

{c:"地理",u:"日本の地理",t:"日本の工業",q:"日本の工業について、太平洋ベルト、三大工業地帯の特徴、加工貿易の変化と産業の空洞化を説明せよ。",i:[

["中京工業地帯","愛知県・三重県。製造品出荷額が全国最大。豊田市を中心とした自動車工業など機械工業の割合が非常に高い。"],

["産業の分類と第三次産業","第一次産業：農業・林業・水産業。第二次産業：鉱業・工業・建設業。第三次産業：商業・運輸業・情報通信業・金融業・サービス業など。日本では働く人の約7割が第三次産業に従事している。大都市や、観光業がさかんな北海道・沖縄県で第三次産業の割合が高い。"]]},
{c:"地理",u:"世界の地理",t:"アメリカ合衆国の農業と工業",q:"アメリカ合衆国について、農業の特色（適地適作・企業的農業）、おもな農業地域、工業の中心の移り変わりを説明せよ。",i:[

{c:"地理",t:"世界の宗教",q:"世界の宗教について、仏教・キリスト教・イスラム教・ヒンドゥー教のそれぞれの開祖・成立・おもな分布・特色を説明せよ。",i:[

["キリスト教","1世紀ごろ、パレスチナ地方でイエスの教えをもとに成立。経典は聖書。ヨーロッパ、南北アメリカ、オセアニアに広がり、信者数は最も多い。日曜日に教会で礼拝する。"],
["イスラム教","7世紀にアラビア半島でムハンマドが開いた。経典はコーラン。西アジア・北アフリカ・中央アジア・東南アジア（インドネシア・マレーシア）に分布。1日5回聖地メッカに向かって祈る、ラマダン（断食月）、豚肉を食べず酒を飲まない。食べてよいとされる食品はハラール。"],

["三大宗教","民族や地域をこえて広く信仰されている仏教・キリスト教・イスラム教を世界の三大宗教という。"]]},
{c:"地理",t:"中国",q:"中国について、人口と民族、一人っ子政策、経済特区と経済発展、沿海部と内陸部の格差、農業の地域差を説明せよ。",i:[

["一人っ子政策","人口増加をおさえるため1979年から始めた、夫婦の子どもを原則1人とする政策。少子高齢化が進んだため2015年に廃止された。"],
["経済特区","1979年ごろから、シェンチェン（深圳）など沿海部に外国企業をよびこむために設けた地区。税金を安くするなどして外国の資本と技術を取り入れ、中国は「世界の工場」とよばれるまで工業が発展した。"],
["沿海部と内陸部の格差","工業化した沿海部の都市と内陸部の農村の間で所得の格差が大きく、内陸部から沿海部へ多くの人が出かせぎに行く。政府は西部大開発で内陸部の開発を進めた。大気汚染などの環境問題も深刻。"],

{c:"地理",t:"東南アジア",q:"東南アジアについて、気候と農業（稲作・プランテーション）、宗教の分布、華人、工業化の進展、ASEANを説明せよ。",i:[

["宗教の分布","タイ・ミャンマーなどは仏教、インドネシア・マレーシアはイスラム教、フィリピンはキリスト教（スペインの植民地だったため）。"],
["華人","中国から移り住んだ人々とその子孫。シンガポールでは人口の約4分の3を占め、各国の経済で大きな役割を果たしている。"],

{c:"地理",t:"南アジアと西アジア",q:"インドの宗教と社会、ICT産業が発達した理由、インドの農業、西アジアの石油資源とOPEC、西アジアの生活と課題を説明せよ。",i:[

["インドの農業","ガンジス川下流など降水量の多い地域で稲作、少ない地域で小麦や綿花。アッサム地方などで茶の栽培。"],

{c:"地理",t:"ヨーロッパの自然と農業",q:"ヨーロッパについて、気候の特色とその理由、地形、三つの農業（混合農業・地中海式農業・酪農）、言語と宗教の分布を説明せよ。",i:[

["地形","北部のスカンディナビア半島には氷河にけずられてできたフィヨルド。南部にアルプス山脈。ライン川は複数の国を流れ、外国の船も自由に航行できる国際河川。"],

["地中海式農業","夏の乾燥に強いオリーブ・ぶどう・オレンジなどを夏に栽培し、雨の多い冬に小麦を栽培する。イタリア・スペインなど地中海沿岸。"],

["言語と宗教","北西部はゲルマン系言語（英語・ドイツ語）でプロテスタント、南部はラテン系言語（フランス語・イタリア語・スペイン語）でカトリック、東部はスラブ系言語（ロシア語・ポーランド語）で正教会が多い。"]]},
{c:"地理",t:"アフリカ",q:"アフリカについて、植民地支配の歴史と国境線、モノカルチャー経済の意味と問題点、おもな輸出品、かかえる課題とその解決への取り組みを説明せよ。",i:[

["課題","急速な人口増加、食料不足、都市のスラム、サヘル（サハラ砂漠の南の縁）の砂漠化、紛争と難民。南アフリカ共和国ではアパルトヘイト（人種隔離政策）が1991年に廃止された。"],
["解決への取り組み","アフリカ連合（AU、2002年）による地域の協力、先進国のODA（政府開発援助）やNGOの支援、フェアトレード。"],
["アフリカの自然と農業","北部に世界最大のサハラ砂漠、東部に世界最長のナイル川が流れる。赤道付近にはアフリカ最高峰のキリマンジャロ山（山頂は雪におおわれる）、コンゴ川流域には熱帯雨林が広がる。赤道を中心に南北へ、熱帯→乾燥帯→温帯の順に気候が分布する。焼畑農業や乾燥地域での遊牧が行われる。16世紀以降の奴隷貿易で、多くの人々が南北アメリカ大陸に連れ去られた。"]]},
{c:"地理",t:"南アメリカ",q:"南アメリカについて、地形と自然、植民地の歴史と言語・民族、ブラジルの農業と鉱業、アマゾンの開発と環境問題を説明せよ。",i:[
["地形と自然","西部に高いアンデス山脈。流域面積が世界最大のアマゾン川が流れ、流域に熱帯雨林が広がる。アルゼンチンにはパンパとよばれる草原があり、小麦の栽培や牛の放牧がさかん。"],
["歴史と言語","かつてはインカ帝国などが栄えたが、16世紀からスペインとポルトガルが植民地にした。ブラジルはポルトガル語、そのほかの多くの国はスペイン語が公用語。キリスト教（カトリック）の信者が多い。"],
["民族","先住民、ヨーロッパ系、アフリカから奴隷として連れてこられた人々の子孫、先住民とヨーロッパ系の混血の人々（メスチソ）など。ブラジルには日本からの移民の子孫（日系人）が多い。"],
["ブラジルの産業","コーヒー、大豆、さとうきびの生産が多い。さとうきびからは自動車の燃料になるバイオエタノール（バイオ燃料）をつくる。鉄鉱石の産出が多く、日本にも輸出している。"],
["アマゾンの開発と環境","道路建設や鉱山開発、農地・牧場の拡大で熱帯林の伐採が進み、地球温暖化や生態系の破壊が心配されている。伝統的には森林を焼いた灰を肥料にする焼畑農業が行われてきた。"],
["地形と経済","アマゾン川の北にギアナ高地、南東にブラジル高原がある。南部のラプラタ川流域にパンパが広がる。ヨーロッパ系とアフリカ系の混血の人々をムラートという。ブラジルは急速に経済成長したBRICS（ブラジル・ロシア・インド・中国・南アフリカ共和国）の一つ。一方、特定の農産物や鉱産資源の輸出に頼るモノカルチャー経済の国も多い。"]]},
{c:"地理",t:"オセアニア",q:"オーストラリアについて、自然、先住民と移民の歴史（白豪主義から多文化主義へ）、農業と鉱業、貿易相手の変化を説明せよ。",i:[
["自然","大陸の大部分が乾燥帯で、内陸に砂漠が広がる。人口は降水量の多い南東部と南西部の沿岸に集中している。"],
["先住民と移民","先住民はアボリジニ。18世紀末からイギリスの植民地となり、ヨーロッパからの移民が増えた。"],
["白豪主義から多文化主義へ","かつてはヨーロッパ系以外の移民を制限する白豪主義をとっていたが、1970年代に廃止。アジアなどからの移民が増え、さまざまな文化を尊重し合う多文化主義（多文化社会）をめざしている。"],
["農業と鉱業","羊（南東部・南西部）や牛（北東部）の放牧、小麦の栽培がさかん。北西部で鉄鉱石、東部で石炭を産出し、地表をけずって掘る露天掘りで採掘する。日本は鉄鉱石・石炭・液化天然ガスの多くをオーストラリアから輸入している。"],
["貿易相手の変化","かつてはイギリスが最大の貿易相手だったが、現在は中国・日本などアジアの国々との結びつきが強い。APEC（アジア太平洋経済協力）にも参加。ニュージーランドの先住民はマオリ。"],
["太平洋の島々と地形","オーストラリア大陸以外の太平洋の島々は、ミクロネシア・メラネシア・ポリネシアに分けられる。火山島とさんご礁の島が多く、地球温暖化による海面上昇で水没が心配される国もある（ツバルなど）。オーストラリアの東部にはグレートディバイディング山脈、北東岸の沖には世界最大のさんご礁グレートバリアリーフがある。"]]},
{c:"地理",t:"日本の領域",q:"日本の領域について、領土・領海・領空、排他的経済水域、日本の東西南北の端、領土をめぐる問題を説明せよ。",i:[
["領域","国の主権がおよぶ範囲。領土・領海・領空からなる。日本の国土面積は約38万km²。"],
["領海と領空","領海は海岸線から12海里（約22km）以内の海。領空は領土と領海の上空（大気圏内）。"],
["排他的経済水域","海岸線から200海里（約370km）以内の、領海を除く水域。沿岸国が水産資源や海底の鉱産資源を利用する権利をもつ。日本は離島が多いため、排他的経済水域の面積が国土面積の10倍以上ある。"],
["東西南北の端","東端：南鳥島（東京都）、西端：与那国島（沖縄県）、南端：沖ノ鳥島（東京都、水没を防ぐ護岸工事が行われた）、北端：択捉島（北海道）。"],
["北方領土","歯舞群島・色丹島・国後島・択捉島。日本固有の領土だが、ロシア（旧ソ連）が不法に占拠している。"],
["竹島と尖閣諸島","竹島（島根県）は日本固有の領土だが、韓国が不法に占拠している。尖閣諸島（沖縄県）は日本が実効支配する固有の領土で、中国などが領有権を主張しているが、日本政府は解決すべき領土問題は存在しないという立場。"]]},
{c:"地理",t:"地形図の読み方",q:"地形図について、縮尺と実際の距離の求め方、等高線の種類と読み取り方、方位、おもな地図記号を説明せよ。",i:[
["縮尺","実際の距離を地図上に縮めた割合。国土地理院の2万5千分の1や5万分の1の地形図がある。分母が小さいほど、狭い範囲をくわしく表す。"],
["実際の距離の求め方","地図上の長さ×縮尺の分母。例：2万5千分の1の地形図で4cm→4cm×25000＝100000cm＝1km。"],
["等高線","同じ高さの地点を結んだ線。2万5千分の1では細い主曲線が10mごと、太い計曲線が50mごと。5万分の1では主曲線20mごと、計曲線100mごと。間隔がせまいほど傾斜が急、広いほどゆるやか。"],
["尾根と谷","等高線が高い方から低い方へ張り出している所が尾根、低い方から高い方へ入りこんでいる所が谷。"],
["方位","特にことわりがなければ、地図の上が北。"],
["おもな地図記号","田（Ⅱ）、畑（Ⅴ）、果樹園、茶畑、広葉樹林・針葉樹林、市役所（◎）、町村役場（○）、警察署、交番、消防署、郵便局（〒）、小・中学校（文）、高等学校、病院、寺（卍）、神社（鳥居の形）、図書館、博物館、老人ホーム、自然災害伝承碑など。"]]},
{c:"地理",t:"日本の人口",q:"日本の人口について、人口ピラミッドの型の変化、少子高齢化の現状と影響、過密と過疎それぞれの問題と対策を説明せよ。",i:[
["人口の推移","日本の人口は約1億2千万人台。2008年ごろをピークに減少が続いている。"],
["人口ピラミッドの型","出生率も死亡率も高い富士山型（多くの発展途上国）→出生率・死亡率が低下したつりがね型→子どもが少なく高齢者が多いつぼ型。日本は現在つぼ型。"],
["少子高齢化","平均寿命がのび、出生率が低下したため、子どもの割合が減り、65歳以上の高齢者が人口の約3割を占める。働く世代の減少や、年金・医療など社会保障の負担増が問題になる。"],
["過密","東京・大阪・名古屋の三大都市圏に人口が集中。交通渋滞、住宅不足、ごみ問題、大気汚染などが起きる。"],
["過疎","山間部や離島では若い人が都市に流出して人口が減り、高齢化が進む。学校や病院の閉鎖、公共交通の廃止など、地域の社会生活を保つのが難しくなる。地域の特産品や観光を生かした町おこし・村おこし、都市から移り住むUターン・Iターンなどの取り組みがある。"],
["世界の人口","世界の人口は約80億人（2022年に80億人をこえた）。アジアやアフリカの発展途上国で急激に増加しており（人口爆発）、食料不足や都市のスラムなどの問題が起きている。一方、先進国では少子高齢化が進んでいる。人口が最も多い国はインド、次いで中国。"]]},
{c:"地理",t:"日本の資源とエネルギー",q:"日本の資源・エネルギーについて、鉱産資源の輸入先、発電方法ごとの特色と立地、再生可能エネルギーの長所と課題を説明せよ。",i:[
["鉱産資源の輸入","日本は鉱産資源が少なく、大部分を輸入に頼る。原油はサウジアラビア・アラブ首長国連邦など西アジアから。石炭・鉄鉱石・液化天然ガスはオーストラリアからの輸入が多い。"],
["火力発電","発電量の約7割を占める。燃料の輸入に便利で電力の消費地に近い、大都市周辺の臨海部に多い。二酸化炭素を多く出し、燃料は限りがある。"],
["水力発電","山間部のダムを利用。二酸化炭素を出さないが、建設できる場所が限られる。かつては日本の発電の中心だった。"],
["原子力発電","少ない燃料で大量の電力をつくれ、発電時に二酸化炭素を出さない。海沿いの地域に立地。2011年の福島第一原子力発電所の事故後、安全性が大きな課題となり、多くが運転を停止した。放射性廃棄物の処理も課題。"],
["再生可能エネルギー","太陽光、風力、地熱（九州・東北に多い）、バイオマスなど。くり返し利用でき、温室効果ガスをほとんど出さない。一方、天候に左右され発電量が安定しない、発電費用が高いなどの課題がある。"]]},
{c:"地理",t:"日本の農業",q:"日本の農業について、稲作の特色、近郊農業、促成栽培と抑制栽培、畜産の地域、日本の農業がかかえる課題を説明せよ。",i:[
["稲作","東北地方や北陸地方が「日本の穀倉地帯」。品種改良でブランド化した銘柄米をつくる。米の消費量が減り、かつては生産量を減らす生産調整（減反政策）が行われた。"],
["近郊農業","大都市の周辺で、都市向けに新鮮な野菜や花などを栽培する。輸送費が安く、新鮮なうちに届けられる。千葉県・茨城県など。"],
["促成栽培","温暖な気候とビニールハウスを利用し、ほかの産地より早い時期に出荷する。高知平野や宮崎平野のなす・ピーマン・きゅうり。高い値段で売れる。"],
["抑制栽培","夏でもすずしい高原の気候を利用し、ほかの産地より遅い時期に出荷する。長野県や群馬県のレタス・キャベツ（高原野菜）。愛知県渥美半島の電照菊も、夜に照明を当てて開花を遅らせる抑制栽培。"],
["畜産","北海道の根釧台地の酪農、鹿児島県・宮崎県の豚・肉用牛・肉用にわとり（ブロイラー）。"],
["課題","農業で働く人の高齢化と後継者不足、外国産の安い農産物の輸入増加。食料自給率はカロリーベースで約4割と、先進国の中で低い。対策として大規模化、ブランド化、6次産業化（生産・加工・販売を一体で行う）などが進められている。"],
["林業と地産地消","国土の約3分の2が森林。安い輸入木材の増加や林業で働く人の高齢化で、国内の林業はおとろえた。森林には水をたくわえる、土砂災害を防ぐ、二酸化炭素を吸収するなどの働きがある。地域で生産したものをその地域で消費する地産地消は、新鮮な食品を届け、輸送のエネルギーを減らし、地域の経済を活性化させる。"]]},
{c:"地理",t:"日本の水産業",q:"日本の水産業について、漁業の種類、遠洋漁業がおとろえた理由、育てる漁業（養殖業と栽培漁業）のちがい、よい漁場の条件を説明せよ。",i:[
["漁業の種類","遠洋漁業（遠くの海で長期間）、沖合漁業（日本近海で数日がかり）、沿岸漁業（日帰りできる近くの海）。"],
["遠洋漁業の衰退","1970年代に各国が200海里の排他的経済水域を設定し、外国の水域で自由にとれなくなったため。石油危機による燃料費の値上がりも影響した。"],
["水産物の輸入","漁獲量の減少と消費の多様化で、えび・まぐろ・さけなどの輸入が増えた。"],
["養殖業","いけすなどで魚や貝を卵や稚魚から大きくなるまで育てて出荷する。広島県のかき、ほたて、のり、ぶり、真珠など。"],
["栽培漁業","卵からふ化させた稚魚・稚貝をある程度まで育てたあと、海や川に放流し、自然の中で成長したものをとる。さけなど。"],
["よい漁場の条件","暖流と寒流がぶつかる潮目（潮境）はプランクトンが豊富で魚が集まる（三陸沖）。水深200mくらいまでの浅い海底が続く大陸棚（東シナ海など）もよい漁場。漁場を守るため、川の上流の森林を育てる取り組みもある。"]]},
{c:"地理",t:"日本の交通と通信",q:"日本の交通・通信について、旅客輸送と貨物輸送の特色、航空輸送と海上輸送で運ばれるもののちがい、高速交通網の発達による変化、情報通信の発達と課題を説明せよ。",i:[
["国内の輸送","旅客・貨物とも自動車による輸送の割合が最も大きい。旅客では大都市圏を中心に鉄道の割合も大きい。"],
["航空輸送","軽くて値段が高いもの、急ぐものを運ぶ。IC（集積回路）などの電子部品、医薬品、生鮮品など。成田国際空港は、日本の港の中で貿易額が最大。"],
["海上輸送","重くてかさばるものを大量に安く運ぶ。原油・石炭・鉄鉱石・自動車など。タンカーやコンテナ船を使う。"],
["高速交通網","新幹線・高速道路・空港の整備で移動時間が大幅に短くなった。高速道路のインターチェンジ付近には工業団地や物流センターがつくられた。一方で、大都市に人や物が吸い寄せられるストロー現象も起きる。"],
["情報通信","光ファイバーなどの通信網と、インターネット・スマートフォンが普及した。インターネットを利用できる人とできない人の情報格差（デジタルデバイド）や、個人情報の流出などが課題。"]]},
{c:"地理",t:"九州地方",q:"九州地方について、火山と自然、南部と北部の農業のちがい、工業の移り変わり、公害の克服と環境への取り組み、沖縄県の特色を説明せよ。",i:[
["火山と自然","阿蘇山には世界最大級のカルデラ（噴火でできた大きなくぼ地）がある。桜島・雲仙岳など火山が多く、温泉や地熱発電に利用される。南部には火山灰が積もったシラス台地が広がる。"],
["南部の農業","シラス台地は水もちが悪く稲作に向かないため、さつまいもや茶の栽培、豚・肉用牛・肉用にわとりの畜産がさかん。宮崎平野では温暖な気候を生かしたピーマン・きゅうりの促成栽培。"],
["北部の農業","筑紫平野では稲作がさかんで、稲を収穫したあとに小麦などをつくる二毛作が行われる。"],
["工業の移り変わり","1901年に操業を始めた官営の八幡製鉄所を中心に、北九州工業地帯（地域）が鉄鋼業で発達した。エネルギー革命で石炭から石油に変わると地位が低下。現在はIC（集積回路）工場が多く「シリコンアイランド」とよばれ、自動車工場も多い。"],
["公害の克服と環境","熊本県水俣市で水俣病が発生した。水俣市は環境モデル都市に選ばれ、北九州市もエコタウンでリサイクル産業を育てるなど、環境に配慮したまちづくりを進めている。"],
["沖縄県","かつては琉球王国として独自の文化が栄えた。第二次世界大戦後アメリカに統治され、1972年に日本に復帰。日本にあるアメリカ軍専用施設の面積の約7割が集中する。観光業がさかんで、さとうきび・パイナップル・菊などを栽培する。"]]},
{c:"地理",t:"中国・四国地方",q:"中国・四国地方について、三つの地域の気候のちがい、本州四国連絡橋とその影響、瀬戸内工業地域、地域の農業・水産業、過疎と地域おこしを説明せよ。",i:[
["三つの地域の気候","山陰：冬に北西の季節風の影響で雪や雨が多い。瀬戸内：中国山地と四国山地にはさまれ季節風がさえぎられるため、一年中降水量が少なく温暖。水不足に備えて讃岐平野などにため池が多い。南四国：夏に南東の季節風と黒潮の影響で雨が多く温暖。"],
["本州四国連絡橋","神戸・鳴門ルート（明石海峡大橋・大鳴門橋）、児島・坂出ルート（瀬戸大橋、1988年）、尾道・今治ルート（瀬戸内しまなみ海道）の3ルート。移動時間が短くなり人や物の行き来が増えた一方、買い物客などが大都市に吸い寄せられるストロー現象が起きた。"],
["瀬戸内工業地域","塩田のあと地や埋め立て地を利用し、海上輸送に便利な臨海部に工業が発達した。倉敷市水島地区などの石油化学コンビナート、福山市の鉄鋼業。"],
["農業","高知平野ではなす・ピーマンの促成栽培。愛媛県の日当たりのよい斜面でみかん。鳥取県の砂丘ではらっきょう・メロン、鳥取県のなし。"],
["水産業","広島湾のかきの養殖、愛媛県のまだい・真珠の養殖。"],
["過疎と地域おこし","山間部や離島で過疎化・高齢化が進む。徳島県上勝町では、料理にそえる葉や花を「つまもの」として出荷する事業で、高齢者が活躍している。"]]},
{c:"地理",t:"近畿地方",q:"近畿地方について、琵琶湖と水環境の保全、紀伊山地の林業、大阪大都市圏の発達と阪神工業地帯、古都の景観保全を説明せよ。",i:[
["琵琶湖","日本最大の湖。淀川を通じて京都・大阪・神戸など近畿地方の人々の生活用水を支え、「近畿の水がめ」とよばれる。"],
["水環境の保全","1970年代に生活排水が原因で赤潮が発生した。滋賀県は、りんをふくむ合成洗剤の使用を禁止する条例を定め、住民も石けんを使う運動を進めた。"],
["紀伊山地の林業","温暖で雨が多く、すぎやひのきが育ちやすい。奈良県の吉野すぎ、三重県の尾鷲ひのきが有名。高齢化や後継者不足、安い輸入木材が課題。和歌山県ではみかん・うめの栽培もさかん。"],
["大阪大都市圏","江戸時代は「天下の台所」とよばれた商業の中心で、今も卸売業がさかん。人口増加に対応するため、郊外に千里ニュータウンなどがつくられた。臨海部では再開発が進み、関西国際空港もつくられた。"],
["阪神工業地帯","大阪湾の臨海部の鉄鋼・石油化学工業と、東大阪市などに集まる高い技術をもつ中小工場が特色。"],
["古都の景観保全","京都・奈良には多くの文化財があり世界遺産にも登録されている。京都市は景観条例で建物の高さやデザイン、看板の色や大きさなどを制限し、古い町並みを守っている。西陣織・清水焼などの伝統的工芸品も受けつがれている。"]]},
{c:"地理",t:"中部地方",q:"中部地方について、東海・中央高地・北陸の三つの地域それぞれの農業と工業の特色を説明せよ。",i:[
["東海の工業","中京工業地帯は豊田市を中心とする自動車工業が発達し、製造品出荷額が全国最大。静岡県の東海工業地域では、浜松市のオートバイ・楽器、富士市の製紙・パルプ工業。"],
["東海の農業・漁業","渥美半島の電照菊などの施設園芸、静岡県の牧ノ原の茶、みかん。焼津港はまぐろ・かつおの遠洋漁業の基地。"],
["中央高地の農業","甲府盆地の扇状地でぶどう・もも、長野盆地でりんご。八ヶ岳山ろくの野辺山原などで、夏のすずしい気候を利用したレタスなど高原野菜の抑制栽培。"],
["中央高地の工業","諏訪湖周辺では、きれいな空気と水を生かして時計やカメラなどの精密機械工業が発達し、現在は電子部品工業もさかん。"],
["北陸の農業","冬は雪が多く農作業ができないため、水田単作地帯。越後平野などで銘柄米（コシヒカリなど）の生産がさかん。"],
["北陸の地場産業","冬の農家の副業から発達した伝統産業・地場産業が多い。輪島塗（石川県）、小千谷ちぢみ（新潟県）、鯖江市の眼鏡フレーム（福井県）、燕市の金属洋食器（新潟県）など。"]]},
{c:"地理",t:"関東地方",q:"関東地方について、関東平野の自然、首都東京への一極集中とその問題、都市の再開発、三つの工業地帯・地域、近郊農業と高原野菜を説明せよ。",i:[
["自然","日本最大の関東平野が広がり、台地は火山灰が積もった関東ロームにおおわれる。流域面積が日本最大の利根川が流れる。"],
["東京への一極集中","首都東京には国会・中央官庁や大企業の本社、大学、マスメディアなどが集中する。周辺から通勤・通学する人が多いため、東京の都心部では昼間人口が夜間人口より多い。"],
["都市の問題と再開発","交通渋滞、通勤ラッシュ、住宅不足、ヒートアイランド現象など。都市機能を分散させるため、新宿・渋谷・池袋などの副都心、横浜みなとみらい21、さいたま新都心、幕張新都心がつくられた。郊外には多摩ニュータウンなど。"],
["工業","京浜工業地帯（東京・神奈川、情報が集まる東京で印刷業がさかん）、京葉工業地域（千葉県の東京湾岸、石油化学・鉄鋼）、北関東工業地域（群馬・栃木・茨城、高速道路沿いの工業団地で自動車・電気機械。外国人労働者も多い）。"],
["農業","千葉県・茨城県などで大都市向けの野菜を栽培する近郊農業。群馬県嬬恋村ではすずしい高原の気候を生かしたキャベツの抑制栽培。"],
["気候と交通","冬には北西から冷たく乾いた季節風（からっ風）が吹く。東京を中心に鉄道や高速道路が放射状にのびている。東京港・横浜港は大きな貿易港で、成田国際空港は日本最大の貿易港（貿易額）、羽田空港（東京国際空港）は国内線の中心。"]]},
{c:"地理",t:"東北地方",q:"東北地方について、地形と気候（やませ）、三陸海岸の漁業、稲作と果樹栽培、伝統行事と伝統的工芸品、工業の変化と東日本大震災からの復興を説明せよ。",i:[
["地形と気候","中央に奥羽山脈が南北に走る。夏に太平洋側に吹く冷たく湿った北東風をやませといい、日照不足や低温による冷害の原因になる。"],
["三陸海岸の漁業","リアス海岸で湾内の波が静かなため、わかめ・かき・ほたてなどの養殖がさかん。沖合は暖流（黒潮）と寒流（親潮）がぶつかる潮目で、よい漁場。八戸港・気仙沼港など。"],
["稲作","日本の穀倉地帯。庄内平野・秋田平野・仙台平野などで、冷害に強い品種や銘柄米の開発が進められた（はえぬき、あきたこまち、ひとめぼれなど）。"],
["果樹栽培","青森県津軽平野のりんご、山形盆地のさくらんぼ・西洋なし、福島盆地のもも。"],
["伝統行事と工芸品","夏祭り：青森ねぶた祭、秋田竿燈まつり、仙台七夕まつり（東北三大祭り）。冬の農家の副業から発達した伝統的工芸品：南部鉄器（岩手県）、天童将棋駒（山形県）、津軽塗、会津塗など。"],
["工業と震災からの復興","高速道路の整備でインターチェンジ付近に電子部品などの工業団地がつくられた。2011年の東日本大震災では津波や原子力発電所の事故で大きな被害を受け、防潮堤や高台への移転など復興が進められている。"]]},
{c:"地理",t:"北海道地方",q:"北海道地方について、気候の特色、開拓の歴史とアイヌの人々、石狩平野・十勝平野・根釧台地の農業、漁業の変化、観光を説明せよ。",i:[
["気候","冷帯（亜寒帯）で冬の寒さが厳しく、梅雨がほとんどない。太平洋側は夏に寒流（親潮）の影響で濃霧が発生し、気温が上がりにくい。オホーツク海沿岸には冬に流氷がおし寄せる。"],
["開拓とアイヌの人々","明治時代に政府が開拓使を置き、屯田兵などによって開拓が進められた。先住民族のアイヌの人々は土地や伝統的な生活を奪われた。地名にはアイヌ語に由来するものが多い。2019年の法律でアイヌ民族は先住民族と明記された。"],
["石狩平野","もとは泥炭地で稲作に向かなかったが、ほかの土地から性質のよい土を運び入れる客土や排水によって、日本有数の稲作地帯になった。"],
["十勝平野","大規模な畑作地帯。じゃがいも・てんさい・小麦・豆類などを年ごとに順番にかえて栽培する輪作で、地力の低下を防ぐ。"],
["根釧台地","冷涼で畑作に向かないため、酪農がさかん。牛乳はバター・チーズなどの乳製品に加工されることが多い。"],
["漁業と観光","かつては北洋漁業がさかんだったが、各国の200海里水域の設定でおとろえた。現在はほたての養殖やさけの栽培漁業に力を入れる。観光では、さっぽろ雪まつりや、世界自然遺産の知床でのエコツーリズムが行われている。"]]},

/* ===== 歴史（追加） ===== */
{c:"歴史",t:"古代文明",q:"古代文明について、四大文明それぞれの発生した川・文字・特色と、四つの文明に共通する点を説明せよ。",i:[
["エジプト文明","ナイル川流域。象形文字（神聖文字）、太陽暦、ピラミッド。川の氾濫の時期を知るために天文学や測量術が発達した。"],
["メソポタミア文明","チグリス川・ユーフラテス川流域。くさび形文字、月の満ち欠けにもとづく太陰暦、60進法、ハンムラビ法典。"],
["インダス文明","インダス川流域。インダス文字（未解読）。モヘンジョ・ダロなど計画的につくられた都市遺跡。"],
["中国文明","黄河・長江流域。紀元前1600年ごろに殷がおこり、うらないの結果を記録した甲骨文字（漢字のもと）、青銅器がつくられた。"],
["共通点","大河の流域で農耕・牧畜が発達し、食料が安定して得られた。かんがい（水路）工事などを指導する王が生まれて国家ができ、文字や青銅器が使われた。"]]},
{c:"歴史",t:"縄文時代と弥生時代",q:"縄文時代と弥生時代について、それぞれの暮らしと道具、稲作の伝来による社会の変化、中国の歴史書に記された日本のようす（奴国・邪馬台国）を説明せよ。",i:[
["縄文時代の暮らし","約1万数千年前から。狩り・漁・採集で暮らし、縄目の文様がある縄文土器を使った。竪穴住居に住み、食べ物の残りかすを捨てた貝塚が残る。まじないに使ったとされる土偶もつくられた。"],
["稲作の伝来","紀元前4世紀ごろ、大陸から稲作が九州北部に伝わり、やがて東日本まで広がった。"],
["弥生時代の暮らしと道具","うすくてかたい弥生土器、稲の穂をつみ取る石包丁、米をたくわえる高床倉庫。青銅器（銅鐸など、祭りに使用）や鉄器も伝わった。"],
["社会の変化","米をたくわえることで貧富の差や身分の差が生まれた。土地や水をめぐる争いが起き、ムラがまとまってクニができた。吉野ヶ里遺跡（佐賀県）には周りを堀や柵で囲んだ集落の跡がある。"],
["奴国","『後漢書』東夷伝：57年、倭の奴国の王が後漢に使いを送り、皇帝から金印を授けられた。福岡県の志賀島で「漢委奴国王」と刻まれた金印が見つかっている。"],
["邪馬台国","『魏志』倭人伝：3世紀、女王卑弥呼が30ほどの国を従え、まじないで政治を行った。239年に魏に使いを送り、「親魏倭王」の称号と金印、銅鏡などを授けられた。"]]},
{c:"歴史",t:"古墳時代とヤマト王権",q:"古墳時代について、古墳の種類と代表例、ヤマト王権の成立と支配の広がり、渡来人が伝えたものを説明せよ。",i:[
["古墳","3世紀後半から、各地の王や豪族の墓として古墳がつくられた。円墳・方墳もあるが、日本独自の形の前方後円墳が特徴的。最大のものは大阪府堺市の大仙古墳（仁徳天皇陵とされる）。古墳の上や周りには埴輪が並べられた。"],
["ヤマト王権","奈良盆地を中心とする有力な豪族の連合政権。王は大王とよばれた。"],
["支配の広がり","埼玉県の稲荷山古墳から出土した鉄剣と、熊本県の江田船山古墳から出土した鉄刀に「ワカタケル大王」の名が刻まれており、5世紀には九州から関東まで支配が広がっていたことがわかる。"],
["渡来人","朝鮮半島などから日本に移り住んだ人々。漢字、儒教、仏教（6世紀半ばに百済から伝来）、かたい須恵器をつくる技術、機織り、土木技術などを伝えた。"]]},
{c:"歴史",t:"聖徳太子の政治",q:"聖徳太子（厩戸皇子）の政治について、立場と協力者、冠位十二階、十七条の憲法、遣隋使、飛鳥文化を説明せよ。",i:[
["立場と協力者","593年、おばの推古天皇の摂政（あるいは天皇を補佐する立場）となり、大臣の蘇我馬子と協力して、天皇中心の政治をめざした。"],
["冠位十二階","603年。家柄にとらわれず、才能や功績のある人を役人に取り立てるため、冠の色で12の位を区別した。"],
["十七条の憲法","604年。仏教や儒教の考え方を取り入れ、天皇の命令に従うことなど、役人の心構えを示した。"],
["遣隋使","607年、小野妹子らを隋に派遣。対等な立場での国交をめざし、隋の進んだ制度や文化を取り入れようとした。留学生や僧も同行した。"],
["飛鳥文化","日本で最初の仏教文化。法隆寺（現存する世界最古の木造建築）、釈迦三尊像など。"]]},
{c:"歴史",t:"奈良時代の政治と文化",q:"奈良時代について、平城京、班田収授法、農民の負担、墾田永年私財法とその影響、聖武天皇の政治、天平文化を説明せよ。",i:[
["平城京","710年、唐の都長安にならって奈良につくられた都。碁盤の目のように道路が区切られ、市では和同開珎などの貨幣も使われた。"],
["班田収授法","戸籍にもとづき、6歳以上の男女に口分田を与え、死ぬと国に返させた。"],
["農民の負担","租（収穫した稲の約3％）、調（絹・糸や地方の特産物を都に納める）、庸（労役の代わりに布を納める）、雑徭（地方での労役）、兵役（一部は九州北部を守る防人）。負担が重く、逃亡する農民もいた。"],
["墾田永年私財法","743年。人口増加で口分田が不足したため、新しく開墾した土地の永久的な私有を認めた。貴族や寺社が私有地を広げ、のちの荘園のもとになった。公地・公民の原則がくずれ始めた。"],
["聖武天皇の政治","伝染病や反乱など社会の不安が続いたため、仏教の力で国を守ろうとした。国ごとに国分寺・国分尼寺を建て、都に東大寺と大仏をつくった。行基が大仏づくりに協力した。"],
["天平文化","遣唐使がもたらした唐の文化の影響を受けた国際色豊かな仏教文化。東大寺の正倉院には聖武天皇の遺品が納められている。『古事記』『日本書紀』『風土記』『万葉集』がつくられた。"]]},
{c:"歴史",t:"平安時代と摂関政治",q:"平安時代について、平安京遷都と桓武天皇の政治、摂関政治のしくみと全盛期、国風文化、浄土信仰を説明せよ。",i:[
["平安京遷都","794年、桓武天皇が京都に都を移した。政治に口を出す仏教勢力から離れ、律令政治を立て直すため。"],
["桓武天皇の政治","坂上田村麻呂を征夷大将軍に任命し、東北地方の蝦夷を従わせた。"],
["摂関政治","藤原氏が娘を天皇のきさきにし、生まれた子を天皇に立てて、天皇が幼いときは摂政、成人後は関白として政治の実権をにぎった。11世紀前半の藤原道長・頼通父子のときに全盛期をむかえた。"],
["国風文化","894年、菅原道真の提案で遣唐使が停止された。唐の文化をもとに、日本の風土や生活に合った文化が発達した。かな文字がつくられ、紫式部の『源氏物語』、清少納言の『枕草子』などが書かれた。貴族の住居は寝殿造。"],
["浄土信仰","阿弥陀仏を信じ、念仏を唱えて死後に極楽浄土に生まれ変わることを願う。藤原頼通が建てた平等院鳳凰堂（京都府宇治市）が代表。"],
["平安時代の仏教と文学","最澄は比叡山に延暦寺を建てて天台宗を、空海は高野山に金剛峯寺を建てて真言宗を広めた（ともに遣唐使とともに唐で学んだ）。紀貫之らが最初の勅撰和歌集である『古今和歌集』をまとめ、日本の風景などをえがく大和絵も発達した。"]]},
{c:"歴史",t:"院政と平氏の政治",q:"平安時代後半について、武士の成長、院政、保元の乱と平治の乱、平清盛の政治、平氏の滅亡を説明せよ。",i:[
["武士の成長","地方の豪族や有力農民が武装し、武士団をつくった。10世紀に関東で平将門、瀬戸内で藤原純友が反乱を起こしたが、武士の力でしずめられた。源氏と平氏が武士の棟梁として力をのばした。"],
["院政","1086年、白河天皇が位をゆずって上皇となったのちも政治を行った。上皇の住まいを院とよんだことから院政という。藤原氏の摂関政治はおとろえた。"],
["保元の乱と平治の乱","1156年の保元の乱、1159年の平治の乱で、朝廷の争いに武士が動員された。平治の乱で源義朝を破った平清盛が勢力を強めた。"],
["平清盛の政治","1167年、武士として初めて太政大臣となった。娘を天皇のきさきにし、生まれた子を天皇にして権力をにぎった。兵庫の港（大輪田泊）を整備して日宋貿易を行った。"],
["平氏の滅亡","平氏の独裁に反発した貴族や武士が兵をあげ、源頼朝・源義経らが平氏と戦った。1185年、壇ノ浦の戦い（山口県）で平氏は滅んだ。"]]},
{c:"歴史",t:"ヨーロッパの動きと大航海時代",q:"中世から近世のヨーロッパについて、十字軍、ルネサンス、宗教改革、大航海時代（目的と航路を開いた人物）を説明せよ。",i:[
["十字軍","11世紀末、ローマ教皇の呼びかけで、イスラム勢力から聖地エルサレムを取りもどすため派遣された遠征軍。目的は果たせなかったが、イスラム世界との交流でその文化や品物がヨーロッパに伝わった。"],
["ルネサンス","14世紀にイタリアで始まった、古代ギリシャ・ローマの文化を復興し、人間らしい生き方を表現しようとする動き（文芸復興）。レオナルド・ダ・ヴィンチ、ミケランジェロらが活躍した。"],
["宗教改革","1517年、ドイツのルターが、免罪符を売るカトリック教会を批判し、聖書に基づく信仰を説いた。スイスではカルバンが改革を進めた。こうした新しい宗派をプロテスタントという。カトリック側はイエズス会をつくり、アジアなどで海外布教を行った。"],
["大航海時代の目的","アジアの香辛料などを直接手に入れること、キリスト教を広めること。羅針盤の改良などで遠洋航海が可能になった。"],
["航路を開いた人物","コロンブス（1492年、スペインの援助で西インド諸島に到達）、バスコ・ダ・ガマ（1498年、アフリカ南端を回ってインドに到達）、マゼランの船隊（1522年、世界一周を達成）。"],
["その後","スペインはアメリカ大陸のアステカ王国・インカ帝国を滅ぼして植民地にし、銀山を開発した。先住民が激減したため、アフリカから奴隷が連れてこられた。"]]},
{c:"歴史",t:"織田信長と豊臣秀吉",q:"鉄砲とキリスト教の伝来、織田信長の統一事業と政策、豊臣秀吉の統一事業と政策（太閤検地・刀狩）、桃山文化を説明せよ。",i:[
["鉄砲とキリスト教の伝来","1543年、種子島に流れ着いたポルトガル人が鉄砲を伝えた。1549年、イエズス会のフランシスコ・ザビエルが鹿児島に来てキリスト教を伝えた。ポルトガル人・スペイン人との南蛮貿易が始まった。"],
["織田信長の統一事業","1560年桶狭間の戦いで今川義元を破り、1573年に足利義昭を京都から追放して室町幕府を滅ぼした。1575年の長篠の戦いでは鉄砲を有効に使って武田氏を破った。1582年、本能寺の変で家臣の明智光秀にそむかれ自害した。"],
["織田信長の政策","安土城下で楽市・楽座を行い、座の特権や市の税を廃止して自由な商工業を認めた。関所を廃止した。比叡山延暦寺を焼き討ちし、一向一揆と戦うなど仏教勢力をおさえた。キリスト教は保護した。"],
["豊臣秀吉の統一事業","信長の後継者となり、大阪城を拠点に1590年に全国を統一した。2度にわたり朝鮮に大軍を送った（文禄の役・慶長の役）が失敗した。1587年にバテレン（宣教師）追放令を出した。"],
["太閤検地と刀狩","太閤検地：ものさしやますを統一して全国の田畑の面積やよしあしを調べ、収穫量を石高で表し、耕作者を検地帳に登録して年貢を納めさせた。刀狩（1588年）：一揆を防ぐため、百姓から刀・弓・鉄砲などの武器を取り上げた。この二つで武士と百姓の身分が区別される兵農分離が進んだ。"],
["桃山文化","大名や大商人の権力と富を背景にした豪華で壮大な文化。姫路城などの天守閣をもつ城、狩野永徳のふすま絵、千利休が完成させたわび茶、出雲の阿国が始めたかぶき踊り。"],
["南蛮文化","ヨーロッパの影響を受けた文化。宣教師が活版印刷術を伝え、キリスト教の書物などが印刷された。1582年にはキリシタン大名が4人の少年をローマ教皇のもとに派遣した（天正遣欧少年使節）。パン・カステラ・カルタ・タバコなどの言葉が広まり、南蛮屏風がえがかれた。"]]},
{c:"歴史",t:"江戸時代の産業と文化",q:"江戸時代について、農業の発達、交通網と三都の役割、元禄文化と化政文化のちがい、新しい学問（国学・蘭学）と教育を説明せよ。",i:[
["農業の発達","新田開発で耕地が大きく増えた。深く耕せる備中ぐわ、脱穀を効率化した千歯こきなどの農具が普及し、干鰯や油かすなどの肥料も使われた。綿や菜種などの商品作物の栽培も広がった。"],
["交通網","江戸の日本橋を起点とする五街道（東海道・中山道など）が整備され、関所が置かれた。海上では東北・北陸の米を大阪や江戸に運ぶ西廻り航路・東廻り航路が開かれた。"],
["三都","江戸：「将軍のおひざもと」とよばれる政治の中心で、人口約100万人の大都市。大阪：諸藩の蔵屋敷が集まり、年貢米や特産物が取り引きされた商業の中心で「天下の台所」。京都：朝廷があり、西陣織など工芸品の生産地。商工業者は株仲間をつくった。"],
["元禄文化","17世紀末〜18世紀初め、5代将軍綱吉のころ、大阪・京都（上方）の町人が担った文化。井原西鶴（浮世草子）、近松門左衛門（人形浄瑠璃の脚本）、松尾芭蕉（俳諧）、菱川師宣（浮世絵）、尾形光琳（装飾画）。"],
["化政文化","19世紀初め、江戸の町人が中心の文化。十返舎一九『東海道中膝栗毛』、滝沢（曲亭）馬琴、小林一茶（俳諧）、葛飾北斎・歌川広重（風景画）、喜多川歌麿（美人画）の錦絵。川柳・狂歌も流行した。"],
["新しい学問と教育","国学：本居宣長が『古事記伝』を著し、仏教や儒教が伝わる前の日本人の考え方を研究した。蘭学：杉田玄白・前野良沢らがオランダ語の解剖書を翻訳して『解体新書』（1774年）を出版した。伊能忠敬は全国を測量して正確な日本地図をつくった。庶民の子どもは寺子屋で読み・書き・そろばんを学んだ。"]]},
{c:"歴史",t:"欧米の市民革命と産業革命",q:"欧米の近代化について、イギリスの革命、アメリカの独立、フランス革命、啓蒙思想家、産業革命とその影響を説明せよ。",i:[
["イギリスの革命","17世紀、国王の専制に対して議会が対立し、ピューリタン革命（1640年代、クロムウェル）が起きた。1688年の名誉革命で国王を追放し、1689年に権利章典を定め、議会政治の基礎が確立した。"],
["アメリカの独立","イギリスの植民地だった13州が、本国の課税に反発して1775年に独立戦争を起こし、1776年に独立宣言を発表した。初代大統領はワシントン。合衆国憲法では三権分立が定められた。"],
["フランス革命","1789年、国王の専制と身分制度に反発した民衆がバスチーユ牢獄を襲撃して革命が始まった。人権宣言で自由・平等、国民主権を宣言した。その後ナポレオンが皇帝となり、ナポレオン法典を定めた。"],
["啓蒙思想家","ロック（イギリス、抵抗権を唱えた）、モンテスキュー（フランス、『法の精神』で三権分立を唱えた）、ルソー（フランス、『社会契約論』で人民主権を唱えた）。"],
["産業革命","18世紀後半のイギリスで始まった。ワットが改良した蒸気機関を動力に、綿織物の大量生産が可能になった。工場制の機械工業が広がり、イギリスは「世界の工場」とよばれた。"],
["産業革命の影響","資本家が労働者をやとって利益をあげる資本主義が広がった。一方、長時間労働・低賃金・児童労働や都市の環境悪化などの社会問題が生まれ、マルクスらは平等な社会をめざす社会主義を唱えた。"]]},
{c:"歴史",t:"開国と江戸幕府の滅亡",q:"開国から江戸幕府の滅亡まで、ペリーの来航と日米和親条約、日米修好通商条約の内容と問題点、開国の影響、尊王攘夷運動から倒幕への流れ、大政奉還と戊辰戦争を説明せよ。",i:[
["ペリー来航と日米和親条約","1853年、アメリカのペリーが浦賀（神奈川県）に来航し開国を求めた。1854年、日米和親条約を結び、下田（静岡県）と函館（北海道）の2港を開いた。"],
["日米修好通商条約","1858年、大老井伊直弼が朝廷の許可を得ないまま結んだ。函館・神奈川（横浜）・長崎・新潟・兵庫（神戸）の5港を開き、貿易を始めた。"],
["条約の不平等な点","アメリカに領事裁判権（治外法権）を認めた。日本に関税自主権がなかった。"],
["開国の影響","生糸などが大量に輸出されて品不足になり、物価が急上昇して人々の生活が苦しくなった。金と銀の交換比率の違いから金が大量に海外へ流出した。"],
["尊王攘夷から倒幕へ","天皇を尊び外国を打ち払おうとする尊王攘夷運動が高まった。井伊直弼は安政の大獄で反対派を処罰したが、1860年に桜田門外の変で暗殺された。薩摩藩は薩英戦争、長州藩は下関戦争で外国の軍事力を知り、攘夷は不可能だと考えるようになった。1866年、坂本龍馬らの仲立ちで薩長同盟が結ばれ、倒幕をめざした。"],
["大政奉還と戊辰戦争","1867年、15代将軍徳川慶喜が政権を朝廷に返した（大政奉還）。朝廷は王政復古の大号令を出し、天皇中心の新政府をつくった。1868年からの戊辰戦争で旧幕府軍が敗れ、新政府が全国を支配した。"]]},
{c:"歴史",t:"条約改正",q:"不平等条約の改正について、改正をめざした理由、岩倉使節団、欧化政策とノルマントン号事件、領事裁判権の撤廃、関税自主権の回復を説明せよ。",i:[
["改正をめざした理由","幕末に結んだ条約は、外国に領事裁判権を認め、日本に関税自主権がない不平等なものだった。外国人が日本で罪をおかしても日本の法律で裁けず、輸入品に自由に関税をかけられなかった。"],
["岩倉使節団","1871年、岩倉具視を代表に、大久保利通・木戸孝允・伊藤博文らが欧米に派遣された。条約改正の予備交渉は失敗したが、欧米の政治・産業・文化を視察した。津田梅子ら女子留学生も同行した。"],
["欧化政策","外務卿（大臣）井上馨は、東京に鹿鳴館を建てて舞踏会を開くなど、欧米の生活様式を取り入れて改正交渉を進めようとしたが、批判を受け失敗した。"],
["ノルマントン号事件","1886年、イギリス船ノルマントン号が沈没した際、イギリス人船員は助かり日本人乗客は全員死亡した。領事裁判でイギリス人船長は軽い刑ですみ、条約改正を求める世論が高まった。"],
["領事裁判権の撤廃","1894年、外務大臣陸奥宗光がイギリスと日英通商航海条約を結び、領事裁判権を撤廃した（日清戦争の直前）。ロシアの南下を警戒するイギリスが日本に歩み寄った。"],
["関税自主権の回復","1911年、外務大臣小村寿太郎がアメリカとの交渉で関税自主権を完全に回復した。日清・日露戦争の勝利で国際的地位が上がったことが背景。"]]},
{c:"歴史",t:"大正デモクラシー",q:"大正デモクラシーについて、民本主義、護憲運動、米騒動と原敬内閣、普通選挙法と治安維持法、さまざまな社会運動を説明せよ。",i:[
["民本主義","吉野作造が唱えた。主権が天皇にある大日本帝国憲法のもとでも、政治の目的を民衆の幸福におき、政策の決定は民衆の意向に従うべきだとする考え。美濃部達吉の天皇機関説も政党政治を支えた。"],
["護憲運動","1912年、藩閥の桂太郎が内閣を組織すると、憲法に基づく政治を守ろうとする第一次護憲運動が起こり、桂内閣は退陣した。"],
["米騒動","1918年、シベリア出兵を見こした米の買い占めで米価が急上昇し、富山県から米の安売りを求める騒動が全国に広がった。軍隊が出動してしずめた。"],
["原敬内閣","米騒動で内閣が退陣したあと、立憲政友会総裁の原敬が、陸軍・海軍・外務大臣以外をすべて立憲政友会の党員で構成する、初の本格的な政党内閣をつくった。"],
["普通選挙法と治安維持法","1925年、加藤高明内閣のもとで普通選挙法が成立し、満25歳以上のすべての男子に選挙権が与えられた（有権者は約4倍に）。同時に、共産主義などを取りしまる治安維持法も制定された。"],
["社会運動","労働争議・小作争議の増加。差別からの解放をめざす全国水平社（1922年）。平塚らいてうらの青鞜社や新婦人協会（市川房枝ら）による女性の地位向上を求める運動。"]]},
{c:"歴史",t:"満州事変と日中戦争",q:"満州事変から日中戦争まで、満州事変と満州国の建国、国際連盟の脱退、五・一五事件と二・二六事件、日中戦争の始まり、戦時体制の強化を説明せよ。",i:[
["満州事変","1931年、関東軍（満州にいた日本軍）が奉天郊外の柳条湖で南満州鉄道の線路を爆破し、これを中国側のしわざとして軍事行動を始め、満州の大部分を占領した。"],
["満州国の建国","1932年、清の最後の皇帝溥儀を元首として満州国を建国させたが、実権は日本がにぎった。"],
["国際連盟の脱退","中国の訴えで国際連盟がリットン調査団を派遣し、満州国を認めず日本軍の撤退を求める勧告を出した。日本は1933年に国際連盟を脱退し、国際的に孤立していった。"],
["五・一五事件","1932年5月15日、海軍の青年将校らが首相官邸をおそい、犬養毅首相を暗殺した。これにより政党内閣の時代が終わった。"],
["二・二六事件","1936年2月26日、陸軍の青年将校らが大臣などを殺傷し、東京の中心部を一時占拠した。反乱はしずめられたが、軍部の政治的発言力がいっそう強まった。"],
["日中戦争と戦時体制","1937年、北京郊外の盧溝橋で日中両軍が衝突し、日中戦争が始まった。1938年に国家総動員法を定め、政府が議会の承認なしに労働力や物資を動員できるようにした。1940年には政党が解散して大政翼賛会にまとめられた。"]]},
{c:"歴史",t:"第二次世界大戦と太平洋戦争",q:"第二次世界大戦について、ヨーロッパでの開戦、日本の南進と三国同盟、太平洋戦争の開戦と戦局の変化、国民の生活、日本の降伏までを説明せよ。",i:[
["ヨーロッパでの開戦","1939年、ドイツがポーランドに侵攻し、イギリス・フランスがドイツに宣戦して第二次世界大戦が始まった。ドイツは一時ヨーロッパの大部分を支配した。1941年にはドイツがソ連に侵攻した。"],
["日本の南進と三国同盟","1940年、日本はドイツ・イタリアと日独伊三国同盟を結び、資源を求めてフランス領インドシナに軍を進めた（南進）。1941年に日ソ中立条約を結んだ。アメリカは日本への石油輸出を禁止した。"],
["太平洋戦争の開戦","1941年12月8日、日本はイギリス領マレー半島に上陸し、ハワイの真珠湾のアメリカ軍基地を攻撃して、太平洋戦争が始まった。日本は「大東亜共栄圏」の建設を唱えた。"],
["戦局の変化","1942年のミッドウェー海戦で日本が大敗し、戦局は不利になった。その後アメリカ軍が太平洋の島々を次々に占領した。"],
["国民の生活","大学生が兵士として戦場に送られる学徒出陣、中学生や女学生が工場で働く勤労動員、都市の小学生が空襲を避けて地方に移る集団疎開（学童疎開）が行われた。生活物資は配給制となった。"],
["日本の降伏","1945年3月の東京大空襲など各地の都市が空襲を受け、沖縄では住民を巻きこんだ地上戦が行われた。8月6日広島、8月9日長崎に原子爆弾が投下され、8月8日にソ連が日ソ中立条約を破って参戦した。日本はポツダム宣言を受け入れて降伏し、8月15日に天皇がラジオ放送で国民に知らせた。"]]},
{c:"歴史",t:"冷戦",q:"冷戦について、意味と対立の構図、軍事同盟、ドイツの分断、冷戦下の戦争と日本への影響、冷戦の終結を説明せよ。",i:[
["意味と対立の構図","第二次世界大戦後、アメリカを中心とする資本主義の西側陣営と、ソ連を中心とする共産主義（社会主義）の東側陣営が、直接戦争はしないまま厳しく対立した状態。"],
["軍事同盟","西側は北大西洋条約機構（NATO、1949年）、東側はワルシャワ条約機構（1955年）を結成した。"],
["ドイツの分断","ドイツは東西に分かれて独立し、1961年には東ドイツが東西ベルリンの境に「ベルリンの壁」を築いた。"],
["冷戦下の戦争","朝鮮戦争（1950年〜）は北朝鮮を中国・ソ連が、韓国をアメリカ中心の国連軍が支援した。ベトナム戦争ではアメリカが大規模に介入した。"],
["日本への影響","朝鮮戦争のとき、アメリカ軍向けの物資の注文が増えて特需景気となり、日本の経済復興が早まった。GHQの指令で警察予備隊がつくられ、1954年に自衛隊となった。"],
["冷戦の終結","1989年、ベルリンの壁が取りこわされ、米ソ首脳のマルタ会談で冷戦の終結が宣言された。1990年に東西ドイツが統一し、1991年にソ連が解体した。"]]},
{c:"歴史",t:"高度経済成長",q:"高度経済成長について、期間と成長の大きさ、国民生活の変化、象徴的なできごと、公害問題と対策、高度経済成長の終わりを説明せよ。",i:[
["期間と成長","1950年代半ばから1973年まで、経済成長率が年平均で約10％に達した。1968年には国民総生産（GNP）が資本主義国の中でアメリカに次ぐ第2位になった。"],
["国民生活の変化","白黒テレビ・電気洗濯機・電気冷蔵庫の「三種の神器」、その後カラーテレビ・クーラー・自動車（3C）が普及した。農村から都市へ人口が移動し、都市部の過密と農村の過疎が進んだ。"],
["象徴的なできごと","1964年に東京オリンピック・パラリンピックが開かれ、それに合わせて東海道新幹線や高速道路が開通した。1970年に大阪で日本万国博覧会が開かれた。"],
["公害問題","経済発展を優先したため公害が深刻化した。四大公害病：水俣病（熊本県、有機水銀）、新潟水俣病（新潟県阿賀野川流域、有機水銀）、イタイイタイ病（富山県神通川流域、カドミウム）、四日市ぜんそく（三重県、大気汚染）。"],
["公害への対策","1967年に公害対策基本法を制定し、1971年に環境庁（現在の環境省）を設置した。四大公害裁判ではいずれも被害者側が勝訴した。"],
["高度経済成長の終わり","1973年、第四次中東戦争をきっかけに石油の価格が大幅に上がる石油危機（オイルショック）が起こり、高度経済成長が終わった。"]]},

/* ===== 公民（追加） ===== */
{c:"公民",t:"現代社会の特色",q:"現代の日本社会の特色として、グローバル化、情報化、少子高齢化のそれぞれの意味と、社会にあたえる影響や課題を説明せよ。",i:[
["グローバル化","人・物・お金・情報が国境をこえて地球規模で行き来するようになること。"],
["グローバル化の影響","各国が得意な物をつくって交換する国際分業が進む一方、国際競争が激しくなる。食料などの輸入に頼る度合いが高まる。外国人が増え、異なる文化をもつ人々がともに暮らす多文化共生が求められる。"],
["情報化","情報通信技術（ICT）の発達により、社会の中で情報の果たす役割が大きくなること。人工知能（AI）の活用も広がっている。"],
["情報化の課題","情報を正しく選び活用する力（情報リテラシー）と、情報を正しく使う態度（情報モラル）が必要。個人情報の流出、インターネット上の誹謗中傷、誤った情報の拡散なども問題。"],
["少子高齢化","出生数が減り、高齢者の割合が増えること。合計特殊出生率（一人の女性が一生に産む子どもの数の平均）は1.2前後と低く、人口を維持できる水準を大きく下回っている。"],
["少子高齢化の影響","働く世代が減り、年金・医療・介護など社会保障の負担が増える。核家族や一人暮らしの高齢者が増え、家族の形も変化している。"]]},
{c:"公民",t:"対立と合意、効率と公正",q:"社会生活におけるきまりについて、対立と合意、決定の方法（全会一致と多数決）とその長所・短所、効率と公正の考え方を説明せよ。",i:[
["対立と合意","人々の考えや利害の違いから対立が生じたとき、話し合いによって解決策を見いだし、互いが受け入れられる状態（合意）をめざす。合意したことはきまり（ルール）としてまとめる。"],
["全会一致","全員の意見が一致して決める方法。全員が納得できるが、決定までに時間がかかり、決まらないこともある。"],
["多数決","より多くの人が賛成する案に決める方法。一定の時間内で決定できるが、少数意見が反映されにくい。採決の前に十分に話し合い、少数意見を尊重することが大切。"],
["効率","時間・お金・労力などを無駄なく使い、より大きな成果を得られるかという考え方。"],
["公正","全員が話し合いに参加しているかなど手続きの公正さと、一部の人が不利益を受けていないかなど機会や結果の公正さがある。"],
["契約","お互いの合意によって成立する約束。成立すると、当事者は約束を守る義務と責任を負う。"]]},
{c:"公民",t:"人権思想の歴史",q:"人権思想の発展について、イギリスでの始まり、思想家、アメリカ独立宣言とフランス人権宣言、社会権の登場、第二次世界大戦後の国際的な人権保障を説明せよ。",i:[
["イギリスでの始まり","1215年のマグナ・カルタ（大憲章）で国王の権力が制限された。1689年の権利章典で議会の権利が確認された（名誉革命）。"],
["思想家","ロック（抵抗権）、モンテスキュー（三権分立、『法の精神』）、ルソー（人民主権、『社会契約論』）が人権思想を発展させた。"],
["アメリカ独立宣言","1776年。生命・自由・幸福追求の権利を、人が生まれながらにもつ権利として示した。"],
["フランス人権宣言","1789年。人は生まれながらに自由で平等な権利をもつこと、国民主権などを宣言した。"],
["社会権の登場","19世紀に自由権が保障されると、貧富の差が広がった。1919年、ドイツのワイマール憲法で、人間らしい生活を保障する社会権が初めて規定された。"],
["国際的な人権保障","1948年、国連で世界人権宣言が採択された。そのほか、女子差別撤廃条約（1979年）、子ども（児童）の権利条約（1989年）など。"]]},
{c:"公民",t:"平和主義と自衛隊",q:"日本の平和主義について、憲法第9条の内容、自衛隊の成立と政府の考え方、日米安全保障条約と沖縄の基地問題、集団的自衛権、国際貢献と非核三原則を説明せよ。",i:[
["憲法第9条","戦争と武力による威嚇・武力の行使を永久に放棄し、陸海空軍その他の戦力をもたず、国の交戦権を認めないと定めている。"],
["自衛隊","1950年の警察予備隊から保安隊をへて、1954年に自衛隊が発足した。政府は、自衛隊は自衛のための必要最小限度の実力であり、憲法が禁止する「戦力」にはあたらないとしている。災害時の救助活動も行う。"],
["日米安全保障条約","日本が他国から攻撃を受けたとき、日本とアメリカが共同で対応することを定め、アメリカ軍が日本国内に駐留することを認めている。日本にあるアメリカ軍専用施設の面積の約7割が沖縄県に集中し、騒音や事故などが問題になっている。"],
["集団的自衛権","同盟関係にある国が攻撃を受けたとき、自国が攻撃されていなくても共同で防衛する権利。2015年に安全保障関連法が成立し、限定的に行使できるようになった。"],
["国際貢献","1992年にPKO協力法が成立し、自衛隊が国連の平和維持活動（PKO）に参加するようになった（最初はカンボジア）。"],
["非核三原則","核兵器を「持たず、つくらず、持ちこませず」。日本は唯一の戦争被爆国として核兵器の廃絶を訴えている。"]]},
{c:"公民",t:"政党と世論",q:"政党政治について、政党の役割、与党と野党、連立政権、マスメディアと世論、メディアリテラシーを説明せよ。",i:[
["政党の役割","政治について同じ考えをもつ人々が、政権の獲得をめざしてつくる団体。国民のさまざまな意見を集めて政策にまとめ、選挙では政権公約（マニフェスト）を示して支持を求める。"],
["与党と野党","与党：内閣を組織して政権を担当する政党。野党：与党以外の政党で、政府の政策を批判・監視し、ほかの政策を提案する。"],
["連立政権","一つの政党だけで国会の過半数の議席がとれない場合などに、複数の政党が協力してつくる政権。"],
["政治資金","政党の活動資金の一部は、国民の税金から政党交付金として配分される。"],
["世論とマスメディア","世論は、社会の問題について多くの人々がもっている意見。新聞・テレビなどのマスメディアやインターネットは、情報を伝えて世論の形成に大きな影響をあたえる。"],
["メディアリテラシー","メディアからの情報をそのまま信じるのではなく、さまざまな情報を比べて、何が正しいかを冷静に判断し活用する力。"]]},
{c:"公民",t:"株式会社と企業",q:"企業について、私企業と公企業、株式会社のしくみ（株主・株主総会・配当・有限責任）、中小企業の特色、企業の社会的責任を説明せよ。",i:[
["私企業と公企業","私企業は利潤（もうけ）を目的とする企業で、株式会社など。公企業は利潤を目的とせず公共の利益のために国や地方公共団体が経営する企業で、水道事業や公営バスなど。"],
["株式会社のしくみ","株式を発行して多くの人から資金を集めてつくる会社。株式を購入した人を株主という。"],
["株主の権利と責任","株主は、会社の利潤の一部を配当として受け取ることができる。会社の最高議決機関である株主総会に出席し、経営方針や役員の選出について議決できる。会社が倒産しても、出資した金額以上の責任は負わない（有限責任）。"],
["株価","株式は証券取引所などで売買され、会社の業績や景気の見通しによって株価が変動する。"],
["中小企業","日本の企業数の99％以上、働く人の約7割を占める。大企業の下請けとなっていることも多い。独自の技術やアイデアで新しい事業に挑戦するベンチャー企業もある。"],
["企業の社会的責任（CSR）","企業は利潤を追求するだけでなく、法令を守ること、環境への配慮、安全な製品の提供、雇用の確保、地域社会への貢献、情報の公開などの責任を果たすことが求められる。"]]},
{c:"公民",t:"景気とインフレ・デフレ",q:"景気変動について、好況と不況のときのようす、インフレーションとデフレーション、景気を安定させるための政府と日本銀行の役割を説明せよ。",i:[
["景気変動","経済は好況（好景気）→後退→不況（不景気）→回復をくり返す。これを景気変動（景気の循環）という。"],
["好況のとき","商品がよく売れ、企業の生産が増え、雇用や賃金も増える。需要が供給を上回り、物価が上がりやすい。"],
["不況のとき","商品が売れず、企業の生産が減り、倒産や失業が増える。物価が下がりやすい。"],
["インフレーション","物価が継続して上がること。お金の価値が下がるため、同じ金額で買える物が減る。"],
["デフレーション","物価が継続して下がること。企業の利益が減って賃金が下がり、さらに消費が減って物価が下がるという悪循環をデフレスパイラルという。"],
["景気の安定化","政府は財政政策（公共投資や税の増減）、日本銀行は金融政策（公開市場操作で出回るお金の量を調整）によって景気の安定をはかる。不況のときは市場に出回るお金を増やし、好況のときは減らす。"],
["国内総生産（GDP）","一定期間に国内で新たに生み出された財やサービスの価値（付加価値）の合計。国の経済の規模を表す。GDPが前の年から増えた割合を経済成長率という。"]]},
{c:"公民",t:"円高と円安",q:"外国為替相場について、意味、円高と円安のちがい（数値例）、円高・円安が輸出・輸入や国内産業にあたえる影響を説明せよ。",i:[
["外国為替相場","異なる国の通貨を交換するときの比率（為替レート）。各国の経済状況や通貨の需要と供給によって変動する。"],
["円高","外国の通貨に対して円の価値が上がること。例：1ドル＝100円→1ドル＝80円。100円で買えたものが80円で買えるようになる。"],
["円安","外国の通貨に対して円の価値が下がること。例：1ドル＝100円→1ドル＝120円。"],
["円高の影響","輸入品が安くなり、輸入業者や海外旅行に有利。一方、日本の製品が海外で値上がりして売れにくくなるので、輸出企業には不利。工場を海外に移す企業が増え、産業の空洞化が進む原因となる。"],
["円安の影響","日本の製品が海外で安くなり、輸出企業に有利。外国人観光客も増えやすい。一方、原油や食料など輸入品の価格が上がり、国内の物価上昇につながる。"]]},
{c:"公民",t:"地域統合と南北問題",q:"国際社会の課題について、主権国家の原則、地域主義（地域統合）の例、南北問題と南南問題、発展途上国への援助の方法を説明せよ。",i:[
["主権国家","国民・領域・主権をもつ国家。互いに対等であり、他国から支配や干渉を受けない（内政不干渉）。国旗・国歌を互いに尊重する。国家間のきまりとして国際法（条約や国際慣習法）がある。どの国の領海や排他的経済水域にも属さない公海は、どの国も自由に利用できる（公海自由の原則）。"],
["地域主義","特定の地域の国々がまとまって、経済や安全保障などで協力を強める動き。EU（ヨーロッパ連合）、ASEAN（東南アジア諸国連合）、APEC（アジア太平洋経済協力）、USMCA（米国・メキシコ・カナダ協定、旧NAFTA）、AU（アフリカ連合）、TPP（環太平洋パートナーシップ協定）など。"],
["南北問題","おもに北半球に多い先進国と、南半球に多い発展途上国との経済格差の問題。"],
["南南問題","発展途上国の間での格差の問題。資源の豊富な産油国や、工業化が進んだ新興国（BRICSなど）と、開発の遅れた後発発展途上国との差が広がっている。"],
["援助の方法","政府開発援助（ODA）、青年海外協力隊などの人的な支援、NGO（非政府組織）の活動。発展途上国の産品を適正な価格で買うフェアトレード、貧しい人々に少額のお金を貸して自立を助けるマイクロクレジットなど。"]]},
{c:"公民",t:"家族と民法",q:"家族について、家族の形の変化（核家族・単独世帯）、憲法第24条の内容、戦後の民法の改正、成年年齢の引き下げとその影響を説明せよ。",i:[
["家族の役割","家族は社会集団の最も基本的な単位。生活の場であり、子どもを育て、互いに支え合う。"],
["家族の形の変化","夫婦のみ、夫婦と未婚の子ども、ひとり親と子どもからなる核家族の世帯が多い。近年は高齢者を中心に一人暮らしの単独世帯が増えている。"],
["憲法第24条","家族生活における個人の尊厳と両性の本質的平等を定める。結婚は両性の合意のみにもとづいて成立する。"],
["民法の改正","第二次世界大戦後に民法が改正され、戸主が家族に対して強い権限をもつ「家」制度が廃止された。結婚・相続などで男女が平等になり、相続では子どもは男女や長子・次子に関係なく平等に財産を受けつぐことになった。"],
["成年年齢の引き下げ","2022年、民法の成年年齢が20歳から18歳に引き下げられた。18歳から親の同意なしに携帯電話やクレジットカードなどの契約ができるようになる一方、未成年を理由とした契約の取り消しはできなくなるため、契約への責任と注意が必要になる。"]]},
{c:"公民",t:"共生社会と差別の解消",q:"共生社会の実現について、男女平等をめざす法律、障がいのある人への取り組み（バリアフリー・ユニバーサルデザイン・合理的配慮）、アイヌの人々や在日外国人、部落差別の問題を説明せよ。",i:[
["男女平等をめざす法律","女子差別撤廃条約（1979年採択）を受けて、1985年に男女雇用機会均等法を制定し、採用・昇進などで性別による差別を禁止した。1999年には男女共同参画社会基本法を制定し、男女が対等に社会のあらゆる活動に参画できる社会をめざす。育児・介護休業法もある。"],
["障がいのある人への取り組み","障害者差別解消法（2013年制定）で、障がいを理由とする差別を禁止し、一人一人の必要に応じた変更や調整（合理的配慮）を行うよう求めている。"],
["バリアフリーとユニバーサルデザイン","バリアフリー：生活の障壁（段差など）を取り除くこと。ユニバーサルデザイン：はじめから年齢や障がいの有無に関係なく、だれもが使いやすいように設計すること（多機能トイレ、ピクトグラムなど）。"],
["アイヌの人々","明治時代以降、同化政策で独自の文化や生活が否定された。2019年のアイヌ施策推進法でアイヌ民族を先住民族と明記した。"],
["在日外国人","在日韓国・朝鮮人など、歴史的な経緯から日本に住む人々への差別が問題となってきた。2016年にヘイトスピーチ解消法が制定された。異なる文化をもつ人々が互いを尊重して暮らす多文化共生が求められている。"],
["部落差別","被差別部落の出身であることを理由とする差別が今も残っている。差別をなくすための教育や啓発が進められている。"]]},
{c:"公民",t:"家計と流通",q:"経済のしくみについて、経済の三つの主体、家計の収入と支出の種類、エンゲル係数、財とサービス、流通のしくみと合理化、キャッシュレス化を説明せよ。",i:[
["経済の三つの主体","家計（消費の主体）、企業（生産の主体）、政府（財政を通じて公共サービスを提供）。三者の間をお金・商品・労働力などが循環している。"],
["家計の収入","給与所得（会社などで働いて得る賃金）、事業所得（農家や商店などの自営業から得る所得）、財産所得（家賃・地代、預金の利子、株式の配当など）。"],
["家計の支出","消費支出（食料費・住居費・光熱費・教育費など、生活に必要な支出）、非消費支出（税金や社会保険料）、貯蓄（収入から消費支出と非消費支出を引いた残り）。"],
["エンゲル係数","消費支出にしめる食料費の割合。一般に、生活が豊かになるほど低くなるとされる。"],
["財とサービス","財は食料品・衣類など形のある商品。サービスは医療・教育・運輸・理容など形のない商品。"],
["流通のしくみと合理化","商品が生産者から卸売業者・小売業者をへて消費者に届くまでの流れを流通といい、卸売業・小売業を商業という。大型スーパーなどが産地から直接仕入れたり、インターネット通販が広がったりして、流通の合理化が進んでいる。コンビニなどでは、商品のバーコードから売れた時刻や数を記録するPOSシステム（販売時点情報管理）で在庫や仕入れを管理している。"],
["キャッシュレス化","クレジットカード（代金はあとで支払う）、電子マネー、スマートフォン決済などが広がっている。クレジットカードは便利だが、使いすぎて支払いができなくなる危険もある。"]]},
{c:"公民",t:"循環型社会と環境保全",q:"日本の環境政策について、公害対策基本法から環境基本法への流れ、環境アセスメント、3R、循環型社会を説明せよ。",i:[
["公害対策基本法","高度経済成長期の公害の深刻化を受けて1967年に制定。1971年に環境庁（現在の環境省）が設置された。"],
["環境基本法","1993年に公害対策基本法にかわって制定。公害だけでなく、地球温暖化など地球規模の環境問題にも対応し、環境保全の基本理念を定めた。"],
["環境アセスメント","環境影響評価。大規模な開発を行う前に、それが環境にあたえる影響を調査・予測・評価し、計画に反映させるしくみ。新しい人権の環境権とも関係が深い。"],
["3R","リデュース（ごみの発生をおさえる）、リユース（くり返し使う）、リサイクル（資源として再生利用する）。"],
["循環型社会","資源の消費をおさえ、廃棄物を減らして資源を循環させることで、環境への負担をできるだけ少なくする社会。2000年に循環型社会形成推進基本法が制定された。"]]},
{c:"公民",t:"貿易と国際経済",q:"国際経済について、自由貿易と保護貿易、固定相場制から変動相場制への移行、国際収支、WTOとIMFの役割、FTAとEPA、貿易摩擦と多国籍企業を説明せよ。",i:[
["自由貿易と保護貿易","自由貿易：国家が関税などで制限せず、自由に貿易を行うこと。保護貿易：自国の産業を守るため、輸入品に高い関税をかけたり輸入量を制限したりすること。"],
["固定相場制と変動相場制","第二次世界大戦後は、1ドル＝360円の固定相場制だった。1973年ごろから、通貨の需要と供給によって為替レートが日々変わる変動相場制に移行した。"],
["国際収支","一定期間の、外国との間でのお金の受け取りと支払いをまとめた記録。商品の輸出入（貿易）、サービスの取引、投資の収益などがふくまれる。"],
["WTOとIMF","WTO（世界貿易機関）：1995年にGATTを引き継いで発足。自由貿易を進め、貿易をめぐる国家間の紛争を処理する。IMF（国際通貨基金）：為替の安定をはかり、経済危機の国に資金を貸し出す。"],
["FTAとEPA","FTA（自由貿易協定）：特定の国や地域の間で関税などをなくす協定。EPA（経済連携協定）：関税の撤廃に加え、投資や人の移動など幅広い経済関係を強める協定。日本はTPP（環太平洋パートナーシップ協定）などに参加している。"],
["貿易摩擦と多国籍企業","1980年代、日本の自動車などの輸出が急増し、アメリカとの間で貿易摩擦が起きた。日本企業は現地生産を増やした。複数の国に生産や販売の拠点をもつ企業を多国籍企業という。"]]},
{c:"公民",t:"地域紛争・難民と核軍縮",q:"国際問題について、冷戦後の地域紛争とテロ、難民とUNHCR、人間の安全保障、核兵器をめぐる条約と日本の立場を説明せよ。",i:[
["冷戦後の地域紛争","冷戦終結後、民族・宗教の違いや資源をめぐる対立から、国内や地域での紛争が増えた。旧ユーゴスラビアの紛争、パレスチナ問題、シリア内戦、2022年からのロシアによるウクライナ侵攻など。"],
["テロ","政治的な目的のために暴力で人々に恐怖をあたえる行為。2001年のアメリカ同時多発テロをきっかけに、アメリカはアフガニスタンを攻撃した。"],
["難民","紛争や迫害などにより、住んでいた国を逃れて他国に保護を求める人々。国連難民高等弁務官事務所（UNHCR）が保護や支援を行う。日本は難民の受け入れ数が少ないことが課題とされる。"],
["人間の安全保障","国家の安全だけでなく、一人一人の人間の生命や人権を、貧困・飢餓・感染症・紛争・環境破壊などの脅威から守るという考え方。日本も外交の柱にしている。"],
["核兵器をめぐる条約","核拡散防止条約（NPT、1968年）：核兵器をもつ国を増やさない。包括的核実験禁止条約（CTBT、1996年）：あらゆる核実験を禁止。核兵器禁止条約（2017年採択、2021年発効）：核兵器の開発・保有・使用などを全面的に禁止。"],
["日本の立場","唯一の戦争被爆国として非核三原則をかかげ、核兵器の廃絶を訴えている。ただし、アメリカの核抑止力に頼る安全保障上の立場から、核兵器禁止条約には参加していない。"]]},

/* ===== 歴史（追加2） ===== */
{c:"歴史",t:"鎌倉時代の社会と文化",q:"鎌倉時代について、武士の暮らし、地頭と荘園領主の争い、農業と商業の発達、鎌倉文化の代表的な作品、鎌倉仏教の宗派と開祖を説明せよ。",i:[
["武士の暮らし","領地に館を構えて住み、ふだんから流鏑馬などで武芸にはげんだ。領地は子どもたちに分けて相続する分割相続だったため、しだいに領地が細かくなり、御家人の生活が苦しくなる原因となった。"],
["地頭と荘園領主","地頭は年貢の取り立てなどを通じて荘園の支配を強め、荘園領主と争った。土地を半分ずつに分けて支配する下地中分で解決することもあった。紀伊国阿氐河荘の農民は地頭の横暴を荘園領主に訴えた。"],
["農業と商業","同じ田で米を収穫したあとに麦をつくる二毛作が西日本で始まり、牛や馬を使った耕作、草木灰などの肥料も広まった。寺社の門前や交通の要所で月3回の定期市が開かれ、宋から輸入した宋銭が使われた。"],
["鎌倉文化","武士の気風を反映した、素朴で力強い文化。東大寺南大門の金剛力士像（運慶・快慶ら）、琵琶法師が語り広めた軍記物の『平家物語』、藤原定家らの『新古今和歌集』、鴨長明の『方丈記』、兼好法師の『徒然草』。"],
["鎌倉仏教（念仏）","わかりやすく実行しやすい教えが武士や民衆に広まった。法然：浄土宗（念仏を唱えれば極楽浄土に生まれ変われる）。親鸞：浄土真宗（一向宗）。一遍：時宗（踊念仏）。"],
["鎌倉仏教（題目・禅宗）","日蓮：日蓮宗（法華宗、題目「南無妙法蓮華経」を唱える）。禅宗は座禅によって自力でさとりを開く教えで、武士に広まった。栄西：臨済宗。道元：曹洞宗。"]]},
{c:"歴史",t:"室町時代の社会と文化",q:"室町時代について、農業と商工業の発達（座・土倉・馬借など）、惣と土一揆（正長の土一揆・山城国一揆・加賀の一向一揆）、北山文化と東山文化を説明せよ。",i:[
["農業の発達","二毛作が全国に広がり、水車によるかんがいや、茶・麻・桑・藍などの商品作物の栽培が広まった。"],
["商工業の発達","定期市が月6回開かれるようになり、明から輸入した明銭が使われた。商工業者は座という同業者の組合をつくり、公家や寺社に税を納めて営業を独占した。土倉・酒屋が高利貸しを営み、馬借・車借が陸上の運送を担った。堺・博多などでは商人による自治が行われた。"],
["惣","農民がつくった自治的な村。寄合を開いて村のおきてを定め、用水路の管理などを共同で行った。"],
["正長の土一揆","1428年、近江（滋賀県）の馬借をきっかけに、農民が団結して土倉や酒屋をおそい、借金の帳消し（徳政）を求めた。"],
["山城国一揆と加賀の一向一揆","山城国一揆（1485年）：山城（京都府南部）の武士と農民が守護大名の軍を追い出し、約8年間自治を行った。加賀の一向一揆（1488年）：浄土真宗（一向宗）の信者が加賀（石川県）の守護大名を倒し、約100年間自治を行った。"],
["北山文化","3代将軍足利義満のころ。公家の文化と武家の文化がとけあった文化。金閣（京都の北山）。観阿弥・世阿弥の親子が能を大成した。"],
["東山文化","8代将軍足利義政のころ。禅宗の影響を受けた簡素で気品のある文化。銀閣（京都の東山）と、現在の和室のもとになった書院造。雪舟が水墨画を大成した。能の合間に演じられる狂言、『一寸法師』などの御伽草子、連歌や茶の湯・生け花も広まった。"]]},
{c:"歴史",t:"江戸時代の身分と村",q:"江戸時代の社会について、身分制度、村のしくみと村役人、五人組、百姓の負担と統制、町人のくらしを説明せよ。",i:[
["身分制度","武士（支配身分、名字・帯刀などの特権をもつ、人口の約7％）、百姓（人口の約85％）、町人（職人・商人）に分けられた。身分は原則として親から子へ受けつがれた。えた・ひにんとよばれた人々は厳しく差別された。"],
["村のしくみ","有力な本百姓の中から名主（庄屋）・組頭・百姓代の村役人が選ばれ、村の自治を行い、年貢を納める責任を負った。土地をもつ本百姓と、土地をもたず小作をする水のみ百姓がいた。"],
["五人組","数戸ずつを一組とし、年貢の納入や犯罪の防止に連帯して責任を負わせたしくみ。"],
["百姓の負担と統制","おもな負担は米で納める年貢で、収穫の4〜5割にもなった。土地の売買を禁止するなど、幕府や藩は年貢を確実に取り立てるために百姓の生活を細かく統制した。"],
["町人のくらし","城下町の町人は、地主・家持の中から選ばれた町役人のもとで自治を行った。年貢の負担は百姓より軽かったが、営業税などを納めた。"]]},
{c:"歴史",t:"徳川綱吉と新井白石の政治",q:"江戸時代中期の政治について、5代将軍徳川綱吉の政治（文治政治・生類憐みの令・貨幣の改鋳）と、新井白石の正徳の治を説明せよ。",i:[
["文治政治","武力でおさえつける政治から、学問や礼儀を重んじて秩序を保つ政治への転換。5代将軍徳川綱吉は、身分の上下を重んじる朱子学を奨励し、江戸に湯島聖堂を建てた。"],
["生類憐みの令","綱吉が出した、犬をはじめ生き物の殺生を極端に禁じた法令。人々の生活を苦しめた。"],
["貨幣の改鋳","幕府の財政が苦しくなったため、金の含有量を減らした質の悪い貨幣を大量に発行して収入を増やしたが、物価が上がり人々の生活が苦しくなった。"],
["正徳の治","6代・7代将軍に仕えた儒学者の新井白石が行った政治。貨幣の質を元にもどして物価の安定をはかった。金銀が海外に流出するのを防ぐため、長崎貿易を制限した。"]]},
{c:"歴史",t:"江戸幕府のゆらぎと外国船",q:"江戸時代後期について、百姓一揆と打ちこわし、工業のしくみの変化、外国船の接近と幕府の対応、大塩平八郎の乱、雄藩の台頭を説明せよ。",i:[
["百姓一揆と打ちこわし","享保・天明・天保の大ききんのたびに、農村では年貢の軽減や代官の交代を求める百姓一揆が、都市では米を買い占めた商人などをおそう打ちこわしが増えた。一揆の参加者は、中心人物がわからないようにからかさ連判状をつくることもあった。"],
["工業の変化","問屋が農民に道具や原料を貸して製品をつくらせる問屋制家内工業から、19世紀には工場に人を集めて分業で生産する工場制手工業（マニュファクチュア）が始まった。"],
["外国船の接近","1792年にロシアのラクスマンが根室に、1804年にレザノフが長崎に来航して通商を求めた。1808年にはイギリス軍艦が長崎に侵入する事件（フェートン号事件）が起きた。間宮林蔵は樺太を探検した。"],
["幕府の対応","1825年に異国船打払令を出し、日本に近づく外国船の撃退を命じた。1837年にアメリカ船モリソン号が砲撃され、これを批判した蘭学者の渡辺崋山・高野長英は処罰された（蛮社の獄）。1842年、清がアヘン戦争でイギリスに敗れたことを知ると、打払令をやめて外国船に燃料や水を与えることにした。"],
["大塩平八郎の乱","1837年、大阪町奉行所の元役人の大塩平八郎が、天保のききんで苦しむ人々を救おうとしない奉行所に抗議し、大阪で兵をあげた。乱はすぐにしずめられたが、幕府の元役人の反乱は幕府に大きな衝撃をあたえた。"],
["雄藩の台頭","薩摩藩・長州藩などは、特産物の専売や借金の整理などの藩政改革に成功して財政を立て直し、のちに幕末の政治で大きな力をもった。"]]},
{c:"歴史",t:"明治初期の外交と領土",q:"明治政府の初期の外交と領土の画定について、清・朝鮮との関係、征韓論と西南戦争、ロシアとの国境、琉球処分、北海道の開拓とアイヌの人々を説明せよ。",i:[
["清との関係","1871年、日清修好条規を結んだ。日本が外国と結んだ初めての対等な条約。"],
["朝鮮との関係","1875年の江華島事件をきっかけに、1876年に日朝修好条規を結んで朝鮮を開国させた。日本の領事裁判権を認めさせるなど、朝鮮にとって不平等な条約だった。"],
["征韓論と西南戦争","武力で朝鮮を開国させようとする征韓論を唱えた西郷隆盛・板垣退助らは、岩倉使節団から帰国した大久保利通らと対立して政府を去った（1873年）。特権を失った士族の不満が高まり、1877年、西郷隆盛を中心に鹿児島の士族が西南戦争を起こしたが、徴兵令でつくられた政府軍に敗れた。以後、政府への批判は言論による自由民権運動が中心となった。"],
["ロシアとの国境","1875年、樺太・千島交換条約を結び、樺太をロシア領、千島列島全体を日本領とした。"],
["琉球処分","1872年に琉球王国を琉球藩とし、1879年に軍隊を送って沖縄県を設置した。"],
["北海道の開拓とアイヌの人々","1869年に蝦夷地を北海道と改め、開拓使を置いて、屯田兵などによる開拓を進めた。アイヌの人々は土地を奪われ、日本人への同化政策を強いられた。小笠原諸島も1876年に日本の領土とした。"]]},
{c:"歴史",t:"日本の産業革命",q:"明治時代の日本の産業革命について、軽工業の発達、重工業の発達、財閥の成長、労働問題、足尾銅山鉱毒事件を説明せよ。",i:[
["軽工業の発達","1880年代後半から、紡績業（綿糸）や製糸業（生糸）などの軽工業で産業革命が進んだ。生糸は日本の最大の輸出品となり、1909年には生糸の輸出量が世界一になった。"],
["重工業の発達","日清戦争の賠償金の一部を使って建設した官営の八幡製鉄所（福岡県）が1901年に操業を始めた。日露戦争後には鉄鋼・造船・機械などの重工業が発達した。"],
["交通の発達","1872年に新橋〜横浜間に鉄道が開通し、1889年には東海道線が全線開通した。"],
["財閥","三井・三菱・住友・安田などの資本家が、政府から鉱山や工場の払い下げを受けるなどして、さまざまな業種に進出し、日本経済を支配する財閥に成長した。"],
["労働問題","製糸工場などで働く女性（工女・女工）は、低い賃金で長時間労働を強いられた。労働組合がつくられ、ストライキも起きた。1911年に工場法が制定され、12歳未満の子どもの労働などが禁止された。社会主義の運動も起きたが、政府は大逆事件（1910年）などで弾圧した。"],
["足尾銅山鉱毒事件","栃木県の足尾銅山から出た鉱毒が渡良瀬川に流れこみ、流域の農業や漁業に大きな被害をあたえた。衆議院議員の田中正造は国会で操業停止を求め、議員を辞職して天皇に直訴しようとした。"]]},
{c:"歴史",t:"明治の文化",q:"明治時代の文化について、文明開化、教育の普及、文学、美術・音楽、世界で活躍した科学者を説明せよ。",i:[
["文明開化","都市を中心に欧米の文化が取り入れられた。れんが造りの建物、ガス灯、人力車、洋服、牛肉を食べる習慣など。1872年に太陽暦を採用した。福沢諭吉は『学問のすゝめ』で人間の平等と学問の大切さを説き、中江兆民はルソーの思想を紹介した。"],
["教育の普及","1872年に学制を公布した。1890年に教育勅語が出され、忠君愛国の道徳が教育の柱とされた。1907年に義務教育が6年間となり、小学校の就学率は1900年代に90％をこえた。"],
["文学","話し言葉で文章を書く言文一致の文体が広まった（二葉亭四迷『浮雲』）。樋口一葉『たけくらべ』、与謝野晶子『みだれ髪』と、日露戦争に出征した弟を思う詩「君死にたまふことなかれ」、森鴎外『舞姫』、夏目漱石『坊っちゃん』『吾輩は猫である』。正岡子規は俳句・短歌を革新した。"],
["美術・音楽","アメリカ人のフェノロサと岡倉天心が日本の伝統美術の価値を見直し、横山大観らが日本画を発展させた。黒田清輝はフランスで学んだ洋画を広めた（『湖畔』）。滝廉太郎は『荒城の月』などを作曲した。"],
["科学者","北里柴三郎（破傷風の血清療法）、志賀潔（赤痢菌の発見）、野口英世（黄熱病の研究）、高峰譲吉（タカジアスターゼ）、鈴木梅太郎（ビタミンB1）、長岡半太郎（原子模型）、大森房吉（地震計）。"]]},
{c:"歴史",t:"第一次世界大戦後の世界と日本",q:"第一次世界大戦後について、ロシア革命とシベリア出兵、民族自決とアジアの民族運動、ワシントン会議と国際協調の動きを説明せよ。",i:[
["ロシア革命","1917年、戦争の長期化による生活苦から革命が起き、皇帝が退位した。レーニンの指導で世界初の社会主義の政府が生まれ、1922年にソビエト社会主義共和国連邦（ソ連）が成立した。"],
["シベリア出兵","革命の広がりをおそれた日本・イギリス・アメリカなどは、1918年にシベリアに軍隊を送った。日本の出兵を見こした米の買い占めが米騒動の原因となった。"],
["民族自決","アメリカのウィルソン大統領が、各民族のことは自分たちで決めるべきだとする民族自決を唱えた。東ヨーロッパの国々は独立したが、アジアやアフリカには適用されなかった。ドイツでは民主的なワイマール憲法が制定された。"],
["アジアの民族運動","朝鮮：1919年3月1日、日本からの独立を求める三・一独立運動が起きた。中国：1919年、パリ講和会議で二十一か条の要求の取り消しが認められなかったことに反対して五・四運動が起きた。インド：ガンディーがイギリスに対して非暴力・不服従の抵抗運動を指導した。"],
["ワシントン会議","1921〜22年、アメリカの呼びかけで開かれた。海軍の主力艦の保有を制限する軍縮条約が結ばれ、中国の主権尊重が確認されて日本は山東省の権益を中国に返した。日英同盟は解消された。"],
["国際協調","国際連盟が発足し、新渡戸稲造が事務次長として活躍した。1920年代の日本は、欧米と協調する外交を進めた。"]]},
{c:"歴史",t:"大正の社会と文化",q:"大正時代の社会と文化について、大戦景気とその影響、関東大震災、大衆文化の広がり（メディア・都市生活）、文学と学問を説明せよ。",i:[
["大戦景気","第一次世界大戦中、ヨーロッパへの輸出やアジアへの綿製品の輸出が増え、好景気となった。造船・鉄鋼・化学などの重化学工業が発達し、急に金持ちになった成金が現れた。一方で物価が上がり、庶民の生活は苦しくなった。戦後は輸出が減って不況となった。"],
["関東大震災","1923年9月1日、関東地方を大地震がおそい、東京・横浜を中心に火災で大きな被害が出た。混乱の中で、多くの朝鮮人などが殺害される事件も起きた。震災の影響で経済はさらに打撃を受けた。"],
["メディアの発達","新聞や雑誌の発行部数が増え、1冊1円の円本も出版された。1925年にラジオ放送が始まった。映画（活動写真）も人気となった。"],
["都市生活の変化","都市では洋風の応接間をもつ文化住宅が建てられ、洋服を着る人が増えた。電車・バスが通勤に使われ、デパートも登場した。バスガールやタイピストなど、働く女性（職業婦人）も増えた。"],
["文学と学問","芥川龍之介『羅生門』、志賀直哉ら白樺派、谷崎潤一郎。労働者の生活をえがくプロレタリア文学（小林多喜二『蟹工船』）。西田幾多郎は哲学書『善の研究』を著した。"]]},
{c:"歴史",t:"バブル経済から平成へ",q:"高度経済成長が終わってから現在までの日本について、安定成長と貿易摩擦、バブル経済とその崩壊、平成不況、政治の変化、大きな災害と防災を説明せよ。",i:[
["安定成長","石油危機のあと、日本は省エネルギーや技術革新を進めて不況を乗りこえ、経済は安定成長に移った。自動車や電気製品の輸出が増え、アメリカなどとの間で貿易摩擦が起きた。"],
["バブル経済","1980年代後半、銀行の資金が土地や株式に流れこみ、株価や地価が実際の価値以上に異常に高くなった。これをバブル（泡）経済という。"],
["バブル崩壊と平成不況","1991年ごろバブル経済が崩壊し、長い不況（平成不況）が続いた。銀行は回収できない貸し付け（不良債権）をかかえ、金融機関の倒産もあった。企業はリストラを進め、非正規雇用の労働者が増えた。2008年には世界金融危機が起きた。"],
["政治の変化","1955年から自由民主党が長く政権を担ってきた（55年体制）が、1993年に非自民の連立内閣が成立し、55年体制が終わった。元号は1989年に昭和から平成に、2019年に平成から令和に変わった。"],
["大きな災害と防災","1995年に阪神・淡路大震災が起き、多くのボランティアが被災地で活動した。2011年の東日本大震災では津波と原子力発電所の事故で大きな被害が出た。被災地の復興が進められ、防災意識が高まっている。"]]},
/* ===== 地理（追加2） ===== */
{c:"地理",t:"世界の衣食住",q:"世界の人々の生活について、気候に合わせた住居、民族衣装や気候に合わせた衣服、地域ごとの主食のちがいを説明せよ。",i:[
["熱帯の住居","湿気や暑さを防ぎ風通しをよくするため、床を地面から離した高床の住居。木や葉を材料にする。"],
["乾燥帯の住居","木が少ないため、土をこねて乾かした日干しれんがの家。モンゴルの遊牧民は組み立て・移動ができるテントの住居（ゲル）に住む。"],
["冷帯・寒帯の住居","冷帯ではタイガの木を使った丸太の家。シベリアなどでは、建物から出る熱で永久凍土がとけて建物が傾くのを防ぐため、高床にする。カナダ北部のイヌイットは、かつて狩りのときに雪や氷でつくるイグルーを使った。"],
["温帯の住居","地中海沿岸では、強い日差しをさえぎるため、石造りで壁を白くぬった家が見られる。"],
["衣服","インドの女性のサリー、朝鮮半島のチマ・チョゴリ、アンデス山脈の高地のポンチョ（アルパカの毛でつくり寒さを防ぐ）、イスラム教徒の女性が着るチャドル（肌を見せないため）。乾燥帯では、強い日差しや砂ぼこりから身を守るため、全身をおおう長袖の服を着る。"],
["主食","米（季節風の影響で雨の多い東アジア・東南アジア・南アジア）、小麦（パンやナンにする。ヨーロッパ・西アジア・北アメリカなど）、とうもろこし（メキシコのトルティーヤなど）、いも類（タロいも・キャッサバなど、熱帯の地域）。グローバル化で、世界中で同じ食べ物や衣服が広がる動きもある。"]]},
{c:"地理",t:"アジア州の自然と韓国",q:"アジア州について、地域区分、地形（山脈・高原・大河）、季節風と気候、アジアNIES、韓国の特色を説明せよ。",i:[
["地域区分","東アジア、東南アジア、南アジア、西アジア、中央アジアに分けられる。世界の人口の約6割がアジア州に住んでいる。"],
["地形","世界最高峰のエベレストがあるヒマラヤ山脈、「世界の屋根」とよばれるチベット高原。中国の黄河・長江、東南アジアのメコン川、インドのガンジス川などの大河が流れる。"],
["季節風と気候","東アジア・東南アジア・南アジアは季節風（モンスーン）の影響を受け、夏は海からの湿った風で雨が多く（雨季）、冬は大陸からの乾いた風で雨が少ない（乾季）。降水量が多い地域では稲作がさかん。西アジア・中央アジアは乾燥帯で砂漠が広がる。"],
["アジアNIES","1970年代以降に急速に工業化を進めた韓国・台湾・ホンコン（香港）・シンガポール。新興工業経済地域とよばれる。"],
["韓国の特色","首都はソウルで、人口の多くがソウル周辺に集中する。独自の文字ハングルを使う。儒教の教えが重んじられ、キリスト教徒も多い。床暖房のオンドル、キムチなどの食文化。"],
["韓国の産業","造船・鉄鋼から、自動車や電子機器・半導体などの工業が発達した。音楽・ドラマなどの文化の輸出もさかんで、日本との人や物の交流も多い。"]]},
{c:"地理",t:"ヨーロッパの国々とロシア",q:"ヨーロッパの主な国々（イギリス・フランス・ドイツ・オランダ・イタリア）の特色と、ロシアの自然と産業を説明せよ。",i:[
["イギリス","18世紀に世界で最初に産業革命が起きた国。北海油田で原油を産出する。首都ロンドンは世界の金融の中心の一つ。2020年にEUを離脱した。"],
["フランス","EU最大の農業国で、小麦の生産・輸出が多い。各国で生産した部品を集めて航空機を組み立てる国際分業が行われている。発電に占める原子力発電の割合が高い。"],
["ドイツ","EU最大の工業国で、自動車工業などがさかん。ルール炭田の石炭とライン川の水運を生かしてルール工業地域が発達した。環境保護への関心が高く、再生可能エネルギーの利用が進む。トルコなどからの外国人労働者も多い。"],
["オランダ","国土の約4分の1が海面より低く、干拓でつくったポルダーが広がる。ライン川の河口にあるロッテルダムのユーロポートは、EUの玄関口となる大きな港。チューリップなどの園芸農業や酪農がさかん。"],
["イタリア","首都ローマの中に、カトリックの中心で世界最小の国バチカン市国がある。工業が発達した北部と農業中心の南部の経済格差が大きい。"],
["ロシア","面積が世界最大の国。ウラル山脈を境に西がヨーロッパ、東がアジア（シベリア）。シベリアには冷帯のタイガと永久凍土が広がる。南西部の肥えた黒土地帯は小麦の産地。石油・天然ガスなどの鉱産資源が豊富で、パイプラインでヨーロッパなどに輸出している。"]]},
{c:"地理",t:"北アメリカの自然と人々",q:"北アメリカ州について、地形と気候、先住民と移民（ヒスパニックなど）、カナダとメキシコの特色、経済の結びつきと多国籍企業を説明せよ。",i:[
["地形","西部に険しいロッキー山脈、東部になだらかなアパラチア山脈。中央部をミシシッピ川が流れ、その流域に中央平原、西側にプレーリー（草原）とグレートプレーンズ（大平原）が広がる。北東部には五大湖がある。"],
["気候","北部は冷帯・寒帯、南部は温帯で、西部は乾燥帯が広がる。南東部には夏から秋にハリケーンがおそう。"],
["先住民と移民","先住民はネイティブアメリカン、北部にはイヌイット。そこへヨーロッパからの移民、奴隷として連れてこられたアフリカ系の人々、アジア系の人々が加わり、多民族国家となった。"],
["ヒスパニック","メキシコや中央アメリカ・カリブ海諸国などから移住したスペイン語を話す人々。アメリカ合衆国の南部に多く、農業や建設業などで働く人も多い。人口に占める割合が高まっている。"],
["カナダとメキシコ","カナダ：英語とフランス語が公用語で、多文化主義をとる。小麦や木材の生産が多い。メキシコ：スペイン語が公用語。アメリカ合衆国向けの工場が多い。"],
["経済の結びつき","アメリカ・カナダ・メキシコはNAFTA（北米自由貿易協定）で結びつき、現在はUSMCAに引き継がれている。アメリカ合衆国では、世界各地に生産や販売の拠点をもつ多国籍企業が発達し、大量生産・大量消費の生活様式や車社会が世界に広まった。"]]},
{c:"地理",t:"日本の地域区分と都道府県",q:"日本の地域区分について、都道府県の数と内訳、七地方区分とさらに細かい区分、面積・人口の最大と最小の都道府県、県名と県庁所在地名が異なるおもな例を説明せよ。",i:[
["都道府県","47都道府県（1都・1道・2府・43県）。都は東京都、道は北海道、府は大阪府と京都府。"],
["七地方区分","九州地方、中国・四国地方、近畿地方、中部地方、関東地方、東北地方、北海道地方。"],
["細かい区分","中国・四国地方は山陰・瀬戸内・南四国に、中部地方は東海・中央高地・北陸に分けられる。ほかに東日本と西日本、太平洋側と日本海側などの分け方もある。"],
["面積と人口","面積が最大は北海道、最小は香川県。人口が最多は東京都、最少は鳥取県。"],
["県庁所在地","県名と県庁所在地名が異なるおもな例：札幌市（北海道）、盛岡市（岩手県）、仙台市（宮城県）、水戸市（茨城県）、宇都宮市（栃木県）、前橋市（群馬県）、さいたま市（埼玉県）、横浜市（神奈川県）、金沢市（石川県）、甲府市（山梨県）、名古屋市（愛知県）、津市（三重県）、大津市（滋賀県）、神戸市（兵庫県）、松江市（島根県）、高松市（香川県）、松山市（愛媛県）、那覇市（沖縄県）。"]]},
{c:"地理",t:"日本の自然災害と防災",q:"日本の自然災害について、地震と津波、火山の災害と恵み、気象による災害、ハザードマップなどの防災の取り組み、自助・共助・公助を説明せよ。",i:[
["地震と津波","日本列島は複数のプレートの境界付近にあるため地震が多い。海溝付近で起きる地震は津波をともなうことがあり、2011年の東日本大震災では津波で大きな被害が出た。1995年の阪神・淡路大震災は都市の直下で起きた地震で、建物の倒壊や火災の被害が大きかった。埋め立て地などでは地面が液状化することもある。"],
["火山の災害と恵み","噴火による火山灰や火砕流などの被害がある（1991年の雲仙普賢岳の火砕流など）。一方で、温泉や地熱発電、美しい景観などの恵みももたらす。"],
["気象による災害","台風や梅雨前線・集中豪雨による洪水・土砂くずれ、やませによる冷害、雨の少ない地域の干害（水不足）、日本海側の雪害など。"],
["防災の取り組み","被害が予想される地域や避難場所・避難経路を示したハザードマップ（防災マップ）の作成、防潮堤や砂防ダムの建設、緊急地震速報など。過去の災害を伝える自然災害伝承碑は地図記号にもなっている。被害をできるだけ小さくする減災の考え方も大切。"],
["自助・共助・公助","自助：自分や家族の身を自分で守ること（避難経路の確認、非常用品の準備）。共助：地域の人々が助け合うこと（避難訓練、声かけ）。公助：国や地方公共団体による救助・支援。"]]},
{c:"地理",t:"身近な地域の調査",q:"身近な地域の調査について、調査の手順、調査の方法（文献調査・野外観察・聞き取り調査）、新旧の地形図の比較で読み取れること、調査結果のまとめ方と発表を説明せよ。",i:[
["調査の手順","テーマを決める→仮説を立てる→調査計画を立てる（方法・場所・準備するもの）→調査する→結果を整理して考察する→まとめて発表する。"],
["文献調査","図書館や市役所・博物館の資料、統計、インターネットなどで調べる。情報の出典を確認する。"],
["野外観察","実際に地域を歩いて観察する（フィールドワーク）。地形図をもとに観察するルートを決めたルートマップをつくり、気づいたことを記録したり写真をとったりする。"],
["聞き取り調査","地域の人や役所・商店などに話を聞く。事前に相手の了解を得て、質問内容を準備し、終わったらお礼を伝える。"],
["新旧の地形図の比較","発行年の異なる地形図を比べると、田や畑が住宅地に変わった、海岸が埋め立てられた、鉄道や道路ができたなど、土地利用の変化が読み取れる。"],
["まとめと発表","変化は折れ線グラフ、割合は円グラフや帯グラフ、量の比較は棒グラフで表す。分布は地図（ドットマップや階級区分図）にまとめる。レポートやポスター、プレゼンテーションで発表し、地域の課題と解決策を提案する。"]]}

function jaVoices(){if(!TTS)return [];return speechSynthesis.getVoices().filter(x=>/^ja/i.test(x.lang)||/Japanese|日本/.test(x.name));}
function voiceScore(v){const n=v.name;let s=0;if(/Natural|Online|Neural/i.test(n))s+=50;if(/Premium|Enhanced|拡張|プレミアム/i.test(n))s+=40;if(/Google/i.test(n))s+=25;if(/Nanami|Keita|Kyoko|O-ren|Otoya|Hattori/i.test(n))s+=10;if(v.localService===false)s+=5;return s;}
function pickVoice(){if(!TTS)return;const v=jaVoices();const saved=S.voice&&v.find(x=>x.name===S.voice);jaVoice=saved||v.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null;const sel=document.getElementById("vsel");if(sel&&!sel.dataset.filled)fillVoices();}

function readable(s){
  s=s.replace(YOMI_RX,m=>YOMI[m]);
  s=s.replace(/([\d円])→/g,"$1から").replace(/→/g,"、").replace(/＝/g,"、").replace(/〜/g,"から").replace(/＋/g,"と");
  s=s.replace(/（([^）]{1,12})）/g,"、$1、").replace(/[（(]/g,"、").replace(/[）)]/g,"、");
  s=s.replace(/([^\d])・([^\d])/g,"$1、$2").replace(/[①-⑩]/g,m=>(NUM.indexOf(m)+1)+"、").replace(/○/g,"まる").replace(/×/g,"ばつ").replace(/△/g,"さんかく").replace(/[「」『』]/g,"");
  return s.replace(/、{2,}/g,"、").replace(/、(?=[。！？])/g,"");
}
function chunks(s){return readable(s).split(/(?<=[。！？])/).map(x=>x.trim()).filter(Boolean);}
function ttsStop(){ttsTok++;if(TTS)speechSynthesis.cancel();document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));document.querySelectorAll(".sbtn[aria-pressed='true'],.mini[aria-pressed='true']").forEach(b=>{b.setAttribute("aria-pressed","false");if(b.dataset.label)b.textContent=b.dataset.label;});}
/* parts: [{text, el}] を順番に読む。読み終えたら done() */
function ttsPlay(parts,btn,done){
  ttsStop();if(!TTS)return;const tok=ttsTok;
  if(btn){btn.setAttribute("aria-pressed","true");btn.dataset.label=btn.dataset.label||btn.textContent;btn.textContent=btn.classList.contains("mini")?"■":"■ 停止";}
  const lines=[];parts.forEach(p=>chunks(p.text).forEach(t=>lines.push({t,el:p.el})));
  let i=0;
  const next=()=>{
    if(tok!==ttsTok)return;
    document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));
    if(i>=lines.length){ttsStop();done&&done();return;}
    const L=lines[i++];if(L.el){L.el.classList.add("reading");}
    const u=new SpeechSynthesisUtterance(L.t);u.lang=(jaVoice&&jaVoice.lang)||"ja-JP";if(jaVoice)u.voice=jaVoice;u.rate=S.rate;u.pitch=1;
    u.onend=next;u.onerror=()=>{if(tok===ttsTok)next();};
    speechSynthesis.speak(u);
  };
  next();
}

const YR_RX=/(?:紀元前)?\d{1,4}(?:年|世紀)(?:\d{1,2}月(?:\d{1,2}日)?)?/g;

function fmt(text,key){
  const marks=[];
  const add=(rx,cls)=>{rx.lastIndex=0;let m;while((m=rx.exec(text))){if(!m[0])break;marks.push([m.index,m.index+m[0].length,cls]);}};
  (KEYEXTRA[key]||[]).forEach(p=>{let i=-1;while((i=text.indexOf(p,i+1))>=0)marks.push([i,i+p.length,"kw"]);});
  add(YR_RX,"yr");add(KW_RX,"kw");
  marks.sort((a,b)=>a[0]-b[0]||(b[1]-b[0])-(a[1]-a[0]));
  let out="",pos=0;
  for(const [s,e,c] of marks){if(s<pos)continue;out+=esc(text.slice(pos,s))+`<b class="${c}">${esc(text.slice(s,e))}</b>`;pos=e;}
  return out+esc(text.slice(pos));
}

function today(){return ymd(new Date());}
function addDays(s,n){const [y,m,d]=s.split("-").map(Number);return ymd(new Date(y,m-1,d+n));}
