<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中3理科 期末対策 ｜ 天気・運動・力</title>
<style>
:root{
  --bg:#eef2f7; --paper:#fff; --ink:#1a2332;
  --primary:#1b4f8a;
  --weather:#b56a00; --motion:#1b4f8a; --force:#6c3fa0;
  --ok:#1f8a4c; --danger:#c0392b; --skip:#5a6b7d;
  --muted:#6b7a8d;
  --border:rgba(26,35,50,.12); --shadow:rgba(26,35,50,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;color:var(--ink);min-height:100vh;}

/* header */
header{background:var(--primary);color:#fff;position:sticky;top:0;z-index:100;border-bottom:3px solid #6fa3d8;}
.header-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px;}
.header-title{font-size:15px;font-weight:800;letter-spacing:1.5px;}
.header-title span{font-size:10px;opacity:.75;display:block;font-weight:400;letter-spacing:1px;}
.header-stats{display:flex;gap:14px;}
.stat{text-align:center;}
.stat-num{font-size:18px;font-weight:800;line-height:1;}
.stat-lbl{font-size:9px;letter-spacing:1px;opacity:.75;}
.stat.correct .stat-num{color:#7ecba1;}
.stat.wrong .stat-num{color:#f0a080;}
.stat.miss .stat-num{color:#ffd97a;}

main{max-width:820px;margin:0 auto;padding:16px 12px 80px;}
.screen{display:none;}
.screen.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* home hero */
.home-hero{text-align:center;padding:22px 16px 18px;background:var(--paper);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;box-shadow:0 2px 10px var(--shadow);}
.home-hero h2{font-size:19px;font-weight:800;color:var(--primary);letter-spacing:2px;margin-bottom:6px;}
.home-hero p{font-size:12px;color:var(--muted);line-height:1.8;}

.section-label{font-size:10px;letter-spacing:3px;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:10px;font-weight:600;}

/* mode grid */
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.mode-card{padding:15px 8px;background:var(--paper);border:2px solid var(--border);border-radius:9px;cursor:pointer;text-align:center;transition:all .2s;}
.mode-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px var(--shadow);}
.mode-card.miss-mode{border-color:rgba(192,57,43,.35);}
.mode-card.miss-mode:hover{border-color:var(--danger);background:rgba(192,57,43,.04);}
.mode-icon{font-size:22px;margin-bottom:5px;}
.mode-title{font-size:14px;font-weight:800;letter-spacing:1px;margin-bottom:2px;}
.mode-card.miss-mode .mode-title{color:var(--danger);}
.mode-desc{font-size:10px;color:var(--muted);line-height:1.4;}
.miss-count-badge{display:inline-block;background:var(--danger);color:#fff;font-size:10px;font-weight:600;border-radius:10px;padding:1px 8px;margin-top:4px;}

/* unit selection */
.unit-section{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px var(--shadow);}
.unit-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.unit-section-header h3{font-size:13px;font-weight:800;color:var(--primary);letter-spacing:1px;}
.unit-select-btns{display:flex;gap:5px;}
.unit-select-btn{padding:4px 10px;border:1px solid var(--border);background:var(--bg);border-radius:12px;font-size:11px;cursor:pointer;color:var(--muted);transition:all .15s;}
.unit-select-btn:hover{border-color:var(--primary);color:var(--primary);}
.unit-list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.unit-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:all .15s;background:var(--bg);}
.unit-item:hover{border-color:var(--primary);}
.unit-item.selected{border-color:var(--primary);background:rgba(27,79,138,.06);}
.unit-cb{width:17px;height:17px;border:2px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:#fff;transition:all .15s;}
.unit-item.selected .unit-cb{background:var(--primary);border-color:var(--primary);}
.unit-info{flex:1;min-width:0;}
.unit-name{font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.unit-count{font-size:10px;color:var(--muted);margin-top:1px;}
.subject-tag{font-size:9px;color:#fff;padding:1px 6px;border-radius:3px;font-weight:700;flex-shrink:0;}
.start-selected-btn{width:100%;margin-top:11px;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:700;letter-spacing:1.5px;cursor:pointer;transition:all .2s;}
.start-selected-btn:hover:not(:disabled){opacity:.88;}
.start-selected-btn:disabled{opacity:.35;cursor:not-allowed;}

/* stats */
.stats-section{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px var(--shadow);}
.stats-title{font-size:12px;font-weight:800;color:var(--primary);letter-spacing:2px;margin-bottom:12px;}
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.stat-subject{font-size:12px;color:var(--ink);width:36px;flex-shrink:0;}
.stat-bar-wrap{flex:1;height:11px;background:rgba(26,35,50,.08);border-radius:6px;overflow:hidden;}
.stat-bar{height:100%;border-radius:6px;transition:width .5s ease;}
.stat-pct{font-size:11px;font-weight:700;width:34px;text-align:right;flex-shrink:0;}
.stat-detail{font-size:10px;color:var(--muted);width:42px;text-align:right;flex-shrink:0;}
.stats-note{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5;}

/* miss list */
.miss-list-wrap{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px var(--shadow);}
.miss-list{display:flex;flex-direction:column;gap:5px;margin-top:8px;}
.miss-item{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--danger);border-radius:5px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.miss-item-q{font-size:12px;color:var(--ink);flex:1;line-height:1.5;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.miss-item-unit{font-size:10px;color:var(--muted);white-space:nowrap;}
.empty-msg{text-align:center;padding:22px;color:var(--muted);font-size:13px;line-height:1.8;}

.reset-link{text-align:center;margin-top:8px;}
.reset-link button{background:none;border:none;color:var(--muted);font-size:11px;text-decoration:underline;cursor:pointer;}

/* quiz */
.back-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:all .2s;margin-bottom:12px;}
.back-btn:hover{color:var(--primary);border-color:var(--primary);}
.quiz-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.progress-bar{flex:1;height:6px;background:rgba(26,35,50,.1);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(to right,var(--motion),var(--force));border-radius:3px;transition:width .4s ease;}
.progress-label{font-size:12px;font-weight:700;color:var(--primary);white-space:nowrap;}

.q-card{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:20px 18px;box-shadow:0 2px 12px var(--shadow);margin-bottom:12px;position:relative;overflow:hidden;}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(to right,var(--weather),var(--motion),var(--force));}
.q-meta{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.q-subject-tag{font-size:10px;color:#fff;padding:2px 8px;border-radius:3px;font-weight:700;}
.q-unit{font-size:11px;color:var(--muted);}
.q-review{font-size:10px;padding:1px 7px;border-radius:3px;font-weight:700;background:rgba(192,57,43,.12);color:var(--danger);}
.q-text{font-size:17px;font-weight:600;line-height:1.85;color:var(--ink);letter-spacing:.3px;}

/* mc */
.mc-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mc-btn{padding:14px 12px;border:2px solid var(--border);border-radius:7px;background:var(--paper);cursor:pointer;font-size:14px;font-weight:500;line-height:1.4;text-align:left;transition:all .15s;color:var(--ink);}
.mc-btn:hover:not(:disabled){border-color:var(--primary);background:rgba(27,79,138,.04);}
.mc-btn.correct{border-color:var(--ok);background:rgba(31,138,76,.1);color:var(--ok);font-weight:700;}
.mc-btn.wrong{border-color:var(--danger);background:rgba(192,57,43,.08);color:var(--danger);}
.mc-btn:disabled{cursor:default;}

/* qa reveal */
.reveal-btn{width:100%;padding:15px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s;}
.reveal-btn:hover{opacity:.88;}
.answer-box{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:16px 18px;box-shadow:0 2px 8px var(--shadow);animation:fadeIn .2s ease;}
.answer-label{font-size:9px;letter-spacing:3px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.answer-text{font-size:17px;font-weight:700;color:var(--primary);line-height:1.7;padding:11px 14px;background:rgba(27,79,138,.05);border-left:3px solid var(--primary);border-radius:3px;margin-bottom:10px;}
.explanation{font-size:13px;line-height:1.85;color:#445;background:rgba(181,106,0,.05);padding:9px 12px;border-radius:5px;}
.reveal-header{display:flex;align-items:center;gap:10px;padding:10px 18px;}
.reveal-mark{font-size:22px;}
.reveal-status{font-size:15px;font-weight:800;letter-spacing:1px;}
.correct-header{background:rgba(31,138,76,.08);}
.correct-header .reveal-status{color:var(--ok);}
.wrong-header{background:rgba(192,57,43,.06);}
.wrong-header .reveal-status{color:var(--danger);}

/* self check 3-button */
.self-check-wrap{margin-top:12px;}
.sc-hint{font-size:11px;color:var(--muted);text-align:center;margin-bottom:8px;}
.self-check{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.self-btn{padding:13px 8px;border:2px solid;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.5px;background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:2px;}
.self-btn span{font-size:10px;font-weight:400;opacity:.8;letter-spacing:0;}
.self-btn.know{border-color:var(--ok);color:var(--ok);}
.self-btn.know:hover{background:rgba(31,138,76,.08);}
.self-btn.dontknow{border-color:var(--danger);color:var(--danger);}
.self-btn.dontknow:hover{background:rgba(192,57,43,.06);}
.self-btn.skip{width:100%;border-color:var(--border);color:var(--skip);border-style:dashed;}
.self-btn.skip:hover{background:rgba(90,107,125,.06);border-color:var(--skip);}

/* result */
.result-card{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:28px 20px;text-align:center;box-shadow:0 2px 12px var(--shadow);margin-bottom:14px;}
.result-icon{font-size:38px;margin-bottom:8px;}
.result-big{font-size:62px;font-weight:900;line-height:1;color:var(--primary);}
.result-denom{font-size:13px;color:var(--muted);margin:6px 0 16px;letter-spacing:.5px;font-weight:600;}
.result-msg{font-size:14px;line-height:1.8;color:var(--ink);margin-bottom:20px;}
.result-actions{display:flex;flex-direction:column;gap:8px;}
.result-btn{padding:13px;border-radius:7px;font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .2s;border:2px solid;}
.result-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.result-btn.primary:hover{opacity:.88;}
.result-btn.secondary{background:transparent;color:var(--primary);border-color:var(--primary);}
.result-btn.secondary:hover{background:var(--primary);color:#fff;}
.result-btn.miss{background:var(--danger);color:#fff;border-color:var(--danger);}
.result-btn.miss:hover{opacity:.85;}

@media(max-width:520px){
  .unit-list{grid-template-columns:1fr;}
  .mc-options{grid-template-columns:1fr;}
  .q-text{font-size:16px;}
  .result-big{font-size:52px;}
  .header-title{font-size:13px;}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-title">
      <span>中3 1学期 期末テスト対策</span>
      理科 ｜ 天気・運動・力
    </div>
    <div class="header-stats">
      <div class="stat correct"><div class="stat-num" id="stat-correct">0</div><div class="stat-lbl">正解</div></div>
      <div class="stat wrong"><div class="stat-num" id="stat-wrong">0</div><div class="stat-lbl">間違い</div></div>
      <div class="stat miss"><div class="stat-num" id="stat-miss">0</div><div class="stat-lbl">要復習</div></div>
    </div>
  </div>
</header>

<main>
  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="home-hero">
      <h2>期末テスト 90点突破ドリル</h2>
      <p>「天気とその変化」「物体の運動」「力の合成と分解」の頻出問題を収録。<br>
      <b>間違えた問題だけ</b>をあとから復習できます。自信のない問題は<b>「カウントしない」</b>で気軽に確認OK。</p>
    </div>

    <div class="section-label">クイック出題</div>
    <div class="mode-grid">
      <div class="mode-card" onclick="startMode('all')">
        <div class="mode-icon">📋</div>
        <div class="mode-title">全問</div>
        <div class="mode-desc" id="total-count">全問に挑戦</div>
      </div>
      <div class="mode-card" onclick="startMode('shuffle')">
        <div class="mode-icon">🔀</div>
        <div class="mode-title">ランダム</div>
        <div class="mode-desc">20問シャッフル</div>
      </div>
      <div class="mode-card miss-mode" onclick="startMode('miss')">
        <div class="mode-icon">📌</div>
        <div class="mode-title">復習</div>
        <div class="mode-desc">間違えた問題だけ</div>
        <div class="miss-count-badge" id="miss-badge">0問</div>
      </div>
    </div>

    <div class="unit-section">
      <div class="unit-section-header">
        <h3>📚 単元を選んで出題</h3>
        <div class="unit-select-btns">
          <button class="unit-select-btn" onclick="selectAllUnits(true)">全選択</button>
          <button class="unit-select-btn" onclick="selectAllUnits(false)">解除</button>
        </div>
      </div>
      <div class="unit-list" id="unit-list"></div>
      <button class="start-selected-btn" id="start-selected-btn" onclick="startMode('selected')" disabled>
        単元を選んでください
      </button>
    </div>

    <div class="stats-section">
      <div class="stats-title">📊 分野別 達成度（要復習を除いた割合）</div>
      <div id="stats-list"></div>
      <div class="stats-note">※「わからなかった」で記録された問題が減るほど達成度が上がります。</div>
    </div>

    <div class="miss-list-wrap">
      <div class="section-label" style="border:none;margin-bottom:0">復習リスト（間違えた問題）</div>
      <div class="miss-list" id="miss-list-home"></div>
      <div class="reset-link"><button onclick="resetAll()">記録をすべてリセット</button></div>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz">
    <button class="back-btn" onclick="goHome()">← ホームへ</button>
    <div class="quiz-header">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-label" id="progress-label">0/0</div>
    </div>
    <div id="quiz-area"></div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <button class="back-btn" onclick="goHome()">← ホームへ</button>
    <div class="result-card">
      <div class="result-icon" id="result-icon">🔬</div>
      <div class="result-big" id="res-correct">0</div>
      <div class="result-denom" id="res-denom">/ 0問 正解</div>
      <div class="result-msg" id="res-msg"></div>
      <div class="result-actions">
        <button class="result-btn miss" id="res-miss-btn" onclick="startMode('miss')" style="display:none">間違えた問題を復習する</button>
        <button class="result-btn secondary" onclick="retryMode()">もう一度同じセットで</button>
        <button class="result-btn primary" onclick="goHome()">ホームに戻る</button>
      </div>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
